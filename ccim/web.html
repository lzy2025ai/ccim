const fileUrl = (chat, path) => `/api/file/-/${encodeURIComponent(String(path).split("/").pop() || "file")}?chat=${encodeURIComponent(chat)}&path=${encodeURIComponent(path)}`
  + (isRemote(ctxMachine) ? `&machine=${encodeURIComponent(ctxMachine)}` : "");

// 对话里发来的文件（zip、exe 等）。不开新窗口：主屏幕图标打开的网页，新窗口里没有登录状态。
// 主屏幕图标打开的网页下载不了文件：先在页面里取下来，再交给系统分享面板（存储到文件、隔空投送）。
const STANDALONE = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const fileGet = new Map();            // 地址 → {pct, ctl} 正在取；{file} 已取好
function fileChip(src, name){
  const g = fileGet.get(src), tip = !g ? "" : g.file ? "点一下保存" : `取文件 ${g.pct}%`;
  return `<a class="sentfile" href="${src}" download="${esc(name)}"${STANDALONE ? ` onclick="return saveFile(event,this)"` : ""}>${ICON.file}${esc(name)}<small class="sf-tip">${tip}</small></a>`;
}
function fileTip(src){
  const g = fileGet.get(src), tip = !g ? "" : g.file ? "点一下保存" : `取文件 ${g.pct}%`;
  document.querySelectorAll("a.sentfile").forEach(a => { if (a.getAttribute("href") === src) a.querySelector(".sf-tip").textContent = tip; });
}
async function shareGot(src){
  const g = fileGet.get(src);
  try { await navigator.share({files: [g.file]}); fileGet.delete(src); }
  catch (e){ if (e.name !== "NotAllowedError") fileGet.delete(src); }   // 取消了就放掉；没被允许（离点击太久）就等再点一下
  fileTip(src);
}
function saveFile(ev, a){
  if (!navigator.canShare) return true;
  ev.preventDefault();
  const src = a.getAttribute("href"), name = a.getAttribute("download"), g = fileGet.get(src);
  if (g && g.file){ shareGot(src); return false; }
  if (g){ g.ctl.abort(); fileGet.delete(src); fileTip(src); return false; }   // 取的时候再点一下：取消
  for (const [k, v] of fileGet) if (v.file){ fileGet.delete(k); fileTip(k); }   // 大文件只留一个在内存里
  const ctl = new AbortController();
  fileGet.set(src, {pct: 0, ctl}); fileTip(src);
  (async () => {
    try {
      const r = await fetch(src, {signal: ctl.signal});
      if (!r.ok) throw new Error(r.status === 401 ? "登录过期了，刷新页面重新登录。" : "文件取不到了。");
      const total = +r.headers.get("Content-Length") || 0, reader = r.body.getReader(), parts = [];
      let got = 0;
      for (;;){
        const {done, value} = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total){ fileGet.get(src).pct = Math.floor(got * 100 / total); fileTip(src); }
      }
      const file = new File(parts, name, {type: r.headers.get("Content-Type") || "application/octet-stream"});
      if (!navigator.canShare({files: [file]})){ fileGet.delete(src); fileTip(src); location.href = src; return; }
      fileGet.set(src, {file}); fileTip(src);
      shareGot(src);
    } catch (e){
      fileGet.delete(src); fileTip(src);
      if (e.name !== "AbortError") toast(e.message || "文件取不下来，再试一次。");
    }
  })();
  return false;
}

const stallSeen = new Set();
// 这些推送只动对话里的内容、或者上面已经就地改好 / 各自会刷新，列表用不着整份重取（#256）
const STATUS_EVENTS = new Set(["bg", "brief"]);   // 对话的状态，不是记录，下面另外处理
const LOCAL_EVENTS = new Set(["bg", "ctx", "brief", "edit", "file", "drop", "dev", "skills", "kb"]);
let esFails = 0;                  // 推送连续连不上几次了：重连间隔 5、10、20…秒，最长 1 分钟
function connectEvents(again){
  const es = new EventSource("/api/events");
  let lost = !!again;
  es.onmessage = e => onEvent(JSON.parse(e.data));
  es.onerror = () => {                   // 一般浏览器会自己重连；重启、部署时收到错误响应就彻底关了，要自己再连（#249）
    lost = true;
    if (es.readyState === EventSource.CLOSED) { clearTimeout(window._esT); window._esT = setTimeout(() => connectEvents(true), Math.min(60000, 5000 * 2 ** esFails++)); }
  };
  es.onopen = () => {                    // 断开期间错过的推送：重连后把列表和正开着的对话重新取一次（#98）
    esFails = 0;
    if (!lost) return;
    lost = false;
    refreshSoon();
    if (detail && !starting && !(detail.log || []).some(r => r.sending)) reloadChat().catch(() => {});
    pocketForward({type: "resync"});    // 右下角助理里嵌着的对话页也重新取一次（#294）
  };
}
function onEvent(ev){
    if (!EMBED) pocketForward(ev);
    if (ev.type === "idle") { refreshSoon(); return; }
    if (ev.type === "pairing") { pairEvent(ev); return; }   // 添加电脑：那台电脑走到哪一步了（#175）   // 一轮结束的状态记下了（#98）
    if (ev.type === "group") {            // 群成员、群聊说明改了（#15）
      if (detail && detail.id === ev.chat) { clearTimeout(window._grt); window._grt = setTimeout(async () => {
        if (!detail || detail.id !== ev.chat) return;
        const top = $("#thread") ? $("#thread").scrollTop : null;   // 正在往上翻的话留在原处
        await reloadChat(); if (top != null && $("#thread")) $("#thread").scrollTop = top;
      }, 300); }
      else refreshSoon();
      return;
    }
    pocketEvent(ev);
    if (SKC && ev.chat === SKC.id) { skcEvent(ev); return; }   // Skill 助手（#116）
    if (SIDE && ev.chat === SIDE.id) { sideEvent(ev); return; }   // 侧边对话（#196）
    if (SIDE && SIDE.log && ev.type === "progress" && String(ev.chat || "").startsWith(`m-${SIDE.id}-`)) {   // 侧边对话里被 @ 的（#290）
      if (ev.state === "working") SIDE.subs[ev.chat] = ev; else delete SIDE.subs[ev.chat];
      drawSide(); return;
    }
    if (ev.type === "drop") {             // 定时任务这次没什么要说的：对话里那条任务去掉（#122）
      if (detail && detail.id === ev.chat) { detail.log = detail.log.filter(r => r.id !== ev.id); drawThread(); }
      return;
    }
    const rec = {...ev};                  // 记录本身：外层的 chat 是「哪个对话的推送」，不是记录的字段（@ 回答自己的 chat 是它的子对话）
    delete rec.chat; delete rec.rec_chat;
    if (ev.rec_chat) rec.chat = ev.rec_chat;
    if (sched && ev.type === "schedule" && ev.schedule === sched.id){
      clearTimeout(window._st); window._st = setTimeout(() => { if (sched) openSchedule(sched.id); }, 300);
    }
    if (proj && ev.type === "project" && ev.project === proj.id){
      clearTimeout(window._pt); window._pt = setTimeout(() => { if (proj) openProject(proj.id, true); }, 300);
    }
    if (proj && ev.type === "progress" && proj.feed.some(r => r.chat === ev.chat)){
      if (ev.state === "working") proj.progress[ev.chat] = ev; else delete proj.progress[ev.chat];
      redrawProjThread();
    }
    if (ev.type === "progress"){          // 某个对话卡住 / 不卡了：刷新列表和任务面板（#109）
      const was = stallSeen.has(ev.chat), now = !!ev.stall && ev.state === "working";
      if (was !== now) { now ? stallSeen.add(ev.chat) : stallSeen.delete(ev.chat); refreshSoon(); }
    }
    if (detail && ev.type === "progress" && detail.log.some(r => r.type === "mention" && r.chat === ev.chat)){
      detail.sub_progress = detail.sub_progress || {};
      if (ev.state === "working") detail.sub_progress[ev.chat] = ev; else delete detail.sub_progress[ev.chat];
      drawThread();
    }
    if (detail && ev.chat === detail.id){
      if (ev.type === "progress"){
        detail.progress = ev.state === "working" ? ev : null;
        detail.busy = ev.state === "working";
        drawThread(); drawComposerState(); wsProgress(ev);
      } else if (ev.type === "ctx"){
        detail.ctx = ev.ctx; drawCtxRing(detail); redrawGroup();
      } else if (!STATUS_EVENTS.has(ev.type)) {   // 状态推送混进记录会让之后的下标和后台对不上，分叉就找不到那条（#288）
        if (ev.type === "mention" && rec.ctx && rec.agent) { detail.member_ctx = {...detail.member_ctx, [rec.agent]: rec.ctx}; redrawGroup(); }
        const i = ["card", "mention", "secret", "edit"].includes(ev.type) && ev.id ? detail.log.findIndex(r => r.type === ev.type && r.id === ev.id) : -1;
        const own = ev.type === "user" ? detail.log.findIndex(r => r.sending && r.text === (ev.text || "")) : -1;
        if (ev.type === "note" && detail.progress?.guess) { detail.busy = false; detail.progress = null; drawComposerState(); }   // 斜杠命令只回一句，不会开始干活
        if (own >= 0) detail.log[own] = rec;
        else if (i >= 0) detail.log[i] = ev.type === "card" ? rec : {...detail.log[i], ...rec, at: detail.log[i].at}; else detail.log.push(rec);
        drawThread();
        if (ev.type === "file" || ev.type === "edit") docChanged(rec, ev.chat);
        if (ev.type === "answer") wsAnswer(rec);
      }
    }
    if ((ev.type === "answer" || ev.type === "mention") && viewing(ev.chat)) markSeen(ev.chat, true);
    if (ev.type === "bg") {               // 后台任务开始、结束、走到下一步（#271）
      const c = chatById(ev.chat);
      if (c) { const n = (c.bg || []).length; c.bg = ev.tasks; if (n !== ev.tasks.length) renderList(); }
      if (detail && detail.id === ev.chat) { detail.bg = ev.tasks; drawThread(); }
    }
    if (ev.type === "brief") { const c = chatById(ev.chat); if (c) { c.brief = ev.brief; if (ev.title) c.title = ev.title; renderList(); } }
    if (ev.type === "ctx") { const c = chatById(ev.chat); if (c) c.ctx = ev.ctx; }
    if (ev.type === "dev") { clearTimeout(window._devt); window._devt = setTimeout(() => { loadState().then(drawAttention); if (current.view === "settings" && current.id === "dev") renderDev(true); }, 300); }
    if (ev.type === "skills") { skillsCache = null; if (current.view === "skills") { clearTimeout(window._skt); window._skt = setTimeout(route, 400); } }
    if (ev.type === "kb" && current.view === "kb") { clearTimeout(window._kt); window._kt = setTimeout(() => { kbCache = null; route(); }, 400); }
    if (ev.type === "progress" && ev.state === "working") { const c = S.chats.find(x => x.id === ev.chat); if (c ? !c.busy : unlisted(ev.chat)) refreshSoon(); }
    else if (!LOCAL_EVENTS.has(ev.type)) refreshSoon();
}

function narrow(){ return innerWidth <= 760; }

}
// 列表收起时的气泡（#220）：竖屏、手机上指着找回列表的按钮；关掉或点过那个按钮就不再出现
function listTip(){
  requestAnimationFrame(() => {
    let tip = document.querySelector(".list-tip");
    let done = false; try { done = !!localStorage.getItem("ccim.listTip"); } catch {}

const SLASH = [
  ["/queue", "排在后面，手头这件做完再处理", "内容"],
  ["/stop", "停下正在做的事"],
  ["/skip", "某一步卡住了：结束这一步，接着做"],
  ["/status", "当前状态"],
  ["/usage", "额度和用量", "", "claude"],
  ["/model", "换模型", "名字"],
  ["/effort", "换思考深度", "等级"],

function slashTyped(){
  const i = $("#input"), v = i.value.slice(0, i.selectionStart), m = /^\/(\S*)$/.exec(v);   // 光标前面是 /xxx 就提示，后面已有的文字留着
  const old = document.querySelector(".pop.slash:not(.ref)");
  const hits = m ? SLASH.filter(([k, , , only]) => k.startsWith("/" + m[1].toLowerCase()) && (!only || (detail.base || "claude") === only)) : [];
  if (!hits.length || hits.length === 1 && hits[0][0] === v) { if (old) old.remove(); return; }
  if (old && old.dataset.v === v) return;
  const on = old ? Math.min(+old.dataset.on || 0, hits.length - 1) : 0;
  const p = pop({currentTarget: $("#box"), stopPropagation(){}}, hits.map(([k, d, arg], i) =>
    `<button class="${i === on ? "on" : ""}" onmousedown="event.preventDefault()" onclick="slashPick(${q(k)}, ${arg ? 1 : 0})"><b>${esc(k)}${arg ? ` <span class="arg">${esc(arg)}</span>` : ""}</b><span class="desc">${esc(d)}</span></button>`).join(""));
  p.classList.add("slash"); p.dataset.v = v; p.dataset.on = on;
}
function slashPick(k, arg){   // 回车、Tab、点选都只填进输入框，再按回车才发出（免得误触）
  const i = $("#input"), rest = i.value.slice(i.selectionStart).replace(/^\s+/, ""), head = k + (arg || rest ? " " : "");
  i.value = head + rest;
  closePop(); i.focus(); i.setSelectionRange(head.length, head.length);
  drawComposerState();
}
function slashKey(e){
  const p = document.querySelector(".pop.slash"); if (!p || e.isComposing) return false;
  const bs = [...p.querySelectorAll("button")], on = +p.dataset.on || 0;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const n = (on + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length;
    bs.forEach((b, i) => b.classList.toggle("on", i === n)); p.dataset.on = n; bs[n].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && !e.shiftKey || e.key === "Tab") bs[on].click();
  else if (e.key === "Escape") { p.remove(); e.stopPropagation(); }
  else return false;
  e.preventDefault();
  return true;
}
function liveOfMention(r){

  const first = detail.log.find(x => x.type === "mention" && x.chat === r.chat && x.state === "queued");
  return first && first.id === r.id ? p : null;
}
function mentionActs(i, r, live){

  return `<div class="msg-acts">${btns.join("")}${msgTime(r.done_at || r.at)}</div>`;
}
function mentionGroup(mid){

async function copyMsg(btn, src, i){

    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();

let pendingFiles = [];
function drawPending(){

  el.innerHTML = pendingFiles.map((f, i) => f.url || f.thumb

  el.style.display = pendingFiles.length ? "flex" : "none";

function dropPending(i){
  const [f] = pendingFiles.splice(i, 1); if (f && f.url) URL.revokeObjectURL(f.url);
  saveFiles(); drawPending(); drawComposerState();
}
// 加上了、还没发出去的图片和文件也跟着输入框记住（#148）：每个输入框一份，图片另存一张小缩略图，刷新后也能显示
const filesKey = k => DRAFT + "files:" + k;
function storedFiles(k){ try { return JSON.parse(localStorage.getItem(filesKey(k)) || "[]"); } catch { return []; } }
function putFiles(k, list){
  const keep = list.filter(f => f.key).map(({name, key, size, thumb}) => ({name, key, size, thumb}));
  try { keep.length ? localStorage.setItem(filesKey(k), JSON.stringify(keep)) : localStorage.removeItem(filesKey(k)); } catch {}
}
function saveFiles(){ if (draftKeys.input) putFiles(draftKeys.input, pendingFiles); }
function useFiles(k){   // 换到 k 这个输入框：拿出它记着的；还是同一个就不动
  if (draftKeys.input !== k) pendingFiles = storedFiles(k);
  draftKeys.input = k;
  drawPending();
}
async function thumbOf(file){
  try {
    const img = await createImageBitmap(file), r = Math.min(1, 240 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .8);
  } catch { return null; }
}
const isImg = name => /\.(png|jpe?g|gif|webp|svg)$/i.test(name || "");
const isVideo = name => /\.(mp4|m4v|mov|webm)$/i.test(name || "");

async function addFiles(list){
  for (const file of list){
    const f = {name: file.name || "粘贴的图片.png"}, k = draftKeys.input;
    const image = (file.type || "").startsWith("image/") || isImg(f.name);
    if (image) f.url = URL.createObjectURL(file);
    pendingFiles.push(f); drawPending();
    try {
      const r = await fetch("/api/upload", {method: "POST", headers: {"X-CCIM": "1", "X-Name": encodeURIComponent(f.name), ...remoteHeader(ctxMachine)}, body: file});
      const d = await r.json(); if (!r.ok) throw new Error(d.error || "上传失败");
      Object.assign(f, d);
      if (image) f.thumb = await thumbOf(file);
      if (!pendingFiles.includes(f) && k === draftKeys.input) pendingFiles.push(f);   // 传的时候离开过又回来了
      if (pendingFiles.includes(f)) saveFiles();
      else if (k) putFiles(k, [...storedFiles(k), f]);   // 传完时在别的对话里：记到原来那个对话名下
    } catch (e) { pendingFiles = pendingFiles.filter(x => x !== f); toast(`${f.name} 没传上：${e.message}`); }
    drawPending(); drawComposerState();
  }
}
function dropZone(el){
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag"); });
  el.addEventListener("dragleave", () => el.classList.remove("drag"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("drag"); addFiles(e.dataTransfer.files); });
}

function skcFit(){ const ta = $("#skc-in"); if (!ta) return; ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, 220) + "px"; }
function skcResizer(){   // 内容和助手之间的分隔线：拖动改宽度，记住；双击恢复
  const shell = document.querySelector(".sk-shell"), rz = $("#skc-rz"); if (!shell || !rz) return;
  try { const w = +localStorage.getItem("ccim.skcW"); if (w) shell.style.setProperty("--skc-w", w + "px"); } catch {}
  let start = null;
  rz.onpointerdown = e => { e.preventDefault(); start = {x: e.clientX, w: $("#sk-chat").getBoundingClientRect().width}; rz.classList.add("drag"); document.body.classList.add("resizing"); try { rz.setPointerCapture(e.pointerId); } catch {} };
  rz.onpointermove = e => {
    if (!start) return;
    const max = Math.min(900, shell.getBoundingClientRect().width - 420);
    shell.style.setProperty("--skc-w", Math.round(Math.min(Math.max(start.w - (e.clientX - start.x), 340), max)) + "px");
  };
  rz.onpointerup = rz.onpointercancel = () => {
    if (!start) return;
    start = null; rz.classList.remove("drag"); document.body.classList.remove("resizing");
    try { localStorage.setItem("ccim.skcW", Math.round($("#sk-chat").getBoundingClientRect().width)); } catch {}
  };
  rz.ondblclick = () => { shell.style.removeProperty("--skc-w"); try { localStorage.removeItem("ccim.skcW"); } catch {} };
}
async function skcSend(text){
  const ta = $("#skc-in"), v = (text || (ta ? ta.value : "")).trim();
  if (!v || !SKC || !SKC.id) return;
  if (ta) { ta.value = ""; saveDraft("skc-in"); }
  SKC.log.push({type: "user", text: v, sending: true});
  if (!SKC.busy) SKC.progress = {steps: [], text: ""};
  SKC.busy = true; drawSkChat();
  try { await api("/api/chat/send", {id: SKC.id, text: v, files: [], ctx: skcCtx()}, SKC.mid); }
  catch (e) { toast(e.message); SKC.log = SKC.log.filter(r => !r.sending); SKC.busy = false; SKC.progress = null; drawSkChat();
    const t = $("#skc-in"); if (t && !t.value && !text) { t.value = v; saveDraft("skc-in"); skcFit(); } }
}
async function skcStop(){ if (SKC && SKC.id) await act(() => api("/api/chat/stop", {id: SKC.id}, SKC.mid)); }

function skcEvent(ev){   // 推送：进度、记录
  if (!SKC || ev.chat !== SKC.id) return;
  const rec = {...ev}; delete rec.chat;
  if (ev.type === "progress") { SKC.progress = ev.state === "working" ? ev : null; SKC.busy = ev.state === "working"; }
  else if (ev.type === "user") { const i = SKC.log.findIndex(r => r.sending && r.text === ev.text); i >= 0 ? SKC.log[i] = rec : SKC.log.push(rec); }
  else if (["answer", "note", "card"].includes(ev.type)) {
    const i = ev.type === "card" ? SKC.log.findIndex(r => r.type === "card" && r.id === ev.id) : -1;
    i >= 0 ? SKC.log[i] = rec : SKC.log.push(rec);
    if (ev.type === "answer") SKC.progress = null;
  } else return;
  drawSkChat();
}

function skTreeOf(files){
  const root = {dirs: {}, files: []};
  for (const f of files) {
    const parts = f.split("/"); let n = root;
    parts.slice(0, -1).forEach((p, i) => { n = n.dirs[p] = n.dirs[p] || {path: parts.slice(0, i + 1).join("/"), dirs: {}, files: []}; });
    n.files.push(f);
  }
  return root;
}
function drawSkTree(){
  const el = $("#sk-tree"); if (!el) return;
  const walk = (n, depth) => Object.keys(n.dirs).sort().map(k => {
    const d = n.dirs[k], open = SKV.open.has(d.path);
    return `<button class="sk-node dir" style="--d:${depth}" aria-expanded="${open}" onclick="skToggleDir(${q(d.path)})">${open ? ICON.down : ICON.chev}${ICON.folder}<span>${esc(k)}</span></button>`
      + (open ? walk(d, depth + 1) : "");
  }).join("") + n.files.map(f => `<button class="sk-node ${SKV.file === f ? "on" : ""}" style="--d:${depth}" onclick="skOpenFile(${q(f)})">${ICON.file}<span>${esc(f.split("/").pop())}</span></button>`).join("");
  el.innerHTML = walk(skTreeOf(SKV.s.files), 0);
}
function skToggleDir(p){ SKV.open.has(p) ? SKV.open.delete(p) : SKV.open.add(p); drawSkTree(); }
async function skOpenFile(path, first){

  path.split("/").slice(0, -1).forEach((_, i, a) => SKV.open.add(a.slice(0, i + 1).join("/")));   // 打开文件所在的文件夹

// ---- 代码高亮：常见语言的注释、字符串、关键字、数字（不求完整，看着清楚就行） ----
const HL_KW = {
  js: "async await break case catch class const continue default delete do else export extends false finally for from function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield",
  py: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield",
  sh: "if then else elif fi for in do done while until case esac function return local export echo exit set source",
  go: "break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false",
  rs: "as async await break const continue crate else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while",
};
const HL_ALIAS = {mjs: "js", cjs: "js", ts: "js", tsx: "js", jsx: "js", json: "json", yaml: "yaml", yml: "yaml", toml: "yaml", bash: "sh", zsh: "sh", rb: "py", go: "go", rs: "rs", java: "js", c: "js", h: "js", cpp: "js", css: "css"};
function hlMarkup(text){          // HTML / XML：标签名、属性名、属性值、注释
  return text.replace(/<!--[\s\S]*?-->|<[^<>]*>|[^<]+|</g, t => {
    if (t.startsWith("<!--")) return `<span class="hl-c">${esc(t)}</span>`;
    if (!/^<[\/!?A-Za-z]/.test(t) || !t.endsWith(">")) return esc(t);
    return t.replace(/^(<\/?[!?]?)([\w:.-]*)|("[^"]*"|'[^']*')|([\w:@.-]+)(?==)|[^"'\w]+|[\s\S]/g, (m, open, name, str, attr) =>
      open !== undefined ? `${esc(open)}<span class="hl-t">${esc(name)}</span>` : str ? `<span class="hl-s">${esc(str)}</span>` : attr ? `<span class="hl-k">${esc(attr)}</span>` : esc(m));
  });
}
function hlMd(text){              // Markdown 源码：标题、列表符号、代码块、行内代码、链接
  let fence = false;
  return text.split("\n").map(l => {
    if (/^\s*(```|~~~)/.test(l)) { fence = !fence; return `<span class="hl-c">${esc(l)}</span>`; }
    if (fence) return `<span class="hl-s">${esc(l)}</span>`;
    if (/^#{1,6}\s/.test(l)) return `<span class="hl-w">${esc(l)}</span>`;
    if (/^\s*>/.test(l)) return `<span class="hl-c">${esc(l)}</span>`;
    const m = /^(\s*)([-*+]|\d+\.)(\s.*)$/.exec(l);
    const inline = x => esc(x).replace(/`[^`]+`/g, c => `<span class="hl-s">${c}</span>`).replace(/\[[^\]]*\]\([^)]*\)/g, c => `<span class="hl-k">${c}</span>`);
    return m ? `${m[1]}<span class="hl-n">${esc(m[2])}</span>${inline(m[3])}` : inline(l);
  }).join("\n");
}
function hlCode(text, ext){
  if (["html", "htm", "xml", "svg", "vue", "plist"].includes(ext)) return hlMarkup(text);
  if (["md", "markdown", "mdx"].includes(ext)) return hlMd(text);
  const lang = HL_ALIAS[ext] || ext;
  const hash = ["py", "sh", "yaml", "md"].includes(lang), slash = ["js", "go", "rs", "css", "json"].includes(lang);
  const kws = new Set((HL_KW[lang] || "").split(" ").filter(Boolean));
  const parts = [hash ? "#[^\\n]*" : null, slash ? "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/" : null,
    lang === "py" ? '"""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'' : null,
    "\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'" + (lang === "js" ? "|`(?:\\\\.|[^`\\\\])*`" : ""),
    "\\b\\d+(?:\\.\\d+)?\\b", "[A-Za-z_$][\\w$]*"].filter(Boolean);
  const re = new RegExp(parts.join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(text))) {
    const t = m[0];
    out += esc(text.slice(last, m.index));
    const cls = /^(#|\/\/|\/\*)/.test(t) && (hash || slash) ? "c" : /^["'`]/.test(t) ? (/^\s*:/.test(text.slice(re.lastIndex)) && ["json", "yaml"].includes(lang) ? "k" : "s")
      : /^\d/.test(t) ? "n" : kws.has(t) ? "w" : lang === "yaml" && /^\s*:/.test(text.slice(re.lastIndex)) && /(^|\n)\s*(- )?$/.test(text.slice(0, m.index)) ? "k" : "";
    out += cls ? `<span class="hl-${cls}">${esc(t)}</span>` : esc(t);
    last = re.lastIndex;
  }
  return out + esc(text.slice(last));
}
function codeView(text, ext){
  const lines = hlCode(text, ext).split("\n");
  return `<pre class="sk-code"><code>${lines.map((l, i) => `<span class="ln">${i + 1}</span>${l}`).join("\n")}</code></pre>`;
}

function selTool(){
  document.querySelector(".seltool")?.remove();
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !detail) return;
  if (wsSelTool(sel)) return;
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const ans = node && node.closest("#thread .answer");
  if (!ans || !ans.contains(sel.focusNode)) return;
  const text = sel.toString().trim();
  if (text.length < 2) return;
  const anc = [...document.querySelectorAll("#thread .anc")].filter(a => a.compareDocumentPosition(ans) & Node.DOCUMENT_POSITION_FOLLOWING).pop();
  const i = anc ? +anc.id.slice(4) : -1;
  if (i < 0) return;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  const t = document.createElement("div"); t.className = "seltool";
  const side = !detail.readonly && !detail.mention_of;
  t.innerHTML = `<button>${ICON.save}存到知识库</button><button>${ICON.quote}引用</button>${side ? `<button>${ICON.side}侧边对话</button>` : ""}`;
  t.style.left = Math.max(8, rect.left) + "px"; t.style.top = Math.max(8, rect.top - 40) + "px";
  t.addEventListener("mousedown", e => e.preventDefault());
  const [sv, qt, ask] = t.querySelectorAll("button");
  sv.onclick = () => { t.remove(); saveToKb("log", i, text); };
  qt.onclick = () => { t.remove(); addQuote(text); };
  if (ask) ask.onclick = () => { t.remove(); getSelection().removeAllRanges(); openSide(text); };
  document.body.append(t);
}

async function connectAgent(aid, channel, then){   // then：接好后接着做的事（比如把对话转过去）
  const label = channel === "feishu" ? "飞书" : "微信";
  let job = await act(() => api("/api/agent/connect", {id: aid, channel}));
  dialog(`接到${label}`, `<div id="jobbox" style="text-align:center;min-height:280px"><p class="muted">准备二维码…</p></div>`, `<button class="btn" onclick="closeDialog()">关闭</button>`);
  while (document.querySelector("#jobbox")){
    const box = $("#jobbox");
    if (job.state === "scan") box.innerHTML = `<p>用手机${label}扫码${channel === "feishu" ? "，确认后会在你的飞书账号下建好一个机器人" : "登录"}</p><div class="qr">${job.qr}</div>
      <p class="muted" style="font-size:12px">扫不了的话，在手机${label}里打开：<a href="${esc(job.link)}" target="_blank">这个链接</a></p>`;
    else if (job.state === "starting") box.innerHTML = `<p class="muted">扫好了，正在启动…</p>`;
    else if (job.state === "done" && then) { closeDialog(); await loadState(); return then(); }
    else if (job.state === "done") { box.innerHTML = `<h3 style="font:600 18px var(--song)">接好了</h3><p>${channel === "feishu" ? `在飞书里找「${esc(job.bot)}」发消息就行。` : `在微信里打开「微信ClawBot」发消息就行。`}</p>`; await loadState(); renderAgent(aid); return; }
    else if (job.state === "error") { box.innerHTML = `<p class="state-err">${esc(job.error)}</p>`; return; }
    await new Promise(r => setTimeout(r, 1200));
    try { job = await api(`/api/job?id=${job.id}`); } catch (e) { box.innerHTML = `<p class="state-err">${esc(e.message)}</p>`; return; }
  }
}

  catch (e) { $("#main").innerHTML = `<div class="empty"><h2>打不开这个项目</h2><p>${esc(e.message)}</p></div>`; return; }
  const v = keepInput && $("#input") ? $("#input").value : "";
  rcpt = rcpt.filter(r => proj.members.includes(r));
  drawProject();
  if (v) $("#input").value = v;
}
function chipsOf(ids){ return ids.map(id => `<span class="at">@${esc((agentOf(id) || {name: "已删除的 Agent"}).name)}</span>`).join(" "); }
function liveOf(r){
  // 排队中的回答：它所在的对话正在干活、而且它是那个对话里最早没做完的一件，就是正在做的这件
  if (r.state !== "queued") return null;
  const p = proj.progress[r.chat]; if (!p) return null;
  const first = proj.feed.find(x => x.type === "reply" && x.chat === r.chat && x.state === "queued");
  return first && first.id === r.id ? p : null;
}
function stateLabel(r, live){
  if (live) return `<span class="status busy"><i></i>干活中</span>`;
  if (r.type === "mention" && r.state === "queued" && detail && detail.log) {     // 只有前面真有它没做完的活才算排队；轮到它了、进度还没到时是准备中
    const first = detail.log.find(x => x.type === "mention" && x.chat === r.chat && x.state === "queued");
    if (!first || first.id === r.id) return `<span class="status busy"><i></i>准备中</span>`;
  }
  return {done: `<span class="status on"><i></i>完成${r.elapsed ? `，用时 ${fmtSec(r.elapsed)}` : ""}</span>`,
          queued: `<span class="status"><i></i>排队中，前面的做完就开始</span>`,
          error: `<span class="status err"><i></i>出错了</span>`, stopped: `<span class="status"><i></i>停下了</span>`,
          lost: `<span class="status"><i></i>没做完（ccim 重启过）</span>`}[r.state] || "";
}
// 某一步卡住了（#109）：这一步多久没进展，「结束这一步」让它接着做
const mins = s => Math.max(1, Math.floor((s || 0) / 60));
function stallText(st, full){ return full ? `「${esc(st.step)}」${mins(st.secs)} 分钟没有进展` : `卡住 ${mins(st.secs)} 分钟`; }
function stallBar(p, chat, machine){
  const st = p && p.stall; if (!st || !chat) return "";
  return `<div class="stallbar"><span>「${esc(st.step)}」已经 ${mins(st.secs)} 分钟没有进展</span>
    <button class="btn" onclick="skipStep(${q(chat)},${q(machine || "")})">结束这一步，接着做</button></div>`;
}
async function skipStep(chat, machine){
  const r = await act(() => api("/api/chat/skip", {id: chat}, machine || undefined));
  toast(r.skipped ? "结束了这一步，它会接着做" : "这一步已经有结果了");
}
function fmtSec(s){ s = Math.round(s || 0); return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${String(s % 60).padStart(2, "0")} 秒`; }
function replyBody(r, live){
  if (live){
    const last = live.steps[live.steps.length - 1];
    const head = `<span class="spin"></span>${live.retry ? `网络不稳，正在重试（第 ${live.retry} 次）` : last ? "正在" + esc(last) : "思考中"}`;
    return flowHtml(live.steps, live.said, {head, open: true}) + stallBar(live, r.chat, r.machine || ctxMachine) + liveText(live);
  }
  return flowHtml(r.steps, r.said, {final: r.text}) + (r.text ? `<div class="answer ${r.state === "error" ? "state-err" : ""}">${md(r.text)}</div>` : "");
}
function chatLink(r, label){   // 项目里某个 Agent 的对话（可能在别的电脑上）
  return `<a class="link" href="#/chats/${encodeURIComponent(r.chat)}" onclick="ctxMachine=${q(r.machine || ownerOf(proj.id) || S.me)}">${label}</a>`;
}
function replyActs(r, live){
  const a = agentOf(r.agent);
  if (live || r.state === "queued") return `<div class="acts-row"><button class="link danger-link" onclick="stopReply(${q(r.task)},${q(r.agent)})">停下</button></div>`;
  if (r.state !== "done") return `<div class="acts-row">${chatLink(r, "单独聊")}</div>`;
  return `<div class="acts-row"><button class="link" onclick="forward(${q(r.task)},${q(r.agent)})">转给…</button>${chatLink(r, "单独聊")}</div>`;
}
function taskHtml(t){
  const qa = t.quote ? agentOf(t.quote.agent) : null;
  return `<div class="msg me"><div>
      ${t.quote ? `<div class="quote">${seal(qa, "sm", false)}<span>${esc(t.quote.text.replace(/\s+/g, " ").slice(0, 120))}</span></div>` : ""}
      <div class="bubble">${chipsOf(t.to)} ${esc(t.text)}</div>
      <div class="meta-r">${t.compare ? `<span class="tag">各做一份，对比结果</span>` : ""}<span>${whenTs(t.at)}</span></div></div></div>`;
}
function replyHtml(r){
  const a = agentOf(r.agent) || {name: "已删除的 Agent", base: "claude"}, live = liveOf(r);
  return `<div class="msg"><div class="from-row">${seal(a, "sm", false)}<b>${esc(a.name)}</b><span class="tag">${BASE[a.base || "claude"]}</span>${whereTag(r.agent, ownerOf(proj.id) || S.me)}${stateLabel(r, live)}</div>
    ${replyBody(r, live)}${replyActs(r, live)}</div>`;
}
function compareHtml(t, rs){
  return `<div class="msg"><div class="compare">${rs.map(r => {
    const a = agentOf(r.agent) || {name: "已删除的 Agent", base: "claude"}, live = liveOf(r);
    const merge = r.state === "done" && r.branch ? (r.chosen ? `<span class="status on"><i></i>已用这个，改动合并进项目目录了</span>`
      : `<button class="btn" onclick="showDiff(${q(r.task)},${q(r.agent)})">看改动</button><button class="btn primary" onclick="choose(${q(r.task)},${q(r.agent)})">用这个</button>`) : "";
    return `<div class="col ${r.chosen ? "chosen" : ""}"><div class="from-row">${seal(a, "sm", false)}<b>${esc(a.name)}</b><span class="tag">${BASE[a.base || "claude"]}</span>${whereTag(r.agent, ownerOf(proj.id) || S.me)}</div>
      <div style="margin:-2px 0 8px">${stateLabel(r, live)}</div>
      ${r.branch ? `<div class="branch">${ICON.branch}${esc(r.branch)}${r.changed ? `<span class="muted">　${esc(r.changed)}</span>` : ""}</div>` : ""}
      ${replyBody(r, live)}
      ${merge ? `<div class="acts-row">${merge}</div>` : ""}${replyActs(r, live)}</div>`; }).join("")}</div></div>`;
}
function projThread(){
  const p = proj;
  const tasks = p.feed.filter(f => f.type === "task");
  let html = tasks.length ? "" : `<div class="empty" style="margin-top:12vh"><h2>${esc(p.name)}</h2><p>${p.members.length ? "输入 @ 选一个或几个 Agent，写上要做的事，就派出去了。" : "先在右上角「成员」里拉几个 Agent 进来。"}</p></div>`;
  for (const t of tasks){
    html += taskHtml(t);
    const rs = p.feed.filter(x => x.type === "reply" && x.task === t.id);
    html += t.compare ? compareHtml(t, rs) : rs.map(replyHtml).join("");
  }
  return html;
}
function redrawProjThread(){
  const t = $("#thread"); if (!t || !proj) return;
  const near = t.scrollHeight - t.scrollTop - t.clientHeight < 120;
  t.innerHTML = projThread();
  if (near) t.scrollTop = t.scrollHeight;
}
function whenTs(sec){
  if (!sec) return "";
  const d = new Date(sec * 1000), pad = n => String(n).padStart(2, "0");
  return when(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`);
}

                                    : "几个 Agent 在同一个目录里一起做，各自负责的部分写清楚，免得改到一起。")

            <textarea id="input" rows="2" placeholder="输入 @ 选 Agent，再写要做的事" aria-label="派活"></textarea>
            <div class="bar"><div class="opts">

              <button class="send" aria-label="派出去" onclick="dispatch()">${ICON.up}</button>

          </div>

        </div>
      </div>

  drawRcpt();
  const t = $("#thread"); t.scrollTop = t.scrollHeight;
  const i = $("#input");
  i.value = keep; loadDraft("p:" + p.id);

    if (e.key === "@" && !e.isComposing) setTimeout(() => atMenu({currentTarget: $("#atchip"), stopPropagation(){}}), 0);
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); dispatch(); }
  });
}
function drawRcpt(){
  const box = $("#rcpt"); if (!box) return;
  box.innerHTML = rcpt.length ? rcpt.map(r => `<span class="at">@${esc((agentOf(r) || {}).name || "")}<button aria-label="去掉" onclick="rcpt=rcpt.filter(x=>x!==${q(r)});drawProject()">${ICON.x}</button></span>`).join("")
                              : `<span class="muted" style="font-size:12px">先 @ 选派给谁</span>`;
}
function membersPanel(p){
  const pm = ownerOf(p.id) || S.me;

  return `<aside class="members"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font:600 15px var(--song)">成员</b><button class="icon-btn" aria-label="收起" onclick="showMembers=false;drawProject()">${ICON.x}</button></div>
    ${p.members.map(m => { const a = agentOf(m); if (!a) return ""; const far = whereTag(m, pm);
      return `<div class="mem">${seal(a)}<span class="t" style="flex:1;min-width:0"><span class="title">${esc(a.name)} ${far}</span><span class="sub">${a.busy ? esc(a.doing || "干活中") : BASE[a.base || "claude"]}</span>${far ? `<span class="sub" style="color:var(--faint)">在自己的电脑上干活，看不到这个项目的文件</span>` : ""}</span>

function atMenu(e){
  const p = proj;
  if (!p.members.length) { toast("先在「成员」里拉几个 Agent 进来"); showMembers = true; drawProject(); return; }
  const pp = pop(e, `<div class="sec">派给谁（可以多选）</div>`
    + `<button onclick="rcpt=[...proj.members];closePop();drawProject()"><span><div>所有人</div><div class="desc">${p.members.length} 个 Agent</div></span></button>`
    + p.members.map(m => { const a = agentOf(m); if (!a) return "";
      return `<button data-m="${esc(m)}">${seal(a, "sm", false)}<span><div>${esc(a.name)}</div><div class="desc">${BASE[a.base || "claude"]}${a.busy ? "，正在干活" : ""}</div></span>${rcpt.includes(m) ? `<span class="ck">✓</span>` : ""}</button>`; }).join("")
    + `<button onclick="closePop();quickAgent()">${ICON.plus}新建一个 Agent 拉进来</button>`);

    const ck = b.querySelector(".ck"); if (ck) ck.remove(); else b.insertAdjacentHTML("beforeend", `<span class="ck">✓</span>`);
    drawRcpt();

  setTimeout(() => addEventListener("click", done, {once: true}), 0);
}
async function dispatch(){
  const v = $("#input").value.trim();
  if (!rcpt.length) return toast("先 @ 选派给谁");
  if (!v) return $("#input").focus();
  const body = {id: proj.id, text: v, to: rcpt, compare: rcpt.length > 1 && compareMode, quote: quote ? {task: quote.task, agent: quote.agent} : null};
  $("#input").value = ""; saveDraft();
  try { await act(() => api("/api/project/dispatch", body)); }
  catch (e) { $("#input").value = v; saveDraft(); return; }
  rcpt = []; quote = null; await openProject(proj.id); loadState();
}
async function stopReply(task, agent){ await act(() => api("/api/project/stop", {id: proj.id, task, agent}), "正在停下"); }
function forward(tid, aid){
  const r = proj.feed.find(x => x.type === "reply" && x.task === tid && x.agent === aid);
  quote = {task: tid, agent: aid, text: r.text || ""};
  rcpt = []; drawProject(); toast("选一个 Agent，写上要它接着做什么");
  setTimeout(() => atMenu({currentTarget: $("#atchip"), stopPropagation(){}}), 50);
}
async function showDiff(tid, aid){
  const d = await act(() => api(`/api/project/diff?id=${encodeURIComponent(proj.id)}&task=${encodeURIComponent(tid)}&agent=${encodeURIComponent(aid)}`));
  const lines = (d.diff || "没有改文件。").split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "d-add" : l.startsWith("-") && !l.startsWith("---") ? "d-del" : l.startsWith("@@") ? "d-hunk" : ""}">${esc(l)}</span>`).join("\n");
  dialog(`「${(agentOf(aid) || {}).name}」的改动`, `<div class="logs diff">${lines}${d.cut ? "\n…（太长了，后面没显示）" : ""}</div>`,
    `<button class="btn" onclick="closeDialog()">关闭</button><button class="btn primary" onclick="closeDialog();choose(${q(tid)},${q(aid)})">用这个</button>`);
}
async function choose(tid, aid){
  const a = agentOf(aid) || {name: ""};
  if (!await confirmBox(`用「${a.name}」的改动？`, "把它的改动合并进项目目录，记成一次提交。其他人的分支先留着。", "合并")) return;
  await act(() => api("/api/project/choose", {id: proj.id, task: tid, agent: aid}), "已合并进项目目录");
  openProject(proj.id);
}
async function removeProjMember(m){ await act(() => api("/api/project/member", {id: proj.id, remove: m}), "已移出"); rcpt = rcpt.filter(x => x !== m); await loadState(); openProject(proj.id); }

const WEEK = ["一", "二", "三", "四", "五", "六", "日"];
let sched = null, sd = null;
const schedSummary = id => (S.schedules || []).find(s => s.id === id);
function pad2(n){ return String(n).padStart(2, "0"); }
function fmtDay(d){
  const now = new Date(), t = new Date(now); t.setDate(now.getDate() + 1);
  if (d.toDateString() === now.toDateString()) return "今天";
  if (d.toDateString() === t.toDateString()) return "明天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function fmtTs(sec){ if (!sec) return ""; const d = new Date(sec * 1000); return `${fmtDay(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const everyText = n => n % 60 === 0 ? `每 ${n / 60} 小时` : `每 ${n} 分钟`;
const EVERY = [5, 10, 15, 30, 60, 120, 180, 240, 360, 480, 720, 1440];
function freqText(s){
  if (s.freq === "every") return everyText(s.every || 60);
  if (s.freq === "daily") return `每天 ${s.time}`;
  if (s.freq === "workday") return `每个工作日 ${s.time}`;
  if (s.freq === "weekly") return `每周${(s.days || []).map(d => WEEK[d]).join("、")} ${s.time}`;
  if (s.freq === "monthly") return `每月 ${s.dom} 号 ${s.time}`;
  return `${s.date ? fmtDay(new Date(s.date + "T00:00")) : ""} ${s.time}，只跑一次`;
}
const groupOf = id => chatById(id) || (GROUPS || []).find(c => c.id === id);
function schedMark(s){
  if (s.target.kind === "chat") { const c = groupOf(s.target.id); return seal(c && c.agent ? agentOf(c.agent) : null, "", false); }
  if (s.target.kind === "group") { const g = groupOf(s.target.id); return seal(g ? agentOf(g.agent) : null, "", false); }
  if (s.target.kind === "project") return pmark(projSummary(s.target.id) || {name: "项"});
  return seal(agentOf(s.target.id), "", false);
}
function schedTarget(s){
  if (s.target.kind === "chat") { const c = groupOf(s.target.id); return `对话「${c ? c.title : "已删除"}」`; }
  if (s.target.kind === "group") {
    const g = groupOf(s.target.id);
    const who = s.target.agents.length ? s.target.agents : g ? [g.agent] : [];
    return `群聊「${g ? g.title : "已删除"}」：${who.map(a => (agentOf(a) || {name: "已删除的 Agent"}).name).join("、")}`;
  }
  if (s.target.kind === "project") {
    const p = projSummary(s.target.id);
    return `项目「${p ? p.name : "已删除"}」：${s.target.agents.map(a => (agentOf(a) || {name: "已删除的 Agent"}).name).join("、")}`;
  }
  return (agentOf(s.target.id) || {name: "已删除的 Agent"}).name;
}

// ================= 文档预览和编辑（#34） =================
const DOC_KIND = {md: "md", markdown: "md", html: "html", htm: "html", docx: "docx", pdf: "pdf"};
const DOC_LABEL = {md: "Markdown 文档", html: "网页", docx: "Word 文档", pdf: "PDF 文档"};
function docKind(name){ const m = /\.([a-z]+)$/i.exec(name || ""); return m ? DOC_KIND[m[1].toLowerCase()] || null : null; }

// 文档用的 Markdown：比聊天里的全（各级标题、图片、嵌套列表、任务、对齐的表格）。
// 每块带 data-l="起-止"（原文行号），之后在排好版的页面上改哪一段就知道对应原文哪几行。
function docMd(src, assets = {}, nested){
  const L = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const isFence = l => /^\s{0,3}(```|~~~)/.test(l);
  const isHead = l => /^\s{0,3}#{1,6}(\s|$)/.test(l);
  const isHr = l => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isQuote = l => /^\s{0,3}>/.test(l);
  const isTable = k => /\|/.test(L[k] || "") && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[k + 1] || "");
  const at = (a, b) => nested ? "" : ` data-l="${a}-${b}"`;
  let i = 0;
  while (i < L.length){
    const l = L[i], a = i;
    if (!l.trim()){ i++; continue; }
    if (isFence(l)){
      const mark = l.trim().slice(0, 3), lang = l.trim().slice(3).trim(), buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(mark)) buf.push(L[i++]);
      i++;
      out.push(`<pre${at(a, i - 1)}><code${lang ? ` data-lang="${esc(lang)}"` : ""}>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (isHead(l)){
      const m = l.trim().match(/^(#{1,6})\s*(.*?)\s*#*\s*$/);
      out.push(`<h${m[1].length}${at(a, a)}>${mdInline(m[2], assets)}</h${m[1].length}>`); i++; continue;
    }
    if (isHr(l)){ out.push(`<hr${at(a, a)}>`); i++; continue; }
    if (isTable(i)){
      const row = s => s.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      const head = row(L[i]), align = row(L[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : "");
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ""}>${mdInline(c, assets)}</${tag}>`;
      i += 2; const body = [];
      while (i < L.length && L[i].trim() && /\|/.test(L[i])) body.push(row(L[i++]));
      out.push(`<table${at(a, i - 1)}><thead><tr>${head.map((c, k) => cell("th", c, k)).join("")}</tr></thead><tbody>${body.map(r => `<tr>${head.map((_, k) => cell("td", r[k] || "", k)).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (isQuote(l)){
      const buf = [];
      while (i < L.length && L[i].trim() && (isQuote(L[i]) || !(isFence(L[i]) || isHead(L[i]) || isList(L[i])))) buf.push(L[i++].replace(/^\s{0,3}>\s?/, ""));
      out.push(`<blockquote${at(a, i - 1)}>${docMd(buf.join("\n"), assets, true)}</blockquote>`); continue;
    }
    if (isList(l)){
      const items = [];
      while (i < L.length){
        const x = L[i];
        if (!x.trim()){
          let k = i; while (k < L.length && !L[k].trim()) k++;
          if (k < L.length && (isList(L[k]) || /^\s{2,}\S/.test(L[k]))) { i = k; continue; }
          break;
        }
        const m = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m && items.length && m[1].length <= items[0].ind && /\d/.test(m[2]) !== items[0].ord) break;   // 有序、无序换了：另起一个列表
        if (m) items.push({ind: m[1].replace(/\t/g, "    ").length, ord: /\d/.test(m[2]), start: parseInt(m[2]) || 1, text: m[3]});
        else if (items.length && (/^\s+\S/.test(x) || !(isFence(x) || isHead(x) || isQuote(x) || isHr(x)))) items[items.length - 1].text += "\n" + x.trim();
        else break;
        i++;
      }
      out.push(mdList(items, assets).replace(/^<(ul|ol)/, `<$1${at(a, i - 1)}`)); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !isFence(L[i]) && !isHead(L[i]) && !isHr(L[i]) && !isQuote(L[i]) && !isTable(i) && !isList(L[i])) buf.push(L[i++]);
    const text = buf.join("\n");
    const one = text.trim().match(/^!\[([^\]]*)\]\(([^)]*)\)$/);    // 单独一行的图片：图注用它的说明文字
    out.push(one && one[1].trim() ? `<figure${at(a, i - 1)}>${mdInline(text.trim(), assets)}<figcaption>${esc(one[1])}</figcaption></figure>` : `<p${at(a, i - 1)}>${mdInline(text, assets)}</p>`);
  }
  return out.join("");
}
function mdList(items, assets){
  if (!items.length) return "";
  const base = items[0].ind, ord = items[0].ord, html = [];
  let k = 0;
  while (k < items.length){
    const it = items[k++], kids = [];
    while (k < items.length && items[k].ind > base) kids.push(items[k++]);
    const task = it.text.match(/^\[([ xX])\]\s+/);
    const body = mdInline(task ? it.text.slice(task[0].length) : it.text, assets);
    html.push(task ? `<li class="task"><span class="tick">${task[1] === " " ? "☐" : "☑"}</span>${body}${mdList(kids, assets)}</li>` : `<li>${body}${mdList(kids, assets)}</li>`);
  }
  return ord ? `<ol${items[0].start !== 1 ? ` start="${items[0].start}"` : ""}>${html.join("")}</ol>` : `<ul>${html.join("")}</ul>`;
}
function mdInline(s, assets = {}){
  const keep = [], put = h => `\u0000${keep.push(h) - 1}\u0000`;
  const src = u => { u = (u || "").trim().replace(/^<|>$/g, ""); return assets[u] || (/^(https?:|data:image\/)/i.test(u) ? u : ""); };
  const href = u => /^(https?:|mailto:|#)/i.test(u) ? u : "";
  const img = (alt, u) => { const v = src(u), raw = esc(u.trim().replace(/^<|>$/g, "")); return put(v ? `<img src="${esc(v)}" alt="${esc(alt)}" data-src="${raw}">` : `<span class="miss" data-src="${raw}">图片没找到：${raw}</span>`); };
  const fmt = t => t
    .replace(/\*\*(?=\S)(.+?)\*\*/g, "<b>$1</b>").replace(/__(?=\S)(.+?)__/g, "<b>$1</b>")
    .replace(/~~(?=\S)(.+?)~~/g, "<s>$1</s>")
    .replace(/(^|[^*\w])\*(?=[^\s*])(.+?)\*(?![\w*])/g, "$1<i>$2</i>");
  s = String(s)
    .replace(/\\([\\`*_{}\[\]()#+\-.!|~<>])/g, (_, c) => put(esc(c)))
    .replace(/`([^`]+)`/g, (_, c) => put(`<code>${esc(c)}</code>`))
    .replace(/!\[([^\]]*)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+["'][^"']*["'])?\s*\)/g, (_, alt, u) => img(alt, u))
    .replace(/\[([^\]]+)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+["'][^"']*["'])?\s*\)/g, (m, t, u) => { const h = href(u.replace(/^<|>$/g, "")); return h ? put(`<a href="${esc(h)}" target="_blank" rel="noopener">${fmt(esc(t)).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n])}</a>`) : t; })
    .replace(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi, (m, u) => { const a = m.match(/\balt\s*=\s*["']([^"']*)["']/i); return img(a ? a[1] : "", u); })
    .replace(/<br\s*\/?>/gi, () => put("<br>"))
    .replace(/(^|[^"'(\w])(https?:\/\/[^\s<>）)\]，。]+)/g, (_, p, u) => p + put(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`))
    .replace(/( {2,}|\\)\n/g, () => put("<br>"))
    .replace(/([　-〿一-鿿＀-￯])\n(?=[　-〿一-鿿＀-￯])/g, "$1");   // 中文之间的换行不要变成空格
  return fmt(esc(s)).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
}
