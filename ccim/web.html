<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccim</title>
<style>
:root{
  --paper:#F1F2EE; --panel:#FFFFFF; --sunk:#E8EAE5; --line:#DCDFD8; --line-strong:#C9CDC4;
  --ink:#1D222B; --ink-2:#3A404A; --muted:#6C7169; --faint:#9A9F97;
  --qing:#2B4C6F; --qing-soft:#E3EAF1;
  --lu:#3F7A5E; --zhe:#9A5B34; --huang:#B8902A; --zhu:#B5402F; --dai:#4A4F6B;
  --ok:#3F7A5E; --warn:#B8902A; --bad:#B5402F;
  --song:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:76px 300px 1fr;height:100vh;overflow:hidden}
body{overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line)}
.brand{font:700 15px/1 var(--song);letter-spacing:.5px;margin-bottom:18px;color:var(--ink)}
.rail a{width:60px;padding:9px 0 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:12px}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--panel);color:var(--qing);box-shadow:0 0 0 1px var(--line)}
.rail .spacer{flex:1}

.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.list-head h1{font:600 19px/1.2 var(--song);margin:0}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;padding:0 8px 16px}
.group{font-size:12px;color:var(--faint);padding:12px 10px 4px}
.item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:flex-start;width:100%;text-align:left}
.item:hover{background:var(--sunk)}
.item.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.item .t{flex:1;min-width:0}
.item .title,.item .sub{display:block}
.item .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{font-size:12px;color:var(--faint);white-space:nowrap}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}

/* ---------- 印章 ---------- */
.seal{--c:var(--qing);flex:none;width:34px;height:34px;border-radius:7px;background:var(--c);color:#fff;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;padding:3px;
  font:700 12px/1 var(--song);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.seal.one{grid-template-columns:1fr;grid-template-rows:1fr;font-size:16px}
.seal span{display:block}
.seal.vert{grid-template-columns:1fr;gap:1px}
.seal.lg{width:64px;height:64px;font-size:22px;border-radius:12px;padding:6px}
.seal.lg.one{font-size:30px}
.seal.sm{width:26px;height:26px;font-size:10px;border-radius:6px;padding:2px}
.seal.sm.one{font-size:13px}
.seal.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.seal .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--faint)}
.seal .dot.on{background:var(--ok)} .seal .dot.busy{background:var(--huang)}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--qing);border-color:var(--qing);color:#fff}
.btn.primary:hover{background:#223d5a}
.btn.danger{color:var(--bad);border-color:#E3C3BD}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn svg{width:15px;height:15px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.feishu{background:#E4ECF7;color:#2F5A93} .tag.weixin{background:#E3F1E7;color:#2E6E45} .tag.term{background:#ECE9E3;color:#5E5547}
.tag.web{background:var(--qing-soft);color:var(--qing)}
.path{font:12px/1.4 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.on i{background:var(--ok)} .status.busy i{background:var(--huang)} .status.err i{background:var(--bad)}
.status.busy{color:#7A6216}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:380px;padding:40px 20px}
.empty h2{font:600 22px/1.3 var(--song);color:var(--ink);margin:0 0 8px}

/* ---------- 对话 ---------- */
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
.chat-head .name{font:600 16px/1.3 var(--song)}
.chat-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.chat-head .grow{flex:1;min-width:0}
.notice{margin:12px 22px 0;padding:9px 12px;border-radius:8px;background:#F4F1E6;color:#6B5A27;font-size:13px}
.thread{flex:1;overflow:auto;padding:22px 0 10px}
.msg{max-width:760px;margin:0 auto 22px;padding:0 22px}
.msg.me{display:flex;justify-content:flex-end}
.msg.me>div{max-width:80%;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--sunk);padding:9px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity .15s}
.msg:hover .msg-acts,.msg:focus-within .msg-acts{opacity:1}
@media (hover:none){.msg-acts{opacity:1}}
.msg-acts button{display:flex;align-items:center;gap:4px;height:26px;padding:0 7px;border-radius:7px;font-size:12px;color:var(--muted)}
.msg-acts button:hover{background:var(--sunk);color:var(--ink)}
.msg-acts svg{width:14px;height:14px}
/* 分叉出来的对话：从上面那个对话的印章下面引一条线，每个分支一个拐角，最后一个到拐角为止 */
.kids{margin:-2px 0 2px 26px}
.kids>.node{position:relative;padding-left:16px}
.kids>.node::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line-strong)}
.kids>.node:last-child::before{display:none}
.kids>.node::after{content:"";position:absolute;left:0;top:0;width:11px;height:17px;border-left:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);border-bottom-left-radius:7px}
.kids>.node:first-child::before{top:-8px}
.kids>.node:first-child::after{top:-8px;height:25px}   /* 第一条接到印章底下 */
.kids .kids{margin-left:10px}
.item.child{padding:6px 10px;align-items:center}
.item.child .title{font-weight:400;font-size:13.5px}
.msg.wide{max-width:1180px}
.dirs{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.dirs .dir{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.dirs .dir:hover{background:var(--sunk)}
.dirs .dir svg{width:15px;height:15px;color:var(--muted)}
.dirs .dir.up{color:var(--muted)}
.tag.mach{background:#EEF0E8;color:#4F5A3B;margin-right:4px}
.tag.mach.off{color:var(--faint);background:var(--sunk)}
.approve .pw{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);outline:none}
.approve .pw:focus{border-color:var(--ink-2)}
.box .rcpt:empty{display:none}
.fork-from{font-size:12px;color:var(--muted);text-decoration:none}
.fork-from:hover{color:var(--ink)}
.msg.me .from{display:none}
.from-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.from-row b{font:600 14px var(--song)}
.from-row .tag{margin-left:2px}
.answer{line-height:1.75}
.answer p{margin:0 0 10px}
.answer code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.answer pre{font:12.5px/1.6 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px 14px;border-radius:8px;overflow:auto}
.steps{border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;font-size:13px}
.steps>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink-2)}
.steps>button .chev{margin-left:auto;transition:transform .15s}
.steps.open>button .chev{transform:rotate(90deg)}
.steps ol{display:none;margin:0;padding:2px 12px 10px 34px;color:var(--muted)}
.steps.open ol{display:block}
.steps li{padding:2px 0}
.steps li code{font:12px var(--mono);color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--huang);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--ink-2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.approve{border:1px solid #E6D7AE;background:#FBF7EA;border-radius:10px;padding:12px 14px;margin:4px 0 12px}
.approve .q{font-weight:600;margin-bottom:4px}
.approve pre{margin:6px 0 10px;font:12.5px var(--mono);background:#fff;border:1px solid #EFE5C8;padding:8px 10px;border-radius:6px;white-space:pre-wrap}
.approve .acts{display:flex;gap:8px;flex-wrap:wrap}
.approve.done{background:var(--paper);border-color:var(--line)}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.file{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.composer{max-width:760px;width:100%;margin:0 auto 18px;padding:0 22px}
.box{border:1px solid var(--line-strong);border-radius:14px;background:var(--panel);box-shadow:0 1px 0 rgba(29,34,43,.03)}
.box:focus-within{border-color:var(--qing)}
.box textarea{width:100%;border:0;outline:none;resize:none;padding:12px 14px 4px;min-height:52px;max-height:200px;background:none}
.box .bar{display:flex;align-items:center;gap:4px;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--sunk)}
.chip svg{width:12px;height:12px}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--qing);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--line-strong);cursor:default}
.send.stop{background:var(--ink)}
.send svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(29,34,43,.14);padding:6px;min-width:200px;overflow-y:auto;overscroll-behavior:contain}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.pop button:hover{background:var(--sunk)}
.pop button .ck{margin-left:auto;color:var(--qing)}
.pop .sec{font-size:12px;color:var(--faint);padding:6px 10px 2px}
.pop .desc{font-size:12px;color:var(--muted)}
.pop svg{width:15px;height:15px;flex:none}

.newchat{margin:auto;width:min(800px,100%);padding:0 22px 12vh}
.newchat h2{font:600 26px/1.3 var(--song);margin:0 0 16px}
.seg.mini{padding:2px}
.seg.mini button{padding:3px 9px;font-size:12px}
.chip .path{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or{margin-top:22px;font-size:13px;color:var(--muted)}
.link{color:var(--qing);text-decoration:underline;text-underline-offset:3px}
.pop{max-height:60vh;overflow:auto}

.select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--panel);text-align:left}
.select:hover{border-color:var(--ink-2)}
.select[aria-expanded="true"]{border-color:var(--qing);box-shadow:0 0 0 3px var(--qing-soft)}
.select svg{width:14px;height:14px;color:var(--muted);flex:none}

/* ---------- 项目 ---------- */
.pmark{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 16px var(--song);
  color:var(--ink-2);background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.item.on .pmark{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.stack{display:flex;flex:none}
.stack .seal{box-shadow:0 0 0 2px var(--paper),inset 0 0 0 2px rgba(255,255,255,.18)}
.stack .seal+.seal{margin-left:-9px}
.stack.lg .seal{width:34px;height:34px}
.item .stack{width:58px}
.at{display:inline-flex;align-items:center;gap:3px;color:var(--qing);background:var(--qing-soft);border-radius:6px;padding:0 6px;font-size:13px;white-space:nowrap}
.at button{color:var(--qing);font-size:11px;opacity:.7}
.bubble .at{background:#fff}
.meta-r{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:12px;color:var(--faint);margin-top:4px}
.quote{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px;margin-bottom:6px;background:var(--paper);border-radius:0 8px 8px 0}
.quote.in-box{margin:8px 10px 0}
.quote .icon-btn{margin-left:auto;width:22px;height:22px;flex:none}
.rcpt{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;min-height:24px}
.from-row .status{margin-left:6px}
.acts-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.compare .col{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.compare .col.chosen{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.branch{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--ink-2);margin-bottom:8px}
.proj-body{flex:1;min-height:0;display:flex}
.proj-main{flex:1;min-width:0;display:flex;flex-direction:column}
.proj-main .msg,.proj-main .composer{max-width:1180px}
.proj-main .msg:has(.compare){max-width:none}          /* 对比几栏并排：用满宽度 */
.members{width:280px;flex:none;border-left:1px solid var(--line);padding:16px;overflow:auto;background:var(--paper)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mem .title,.mem .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .sub{font-size:12px;color:var(--muted)}
.danger-link{color:var(--bad)}

.diff .d-add{color:#9FE6A0}.diff .d-del{color:#F2A49B}.diff .d-hunk{color:#8FB8E8}
.acts-row a.link{text-decoration:underline;text-underline-offset:3px}

/* ---------- 定时任务 ---------- */
.run{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.run-head{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left}
.run-head .chev{margin-left:auto;transition:transform .15s}
.run.open .run-head .chev{transform:rotate(90deg)}
.run-body{display:none;padding:0 14px 12px;border-top:1px solid var(--line)}
.run.open .run-body{display:block;padding-top:10px}
.weekdays{display:inline-flex;gap:4px}
.weekdays button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);font-size:13px;color:var(--ink-2)}
.weekdays button.on{background:var(--qing);border-color:var(--qing);color:#fff}
.checks{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:6px}
.check{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.check svg{width:18px;height:18px;padding:2px;border-radius:5px;border:1.5px solid var(--line-strong);color:transparent;box-sizing:border-box}
.check.on svg{background:var(--qing);border-color:var(--qing);color:#fff}
.check.locked{color:var(--muted)}
.check.locked svg{background:var(--faint);border-color:var(--faint)}
.kv dd{white-space:pre-wrap}

/* ---------- 弹窗 ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,34,43,.28);display:grid;place-items:center;z-index:20}
.dialog{background:var(--panel);border-radius:16px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(29,34,43,.25)}
.dialog header{padding:18px 22px 4px;display:flex;align-items:center}
.dialog header h2{font:600 19px var(--song);margin:0;flex:1}
.dialog .body{padding:10px 22px 20px}
.dialog footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form .seg{justify-self:start}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:left}
.pick:hover{border-color:var(--ink-2)}
.pick.on{border-color:var(--qing);box-shadow:0 0 0 1px var(--qing)}
.pick .nm{font-weight:500} .pick .ds{font-size:12px;color:var(--muted)}

/* ---------- 表单 ---------- */
.form{display:grid;grid-template-columns:120px 1fr;gap:16px 18px;align-items:start}
.form>label,.form>.sub>label{padding-top:7px;color:var(--ink-2)}
.form>.sub{display:contents}
.form .help{font-size:12px;color:var(--muted);margin-top:4px}
.input,.textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);outline:none}
.input:focus,.textarea:focus{border-color:var(--qing)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:6px;background:var(--c)}
.swatches button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}

/* ---------- Agent ---------- */
.agent-page{overflow:auto;flex:1}
.agent-top{display:flex;gap:18px;align-items:center;padding:26px 32px 20px;border-bottom:1px solid var(--line)}
.agent-top h2{font:600 24px/1.25 var(--song);margin:0}
.agent-top .role{color:var(--muted);margin-top:2px;max-width:560px}
.agent-top .grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 8px;margin:0 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.pane{padding:22px 32px 40px;max-width:900px}
.sect{margin-bottom:28px}
.sect h3{font:600 15px var(--song);margin:0 0 10px}

<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand">ccim</div>
    <button class="fold unfold" aria-label="展开列表" title="展开列表" onclick="toggleList(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 10l2 2-2 2"/></svg></button>

    <a href="#/projects" data-nav="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5M13 15.2c.9-.5 1.9-.7 3-.7 2.2 0 4.2 1.5 5 4.5"/></svg>项目</a>

  </nav>
  <section class="list" id="list"></section>

</div>

<script>
// ================= 基础 =================
const COLORS = {qing:"#2B4C6F", lu:"#3F7A5E", zhe:"#9A5B34", huang:"#B8902A", zhu:"#B5402F", dai:"#4A4F6B"};
const BASE = {claude:"Claude Code", codex:"Codex"};
const CLAUDE_MODELS = [["opus","Opus","最强，复杂任务"],["sonnet","Sonnet","快，日常够用"],["haiku","Haiku","最快最省"],["fable","Fable",""]];
const EFFORTS = {claude:["low","medium","high","xhigh","max"], codex:["minimal","low","medium","high","xhigh"]};
const EFF_DESC = {minimal:"几乎不思考，最快", low:"快，适合简单的事", medium:"日常够用", high:"想得更周全", xhigh:"更深入", max:"最深入，最慢"};
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  clip:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  quote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h7M4 12h11M4 17h7"/><path d="M18 14v5"/></svg>',
  branch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 5 5 9-10"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  folder:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
  branch:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-5 4-11 7"/></svg>',
  fold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L19 7"/></svg>',
  file:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/></svg>',
  x:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q = v => esc(JSON.stringify(String(v ?? "")));   // 放进 onclick="f(…)" 里的字符串：先成 JSON 字面量（带引号）再转义

// 多台电脑：请求交给东西所在的那台电脑（X-Machine）。没指明时按 id 找，找不到用当前打开的东西所在的电脑
const LOCAL_API = /^\/api\/(state|global|peers|events)/;
function targetOf(path, body, machine){
  if (machine !== undefined) return machine;
  if (LOCAL_API.test(path)) return null;
  const u = new URL(path, location.origin);
  return ownerOf(u.searchParams.get("id")) || ownerOf(body && (body.id || body.agent)) || ctxMachine;
}
const remoteHeader = m => m && S.me && m !== S.me ? {"X-Machine": m} : {};
async function api(path, body, machine){
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
                               headers: {"X-CCIM": "1", "Content-Type": "application/json", ...remoteHeader(targetOf(path, body, machine))},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "出错了，再试一次。");
  return d;
}
async function act(fn, ok){ try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message); throw e; } }
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 2600); }
function tilde(p, machine){   // 用那台电脑自己的主目录缩写成 ~
  const home = ((S.machine_info || {})[machine || ctxMachine || S.me] || {}).home || S.home;
  return p && home && p.startsWith(home) ? "~" + p.slice(home.length) : p;
}

function when(ts){
  if (!ts) return "";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  if (isNaN(d)) return "";
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function group(ts){
  if (!ts) return "更早";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  return d.toDateString() === now.toDateString() ? "今天" : "更早";
}
function modelList(base){   // [值, 名字, 说明, 具体型号]：和 Claude Code / Codex 自己的模型列表一致（当前那台电脑的）
  const info = (S.machine_info || {})[ctxMachine || S.me] || {};
  const got = ((info.models || S.models) || {})[base] || [];
  return got.length || base === "codex" ? got : CLAUDE_MODELS;
}
function modelName(m){
  if (!m) return "默认";
  const s = String(m);
  const known = [...modelList("claude"), ...modelList("codex")].find(o => o[0] === s);
  if (known) return known[1];
  const one = s.includes("[1m]") ? " 1M" : "", b = s.replace("[1m]", "");
  const same = modelList("claude").find(o => o[0].replace("[1m]", "") === b);
  if (same) return same[1] + one;
  const hit = CLAUDE_MODELS.find(([k]) => b === k || b.startsWith(`claude-${k}`));
  if (!hit) return s;
  const v = b.match(/(\d+)-(\d+)(?:-\d{8})?$/);
  return hit[1] + (v ? ` ${v[1]}.${v[2]}` : "") + one;
}
function seal(a, size = "", dot = true){
  const txt = a ? (a.seal || "新") : "临";
  const chars = [...txt].slice(0, 2);
  const c = a ? (COLORS[a.color] || COLORS.qing) : "#8A8F87";
  const cls = ["seal", size, chars.length === 1 ? "one" : "vert"].join(" ");
  const d = a && dot ? `<i class="dot ${a.busy ? "busy" : (a.channels || []).some(c => c.state === "online") || !(a.channels || []).length ? "on" : ""}"></i>` : "";
  return `<span class="${cls}" style="--c:${c}" aria-hidden="true">${chars.map(x => `<span>${esc(x)}</span>`).join("")}${d}</span>`;
}

// ---- Markdown（只认常见写法，先转义再排版） ----
function md(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let i = 0;
  while (i < lines.length){
    let l = lines[i];
    if (/^```/.test(l)){
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const row = s => s.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    let m;
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))){ out.push(`<h3>${inline(m[2])}</h3>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)){
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    if (!l.trim()){ i++; continue; }
    const buf = [];
    const tableAt = k => /^\s*\|.*\|\s*$/.test(lines[k]) && k + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[k + 1]) && lines[k + 1].includes("-");
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|\s*([-*]|\d+\.)\s|>)/.test(lines[i]) && !tableAt(i)) buf.push(inline(lines[i++]));
    out.push(`<p>${buf.join("<br>")}</p>`);
  }
  return out.join("");
}

// ---- 弹出菜单、下拉框（不用原生 select） ----
function closePop(){ document.querySelectorAll(".pop").forEach(p => p.remove()); document.querySelectorAll(".select[aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false")); }
function pop(e, html, below){
  e.stopPropagation(); closePop();
  const p = document.createElement("div"); p.className = "pop"; p.innerHTML = html; document.body.append(p);
  p.addEventListener("click", ev => ev.stopPropagation());
  const r = e.currentTarget.getBoundingClientRect();
  if (below) p.style.minWidth = r.width + "px";
  p.style.left = Math.max(10, Math.min(r.left, innerWidth - p.offsetWidth - 10)) + "px";
  const h = p.offsetHeight, above = r.top - 16, under = innerHeight - r.bottom - 16;
  let goUp = below ? under < h && above > under : above >= h || above > under;   // 放不下就放空间大的那边，里面滚动
  const room = goUp ? above : under;
  if (h > room) p.style.maxHeight = room + "px";
  p.style.top = (goUp ? r.top - 6 - Math.min(h, room) : r.bottom + 6) + "px";
  p.querySelector("input")?.focus();
  return p;
}
addEventListener("click", closePop);
addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); [...document.querySelectorAll(".scrim")].pop()?.remove(); } });   // 只关最上面那层
const DD = {};
function dd(id, opts, value, onpick){
  DD[id] = {opts, value, onpick};
  const cur = opts.find(o => o[0] === value) || opts[0];
  return `<button type="button" class="select" id="dd-${id}" aria-haspopup="listbox" aria-expanded="false" onclick="openDD(event,'${id}')"><span>${esc(cur[1])}</span>${ICON.down}</button>`;
}
function optList(opts, value, pickJs){
  let more = false;
  return opts.map(([v, l, ds, , sec]) => (sec === "more" && !more && (more = true) ? `<div class="sec">更多模型</div>` : "") + `<button role="option" aria-selected="${value === v}" onclick="${pickJs(v)}"><span><div>${esc(l)}</div>${ds ? `<div class="desc">${esc(ds)}</div>` : ""}</span>${value === v ? `<span class="ck">✓</span>` : ""}</button>`).join("");
}
function openDD(e, id){
  const d = DD[id], btn = e.currentTarget;
  pop(e, optList(d.opts, d.value, v => `pickDD('${id}',${q(v)})`), true);
  btn.setAttribute("aria-expanded", "true");
}
function pickDD(id, v){
  const d = DD[id]; d.value = v; closePop();
  document.querySelector(`#dd-${id} span`).textContent = (d.opts.find(o => o[0] === v) || [v, v])[1];
  d.onpick && d.onpick(v);
}
function modelOpts(base, followLabel, cur){
  const list = modelList(base).slice();
  if (base === "codex"){
    const dm = (S.defaults.codex || [])[0];
    if (dm && !list.some(o => o[0] === dm)) list.unshift([dm, dm, ""]);
  }
  if (cur && !list.some(o => o[0] === cur)) list.push([cur, modelName(cur), ""]);   // 以前设过、现在列表里没有的
  return [["", followLabel, "用默认设置"]].concat(list);
}
function effortOpts(base, followLabel){ return [["", followLabel, "用默认设置"]].concat(EFFORTS[base].map(k => [k, k, EFF_DESC[k]])); }

// ================= 状态和推送 =================
let S = {agents:[], chats:[], global:{}, defaults:{}, home:""};
let current = {view:"chats", id:null};
let detail = null;                // 当前打开的对话
let refreshTimer = null;
async function loadState(){
  S = await api("/api/state"); renderList();
  const c = detail && S.chats.find(x => x.id === detail.id);
  if (c && c.title !== detail.title) { detail.title = c.title; const n = document.querySelector(".chat-head .name"); if (n) n.textContent = c.title; }
}
function refreshSoon(){ clearTimeout(refreshTimer); refreshTimer = setTimeout(loadState, 400); }
const agentOf = id => S.agents.find(a => a.id === id);
const multi = () => (S.machines || []).length > 1;
const machineOf = id => (S.machines || []).find(m => m.id === id);
let ctxMachine = null;            // 当前打开的东西在哪台电脑
function ownerOf(id){
  if (!id) return null;
  for (const k of ["agents", "chats", "projects", "schedules"]){
    const x = (S[k] || []).find(x => x.id === id);
    if (x && x.machine) return x.machine;
  }
  return null;
}
function mtag(mid, always){   // 在哪台电脑：只有几台电脑时才显示；默认本机的不标
  if (!multi() || !mid || (!always && mid === S.me)) return "";
  const m = machineOf(mid) || {name: "另一台电脑"};
  return `<span class="tag mach ${m.online === false ? "off" : ""}">${esc(m.name)}${m.online === false ? "（离线）" : ""}</span>`;
}
const isRemote = mid => !!(mid && S.me && mid !== S.me);
const fileUrl = (chat, path) => `/api/file?chat=${encodeURIComponent(chat)}&path=${encodeURIComponent(path)}`
  + (isRemote(ctxMachine) ? `&machine=${encodeURIComponent(ctxMachine)}` : "");

function connectEvents(){
  const es = new EventSource("/api/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (sched && ev.type === "schedule" && ev.schedule === sched.id){
      clearTimeout(window._st); window._st = setTimeout(() => { if (sched) openSchedule(sched.id); }, 300);
    }
    if (proj && ev.type === "project" && ev.project === proj.id){
      clearTimeout(window._pt); window._pt = setTimeout(() => { if (proj) openProject(proj.id, true); }, 300);
    }
    if (proj && ev.type === "progress" && proj.feed.some(r => r.chat === ev.chat)){
      if (ev.state === "working") proj.progress[ev.chat] = ev; else delete proj.progress[ev.chat];
      redrawProjThread();
    }
    if (detail && ev.type === "progress" && detail.log.some(r => r.type === "mention" && r.chat === ev.chat)){
      detail.sub_progress = detail.sub_progress || {};
      if (ev.state === "working") detail.sub_progress[ev.chat] = ev; else delete detail.sub_progress[ev.chat];
      drawThread();
    }
    if (detail && ev.chat === detail.id){
      if (ev.type === "progress"){
        detail.progress = ev.state === "working" ? ev : null;
        detail.busy = ev.state === "working";
        drawThread(); drawComposerState();
      } else {
        const i = ["card", "mention", "secret"].includes(ev.type) ? detail.log.findIndex(r => r.type === ev.type && r.id === ev.id) : -1;
        if (i >= 0) detail.log[i] = ev.type === "card" ? ev : {...detail.log[i], ...ev, at: detail.log[i].at}; else detail.log.push(ev);
        drawThread();
      }
    }
    if (ev.type !== "progress" || ev.state !== "working") refreshSoon();
    else { const c = S.chats.find(x => x.id === ev.chat); if (c && !c.busy) refreshSoon(); }
  };
  es.onerror = () => {};   // 浏览器会自己重连
}

// ================= 路由 =================
function narrow(){ return innerWidth <= 760; }
function route(){
  const parts = location.hash.slice(2).split("/");
  current = {view: parts[0] || "chats", id: parts[1] ? decodeURIComponent(parts[1]) : null};
  const own = ownerOf(current.id && current.id.startsWith("edit-") ? current.id.slice(5) : current.id);
  if (own) ctxMachine = own;
  else if (!current.id || current.id === "new" || current.view === "settings") ctxMachine = S.me;   // 隐藏的子对话：沿用打开它的那台
  if (current.view === "chats" && current.id === "new" && draft.machine) ctxMachine = draft.machine;
  if (narrow()) document.querySelector(".app").classList.toggle("list-off", !!current.id);   // 窄屏：打开了某一项就收起列表
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === current.view));
  closePop();
  renderList();
  if (current.view !== "projects") proj = null;
  if (current.view !== "schedules") sched = null;
  if (current.view === "projects") { current.id ? openProject(current.id) : renderProjectEmpty(); }
  else if (current.view === "schedules") { current.id === "new" ? renderScheduleForm(null) : current.id && current.id.startsWith("edit-") ? renderScheduleForm(current.id.slice(5)) : current.id ? openSchedule(current.id) : renderScheduleEmpty(); }
  else if (current.view === "agents") { current.id === "new" ? renderAgentForm(null) : current.id ? renderAgent(current.id) : renderAgentEmpty(); }
  else if (current.view === "settings") current.id === "machines" ? renderMachines() : renderSettings();
  else { current.id === "new" ? renderNewChat() : current.id ? openChat(current.id) : renderChatEmpty(); }
}
addEventListener("hashchange", route);
function renderList(){
  if (current.view === "agents") renderAgentList();
  else if (current.view === "projects") renderProjectList();
  else if (current.view === "schedules") renderScheduleList();
  else if (current.view === "settings") renderSettingsList();
  else renderChatList();
}

// ================= 对话列表 =================
let chatFilter = "";
function chatTree(rows){
  // 分叉出来的对话挂在原来那个下面；整棵树按里面最近一次聊的时间排
  const byId = Object.fromEntries(rows.map(c => [c.id, c])), kids = {};
  const roots = rows.filter(c => !(c.parent && byId[c.parent] && c.parent !== c.id));
  rows.forEach(c => { if (c.parent && byId[c.parent] && !roots.includes(c)) (kids[c.parent] = kids[c.parent] || []).push(c); });
  const latest = (c, seen = new Set()) => {
    if (seen.has(c.id)) return c.last_active || ""; seen.add(c.id);
    return (kids[c.id] || []).reduce((m, k) => { const v = latest(k, seen); return v > m ? v : m; }, c.last_active || "");
  };
  roots.forEach(c => { c._latest = latest(c); });
  roots.sort((a, b) => (b._latest > a._latest ? 1 : -1));
  return {roots, kids};
}
function chatItem(c, kids, child){
  const a = c.agent ? agentOf(c.agent) : null;
  const sub = c.busy ? `<span class="working"><span class="spin"></span>干活中</span>` : `<span>${esc(c.agent_name || "临时对话")}</span>`;
  const me = child
    ? `<a class="item child ${current.id === c.id ? "on" : ""}" href="#/chats/${encodeURIComponent(c.id)}" style="text-decoration:none;color:inherit">
        <span class="t"><span class="title">${esc(c.title)}</span></span>${c.busy ? `<span class="working"><span class="spin"></span></span>` : `<span class="when">${when(c.last_active)}</span>`}</a>`
    : `<a class="item ${current.id === c.id ? "on" : ""}" href="#/chats/${encodeURIComponent(c.id)}" style="text-decoration:none;color:inherit">
        ${seal(a, "", false)}<span class="t"><span class="title">${esc(c.title)}</span><span class="sub">${sub}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><span class="when">${when(c.last_active)}</span><span>${mtag(c.machine)}${srcTag(c.source)}</span></span></a>`;
  const ks = (kids[c.id] || []).sort((x, y) => (x.last_active < y.last_active ? 1 : -1));
  const tree = ks.length ? `<div class="kids">${ks.map(k => chatItem(k, kids, true)).join("")}</div>` : "";
  return child ? `<div class="node">${me}${tree}</div>` : me + tree;
}
function renderChatList(){
  const rows = S.chats.filter(c => !chatFilter || (c.title + (c.agent_name || "")).toLowerCase().includes(chatFilter));
  const {roots, kids} = chatFilter ? {roots: rows, kids: {}} : chatTree(rows);
  const groups = ["今天", "更早"];
  $("#list").innerHTML = `
    <div class="list-head"><h1>对话</h1><button class="fold" style="margin-left:auto;margin-right:6px" aria-label="收起列表" title="收起列表" onclick="toggleList(false)">${ICON.fold}</button><a class="btn primary" href="#/chats/new" style="text-decoration:none">${ICON.plus}新对话</a></div>
    <label class="search">${ICON.search}<input placeholder="搜索对话" aria-label="搜索对话" value="${esc(chatFilter)}" oninput="chatFilter=this.value.toLowerCase();renderChatList();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></label>
    <div class="scroll">${rows.length ? groups.map(g => {
      const items = roots.filter(c => group(c._latest || c.last_active) === g);
      if (!items.length) return "";
      return `<div class="group">${g}</div>` + items.map(c => chatItem(c, kids, false)).join("");
    }).join("") : `<p class="muted" style="padding:10px">${chatFilter ? "没有找到。" : "还没有对话。"}</p>`}</div>`;
}
function srcTag(src){
  if (!src) return "";
  const cls = src.startsWith("飞书") ? "feishu" : src.startsWith("微信") ? "weixin" : src === "网页" ? "web" : "term";
  return `<span class="tag ${cls}">${esc(src)}</span>`;
}
function renderChatEmpty(){
  $("#main").innerHTML = `<div class="empty"><h2>和 Agent 一起干活</h2><p>选好 Claude Code 或 Codex 就能开始；想找某个 Agent，去 Agent 页。</p>
    <a class="btn primary" href="#/chats/new" style="text-decoration:none">${ICON.plus}新对话</a></div>`;
}

async function openChat(id){
  $("#main").innerHTML = `<div class="loading">…</div>`;
  if (!detail || detail.id !== id) chatRcpt = [];
  try { detail = await api(`/api/chat?id=${encodeURIComponent(id)}`); }
  catch (e) { $("#main").innerHTML = `<div class="empty"><h2>打不开这个对话</h2><p>${esc(e.message)}</p></div>`; return; }
  pendingFiles = [];

}
function stepsHtml(steps, open, head){
  if (!steps || !steps.length) return "";
  return `<div class="steps ${open ? "open" : ""}"><button onclick="this.parentElement.classList.toggle('open')">${head || `做了 ${steps.length} 步`}${ICON.chev}</button>
    <ol>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;
}
function fromRow(){
  const a = detail.agent ? agentOf(detail.agent) : null;
  return `<div class="from-row">${seal(a, "sm", false)}<b>${esc(a ? a.name : BASE[detail.base])}</b></div>`;
}
function msgActs(src, i, r){
  const ref = `${q(src)},${i}`;
  const btns = [`<button onclick="copyMsg(this,${ref})" title="复制">${ICON.copy}复制</button>`];
  if (r.type === "answer") btns.push(`<button onclick="quoteMsg(this,${ref})" title="引用到输入框">${ICON.quote}引用</button>`);
  if (src === "log" && canFork(i, r)) btns.push(`<button onclick="forkAt(${i})" title="从这条回答另开一个对话，之后两边互不影响">${ICON.branch}分叉</button>`);
  return `<div class="msg-acts">${btns.join("")}</div>`;
}
function canFork(i, r){
  if (r.type !== "answer" || r.state !== "done" || detail.readonly || detail.busy) return false;
  const last = detail.log.map(x => x.type).lastIndexOf("answer");
  return i === last || (!!r.fork && detail.base !== "codex");
}
function recHtml(r, i, src = "log"){
  if (r.type === "user"){
    const from = r.from_chat && S.chats.find(x => x.id === r.from_chat);
    return `<div class="msg me"><div>${from ? `<a class="fork-from" style="margin-bottom:4px" href="#/chats/${encodeURIComponent(from.id)}">在「${esc(from.title)}」里 @ 的</a>` : ""}${r.text || r.to ? `<div class="bubble">${r.to ? chipsOf(r.to) + " " : ""}${esc(r.text)}</div>` : ""}
      ${r.files && r.files.length ? `<div class="files">${r.files.map(f => {
        const src = f.path && fileUrl(detail.id, f.path);
        return src && isImg(f.name) ? `<a class="shot" href="${src}" target="_blank"><img src="${src}" alt="${esc(f.name)}"></a>`
          : `<span class="file">${ICON.file}${esc(f.name)}</span>`;
      }).join("")}</div>` : ""}
      ${r.text ? msgActs(src, i, r) : ""}</div></div>${r.to && src === "log" ? mentionGroup(r.id) : ""}`;
  }
  if (r.type === "mention") return "";
  if (r.type === "secret") return secretHtml(r);
  if (r.type === "answer"){
    const stopped = r.state === "stopped";
    return `<div class="msg">${fromRow()}${stepsHtml(r.steps)}${r.text ? `<div class="answer ${r.state === "error" ? "state-err" : ""}">${md(r.text)}</div>${msgActs(src, i, r)}` : stopped ? `<div class="muted">已停下。</div>` : ""}</div>`;
  }
  if (r.type === "card"){
    const live = r.buttons && r.buttons.length;
    if (!live) return `<div class="msg"><div class="card-done">${esc(r.title || r.note || "")}</div></div>`;
    return `<div class="msg"><div class="approve"><div class="q">${esc((r.title || "").replace(/ · .*$/, ""))}</div><div class="answer" style="font-size:13px">${md(r.body)}</div>
      <div class="acts">${r.buttons.map(b => `<button class="btn ${b.style === "primary" ? "primary" : b.style === "danger" ? "danger" : ""}" onclick='cardAct(${JSON.stringify(r.id)},${esc(JSON.stringify(b.value))})'>${esc(b.text)}</button>`).join("")}</div></div></div>`;
  }
  if (r.type === "file"){
    const src = fileUrl(detail.id, r.path);
    const img = isImg(r.name);
    return `<div class="msg">${img ? `<a href="${src}" target="_blank"><img class="sentimg" src="${src}" alt="${esc(r.name)}"></a>`
      : `<a class="sentfile" href="${src}" target="_blank">${ICON.file}${esc(r.name)}</a>`}</div>`;
  }
  return `<div class="note"><div class="answer">${md(r.text)}</div></div>`;
}
function liveHtml(){
  const p = detail.progress; if (!p) return "";
  const last = p.steps[p.steps.length - 1];
  const head = `<span class="spin"></span>${p.retry ? `网络不稳，正在重试（第 ${p.retry} 次）` : last ? "正在" + esc(last.replace(/^(运行|读|改|搜索|查找|写)[：:]?\s*/, (m, v) => v + "：")) : "思考中"}`;
  return `<div class="msg">${fromRow()}${p.steps.length ? stepsHtml(p.steps, true, head) : `<div class="steps"><button>${head}</button></div>`}
    ${p.text ? `<div class="answer cursor">${md(p.text)}</div>` : ""}</div>`;
}
function drawThread(){
  const t = $("#thread"); if (!t) return;
  const near = t.scrollHeight - t.scrollTop - t.clientHeight < 120;
  // 正在输的密码：重画前记下，重画后放回去（进度每零点几秒刷新一次）
  const typed = [...t.querySelectorAll("form[data-sid]")].map(f => [f.dataset.sid, f.pw.value, document.activeElement === f.pw]);
  const earlier = (detail.earlier || []).map((r, i) => recHtml(r, i, "earlier")).join("");
  t.innerHTML = (earlier ? earlier + `<div class="note" style="text-align:center;margin:6px auto 22px">以上是${esc(detail.origin_source || "原来")}里的对话，以下是在网页里接着聊的</div>` : "")
    + detail.log.map((r, i) => recHtml(r, i)).join("") + liveHtml();
  for (const [sid, v, focus] of typed){
    const f = t.querySelector(`form[data-sid="${CSS.escape(sid)}"]`); if (!f) continue;
    f.pw.value = v; if (focus) f.pw.focus();
  }
  if (near) t.scrollTop = t.scrollHeight;
}
function forkFrom(c){

        <span class="tag">${BASE[c.base]}</span>${mtag(ctxMachine)}${srcTag(c.source)}${forkFrom(c)}

    <div class="thread" id="thread"></div>

    </div>`;
  drawThread(); drawComposerState(); drawPending(); drawChatRcpt();

function drawComposerState(){
  const c = detail; if (!c || !$("#send")) return;
  $("#input").placeholder = c.readonly ? "在这里接着聊" : c.busy ? "补充说明，它做完当前这一步就会看到" : `给 ${c.agent_name || BASE[c.base]} 发消息`;
  if (c.readonly) { $("#chip-model").style.display = $("#chip-effort").style.display = "none"; }
  $("#chip-model").innerHTML = `${esc(modelName(c.model))}${c.model_custom ? "" : "<span class='dflt'>默认</span>"}${ICON.down}`;
  $("#chip-effort").innerHTML = `思考 ${esc(c.effort || "默认")}${c.effort_custom ? "" : "<span class='dflt'>默认</span>"}${ICON.down}`;
  const s = $("#send");
  s.className = "send" + (c.busy ? " stop" : "");
  s.innerHTML = c.busy ? ICON.stop : ICON.up;
  s.setAttribute("aria-label", c.busy ? "停下" : "发送");
  s.onclick = c.readonly ? sendChat : c.busy && !$("#input").value.trim() && !pendingFiles.length ? stopChat : sendChat;
  if (c.readonly) { s.className = "send"; s.innerHTML = ICON.up; }
  $("#input").oninput = drawComposerState;
}
async function sendChat(){
  const v = $("#input").value.trim(), files = pendingFiles.filter(f => f.key);
  if (pendingFiles.some(f => !f.key)) return toast("文件还在上传");
  if (!v && !files.length) return;
  closePop();
  if (chatRcpt.length && !detail.readonly){       // @ 了其他 Agent：交给它们答
    const to = chatRcpt;
    $("#input").value = ""; pendingFiles = []; chatRcpt = []; drawPending(); drawChatRcpt(); drawComposerState();
    try { const r = await act(() => api("/api/chat/mention", {id: detail.id, text: v, files, to})); if (r.queued) toast(`「${r.machine}」现在离线，上线后自动发出`); }
    catch { $("#input").value = v; chatRcpt = to; drawChatRcpt(); }
    return;
  }
  $("#input").value = ""; pendingFiles = []; drawPending();
  if (detail.readonly) {                 // 接着别处的对话：转成网页里的新对话

}
const isImg = name => /\.(png|jpe?g|gif|webp|svg)$/i.test(name || "");
async function addFiles(list){
  for (const file of list){
    const f = {name: file.name || "粘贴的图片.png"};
    if ((file.type || "").startsWith("image/") || isImg(f.name)) f.url = URL.createObjectURL(file);
    pendingFiles.push(f); drawPending();
    try {
      const r = await fetch("/api/upload", {method: "POST", headers: {"X-CCIM": "1", "X-Name": encodeURIComponent(f.name), ...remoteHeader(ctxMachine)}, body: file});
      const d = await r.json(); if (!r.ok) throw new Error(d.error || "上传失败");
      Object.assign(f, d);
    } catch (e) { pendingFiles = pendingFiles.filter(x => x !== f); toast(`${f.name} 没传上：${e.message}`); }
    drawPending(); drawComposerState();
  }
}
function dropZone(el){
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag"); });
  el.addEventListener("dragleave", () => el.classList.remove("drag"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("drag"); addFiles(e.dataTransfer.files); });
}

function channelHtml(a, k){

async function disconnect(aid, path, kind, proc, name){

async function connectAgent(aid, channel){
  const label = channel === "feishu" ? "飞书" : "微信";
  let job = await act(() => api("/api/agent/connect", {id: aid, channel}));
  dialog(`接到${label}`, `<div id="jobbox" style="text-align:center;min-height:280px"><p class="muted">准备二维码…</p></div>`, `<button class="btn" onclick="closeDialog()">关闭</button>`);
  while (document.querySelector("#jobbox")){
    const box = $("#jobbox");
    if (job.state === "scan") box.innerHTML = `<p>用手机${label}扫码${channel === "feishu" ? "，确认后会在你的飞书账号下建好一个机器人" : "登录"}</p><div class="qr">${job.qr}</div>
      <p class="muted" style="font-size:12px">扫不了的话，在手机${label}里打开：<a href="${esc(job.link)}" target="_blank">这个链接</a></p>`;
    else if (job.state === "starting") box.innerHTML = `<p class="muted">扫好了，正在启动…</p>`;
    else if (job.state === "done") { box.innerHTML = `<h3 style="font:600 18px var(--song)">接好了</h3><p>${channel === "feishu" ? `在飞书里找「${esc(job.bot)}」发消息就行。` : `在微信里打开「微信ClawBot」发消息就行。`}</p>`; await loadState(); renderAgent(aid); return; }
    else if (job.state === "error") { box.innerHTML = `<p class="state-err">${esc(job.error)}</p>`; return; }
    await new Promise(r => setTimeout(r, 1200));
    try { job = await api(`/api/job?id=${job.id}`); } catch (e) { box.innerHTML = `<p class="state-err">${esc(e.message)}</p>`; return; }
  }
}

function liveOf(r){
  // 排队中的回答：它所在的对话正在干活、而且它是那个对话里最早没做完的一件，就是正在做的这件
  if (r.state !== "queued") return null;
  const p = proj.progress[r.chat]; if (!p) return null;
  const first = proj.feed.find(x => x.type === "reply" && x.chat === r.chat && x.state === "queued");

          error: `<span class="status err"><i></i>出错了</span>`, stopped: `<span class="status"><i></i>停下了</span>`,

const WEEK = ["一", "二", "三", "四", "五", "六", "日"];

function pad2(n){ return String(n).padStart(2, "0"); }
function fmtDay(d){
  const now = new Date(), t = new Date(now); t.setDate(now.getDate() + 1);
  if (d.toDateString() === now.toDateString()) return "今天";
  if (d.toDateString() === t.toDateString()) return "明天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function fmtTs(sec){ if (!sec) return ""; const d = new Date(sec * 1000); return `${fmtDay(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function freqText(s){
  if (s.freq === "daily") return `每天 ${s.time}`;
  if (s.freq === "workday") return `每个工作日 ${s.time}`;
  if (s.freq === "weekly") return `每周${(s.days || []).map(d => WEEK[d]).join("、")} ${s.time}`;
  if (s.freq === "monthly") return `每月 ${s.dom} 号 ${s.time}`;
  return `${s.date ? fmtDay(new Date(s.date + "T00:00")) : ""} ${s.time}，只跑一次`;
}

  const rows = S.schedules || [];
  $("#list").innerHTML = `
    <div class="list-head"><h1>定时任务</h1><button class="fold" style="margin-left:auto;margin-right:6px" aria-label="收起列表" title="收起列表" onclick="toggleList(false)">${ICON.fold}</button><a class="btn primary" href="#/schedules/new" style="text-decoration:none">${ICON.plus}新建</a></div>
    <div class="scroll">${rows.length ? rows.map(s => `<a class="item ${current.id === s.id ? "on" : ""}" href="#/schedules/${encodeURIComponent(s.id)}" style="text-decoration:none;color:inherit">
      ${schedMark(s)}<span class="t"><span class="title">${esc(s.name)}</span>${s.running ? `<span class="working"><span class="spin"></span>正在跑</span>` : `<span class="sub">${esc(freqText(s))}</span>`}</span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><span class="when">${s.on ? esc(fmtTs(s.next_run)) : ""}</span>${mtag(s.machine)}${!s.on ? `<span class="tag">已暂停</span>` : s.last_state === "error" ? `<span class="tag" style="color:var(--bad)">上次出错</span>` : ""}</span></a>`).join("")
      : `<p class="muted" style="padding:10px">还没有定时任务。</p>`}</div>`;
}
function renderScheduleEmpty(){
  sched = null;
  $("#main").innerHTML = `<div class="empty"><h2>定时任务</h2><p>让 Agent 按时自己干活：每天早上汇总进展、每周五跑一遍测试、每月出一份复盘。结果留在这里，也可以发到飞书、微信。</p>
    <a class="btn primary" href="#/schedules/new" style="text-decoration:none">${ICON.plus}新建定时任务</a></div>`;
}
function runState(r){
  return ({done: `<span class="status on"><i></i>完成${r.elapsed ? `，用时 ${fmtSec(r.elapsed)}` : ""}</span>`, error: `<span class="status err"><i></i>出错了</span>`,
           stopped: `<span class="status"><i></i>停下了</span>`, working: `<span class="status busy"><i></i>正在跑</span>`,
           lost: `<span class="status"><i></i>没跑完（ccim 重启过）</span>`}[r.state] || "") + (r.catchup ? ` <span class="tag">补跑</span>` : "");
}
async function openSchedule(id){
  try { sched = await api(`/api/schedule?id=${encodeURIComponent(id)}`); }
  catch (e) { $("#main").innerHTML = `<div class="empty"><h2>找不到这个定时任务</h2><p>${esc(e.message)}</p></div>`; return; }
  drawSchedule();
}
function drawSchedule(){
  const s = sched, open = new Set([...document.querySelectorAll(".run.open")].map(x => x.dataset.id));
  const a = s.target.kind === "agent" ? agentOf(s.target.id) : null;
  const dl = ["留在这里"].concat((s.deliver || []).map(d => d === "feishu" ? "发到飞书" : "发到微信")).join("，");
  $("#main").innerHTML = `<div class="agent-page">
    <div class="agent-top">${schedMark(s)}
      <div class="grow"><h2>${esc(s.name)}</h2>
        <div class="row" style="margin-top:6px">${s.running ? `<span class="status busy"><i></i>正在跑</span>` : s.on ? `<span class="status on"><i></i>下次 ${esc(fmtTs(s.next_run))}</span>` : `<span class="status"><i></i>已暂停</span>`}<span class="tag">${esc(freqText(s))}</span></div></div>
      <button class="btn" onclick="schedRun()" ${s.running ? "disabled" : ""}>立即跑一次</button>
      <button class="btn" onclick="schedToggle()">${s.on ? "暂停" : "恢复"}</button>
      <button class="icon-btn" aria-label="更多" onclick="schedMenu(event)">${ICON.more}</button>
    </div>
    <div class="pane">
      <div class="sect"><h3>做什么</h3><dl class="kv"><dt>给谁</dt><dd>${esc(schedTarget(s))}</dd><dt>任务</dt><dd>${esc(s.prompt)}</dd>
        <dt>结果</dt><dd>${esc(dl)}</dd>${s.target.kind === "agent" ? `<dt>对话</dt><dd>${s.session === "same" ? "接着同一个对话聊，记得之前跑过的" : "每次开一个新对话"}</dd>` : ""}</dl></div>
      <div class="sect"><h3>运行记录</h3>${s.runs.length ? s.runs.map((r, i) => `<div class="run ${open.has(r.id) || (!open.size && i === 0) ? "open" : ""}" data-id="${esc(r.id)}">
        <button class="run-head" onclick="this.parentElement.classList.toggle('open')"><span class="when" style="width:120px">${esc(fmtTs(r.at))}</span>${runState(r)}${ICON.chev}</button>
        <div class="run-body">${r.state === "working" ? `<p class="muted">正在跑，跑完结果会出现在这里。</p>` : `<div class="answer ${r.state === "error" ? "state-err" : ""}">${md(r.text || "")}</div>`}
          ${r.chat ? `<a class="link" href="#/chats/${encodeURIComponent(r.chat)}">看完整对话</a>` : r.project ? `<a class="link" href="#/projects/${encodeURIComponent(r.project)}">去项目里看</a>` : ""}</div></div>`).join("")
        : `<p class="muted">还没跑过。可以先「立即跑一次」看看效果。</p>`}</div>
    </div></div>`;
}
async function schedRun(){ await act(() => api("/api/schedule/run", {id: sched.id}), "已开始，跑完结果会出现在这里"); openSchedule(sched.id); loadState(); }
async function schedToggle(){ await act(() => api("/api/schedule/toggle", {id: sched.id, on: !sched.on}), sched.on ? "已暂停" : "已恢复"); await loadState(); openSchedule(sched.id); }
function schedMenu(e){
  pop(e, `<button onclick="closePop();location.hash='#/schedules/edit-'+encodeURIComponent(sched.id)">编辑</button><button onclick="closePop();schedDelete()">删除</button>`, true);
}
async function schedDelete(){
  if (!await confirmBox(`删除「${sched.name}」？`, "以后不会再跑，运行记录也会删掉。", "删除")) return;
  await act(() => api("/api/schedule/delete", {id: sched.id}), "已删除"); sched = null; await loadState(); location.hash = "#/schedules";
}

// ---- 新建 / 编辑 ----
async function renderScheduleForm(id){
  let s = null;
  if (id) { try { s = await api(`/api/schedule?id=${encodeURIComponent(id)}`); } catch (e) { toast(e.message); return; } }
  const today = new Date(), tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  sd = s ? {name: s.name, target: JSON.parse(JSON.stringify(s.target)), prompt: s.prompt, freq: s.freq, time: s.time, days: s.days || [], dom: s.dom || 1,
            date: s.date || iso(tomorrow), deliver: s.deliver || [], session: s.session || "new"}
         : {name: "", target: {kind: "agent", id: (S.agents[0] || {}).id}, prompt: "", freq: "workday", time: "09:00", days: [0], dom: 1,
            date: iso(tomorrow), deliver: [], session: "new"};
  sd._id = id || null;
  drawScheduleForm();
}
function drawScheduleForm(){
  const d = sd, keep = {name: $("#sd-name")?.value, prompt: $("#sd-prompt")?.value};
  if (keep.name !== undefined) { d.name = keep.name; d.prompt = keep.prompt; }
  const hours = Array.from({length: 24}, (_, h) => [pad2(h), pad2(h) + " 点", ""]);
  const mins = Array.from({length: 12}, (_, i) => [pad2(i * 5), pad2(i * 5) + " 分", ""]);
  const [hh, mm] = d.time.split(":");
  const where = x => multi() ? "，在" + ((machineOf(x.machine) || {}).name || "") : "";
  const tgtOpts = [...S.agents.map(a => ["agent:" + a.id, a.name, BASE[a.base || "claude"] + where(a)]),
                   ...(S.projects || []).map(p => ["project:" + p.id, `项目「${p.name}」`, `${p.members.length} 个 Agent` + where(p)])];
  const p = d.target.kind === "project" ? projSummary(d.target.id) : null;
  const a = d.target.kind === "agent" ? agentOf(d.target.id) : null;
  const ch = k => a && a.channels.find(c => (k === "weixin") === (c.kind === "weixin"));
  const dates = Array.from({length: 60}, (_, i) => { const x = new Date(); x.setDate(x.getDate() + i);
    const v = `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`; return [v, fmtDay(x) + (i > 1 ? `（周${WEEK[(x.getDay() + 6) % 7]}）` : ""), ""]; });
  $("#main").innerHTML = `<div class="agent-page"><div class="agent-top"><div class="grow"><h2>${d._id ? "编辑定时任务" : "新建定时任务"}</h2>
    <div class="role">到了时间，ccim 会把任务交给它去做；电脑睡着错过了，醒来补跑一次。</div></div></div>
    <div class="pane"><div class="form">
      <label for="sd-name">名字</label><input id="sd-name" class="input" value="${esc(d.name)}" placeholder="比如：每日站会小结">
      <label>给谁</label><div>${tgtOpts.length ? dd("sd-target", tgtOpts, d.target.kind + ":" + d.target.id, v => {
          const [k, i] = v.split(":"); const pp = projSummary(i);
          sd.target = k === "project" ? {kind: k, id: i, agents: pp && pp.members.length ? [pp.members[0]] : []} : {kind: k, id: i};
          sd.deliver = []; drawScheduleForm(); }) : `<span class="muted">先去 Agent 页新建一个 Agent。</span>`}
        ${p ? `<div class="row" style="margin-top:8px">${p.members.map(m => { const ag = agentOf(m); return ag ? `<button class="pick ${d.target.agents.includes(m) ? "on" : ""}" style="padding:6px 10px" data-m="${esc(m)}">${seal(ag, "sm", false)}<span class="nm">${esc(ag.name)}</span></button>` : ""; }).join("")}</div>
          <div class="help">选了几个就交给几个人，一起做，结果都留在项目里。</div>` : ""}</div>
      <label for="sd-prompt">做什么</label><textarea id="sd-prompt" class="textarea" placeholder="写清楚每次要它做什么，就像平时发消息一样">${esc(d.prompt)}</textarea>
      <label>什么时候</label><div>
        <div class="seg" id="sd-freq">${[["daily", "每天"], ["workday", "工作日"], ["weekly", "每周"], ["monthly", "每月"], ["once", "只一次"]].map(([k, n]) => `<button class="${d.freq === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px">
          ${d.freq === "weekly" ? `<span class="weekdays">${WEEK.map((w, i) => `<button class="${d.days.includes(i) ? "on" : ""}" data-d="${i}" aria-label="周${w}">${w}</button>`).join("")}</span>` : ""}
          ${d.freq === "monthly" ? `<span style="width:120px">${dd("sd-dom", Array.from({length: 28}, (_, i) => [String(i + 1), `${i + 1} 号`, ""]), String(d.dom), v => sd.dom = +v)}</span>` : ""}
          ${d.freq === "once" ? `<span style="width:170px">${dd("sd-date", dates, dates.some(x => x[0] === d.date) ? d.date : (sd.date = dates[0][0]), v => sd.date = v)}</span>` : ""}
          <span style="width:110px">${dd("sd-h", hours, hh, v => sd.time = v + ":" + sd.time.split(":")[1])}</span>
          <span style="width:110px">${dd("sd-m", mins, mins.some(x => x[0] === mm) ? mm : "00", v => sd.time = sd.time.split(":")[0] + ":" + v)}</span>
        </div></div>
      <label>结果发到哪</label><div class="checks">
        <span class="check on locked">${ICON.check}留在这里</span>
        ${ch("feishu") ? `<button class="check ${d.deliver.includes("feishu") ? "on" : ""}" data-dl="feishu">${ICON.check}也发到飞书「${esc(ch("feishu").bot)}」</button>` : ""}
        ${ch("weixin") ? `<button class="check ${d.deliver.includes("weixin") ? "on" : ""}" data-dl="weixin">${ICON.check}也发到微信「${esc(ch("weixin").bot)}」</button>` : ""}
      </div>
      ${a ? `<label>对话</label><div><div class="seg" id="sd-sess"><button class="${d.session === "new" ? "on" : ""}" data-s="new">每次开新对话</button><button class="${d.session === "same" ? "on" : ""}" data-s="same">接着同一个对话</button></div>
        <div class="help">${d.session === "new" ? "每次从头开始，互不影响。" : "记得之前每次跑的结果，适合「和上次比有什么变化」这类任务。"}</div></div>` : ""}
      <span></span><div class="row" style="margin-top:6px"><button class="btn primary" id="sd-save">${d._id ? "保存" : "新建"}</button><button class="btn" id="sd-try">先试跑一次</button></div>
    </div></div></div>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const m = b.dataset.m; sd.target.agents = sd.target.agents.includes(m) ? sd.target.agents.filter(x => x !== m) : [...sd.target.agents, m]; drawScheduleForm(); });
  document.querySelectorAll("#sd-freq button").forEach(b => b.onclick = () => { sd.freq = b.dataset.f; drawScheduleForm(); });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const i = +b.dataset.d; sd.days = sd.days.includes(i) ? sd.days.filter(x => x !== i) : [...sd.days, i].sort(); drawScheduleForm(); });
  document.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => { const k = b.dataset.dl; sd.deliver = sd.deliver.includes(k) ? sd.deliver.filter(x => x !== k) : [...sd.deliver, k]; drawScheduleForm(); });
  document.querySelectorAll("#sd-sess button").forEach(b => b.onclick = () => { sd.session = b.dataset.s; drawScheduleForm(); });
  $("#sd-save").onclick = saveSchedule;
  $("#sd-try").onclick = trySchedule;
}
function schedFields(){
  sd.name = $("#sd-name").value; sd.prompt = $("#sd-prompt").value;
  const {_id, ...f} = sd; return f;
}
async function saveSchedule(){
  const f = schedFields();
  const r = await act(() => api("/api/schedule/save", {id: sd._id, fields: f}, sd._id ? ownerOf(sd._id) : ownerOf(f.target && f.target.id) || S.me), sd._id ? "已保存" : "已新建");
  await loadState(); location.hash = `#/schedules/${encodeURIComponent(r.id)}`;
}
async function trySchedule(){
  const fs = schedFields();
  const r = await act(() => api("/api/schedule/try", {fields: fs}, ownerOf(fs.target && fs.target.id) || S.me));
  await loadState();
  const href = r.chat ? `#/chats/${encodeURIComponent(r.chat)}` : `#/projects/${encodeURIComponent(r.project)}`;
  dialog("试跑开始了", `<p>这次试跑不会保存成定时任务。可以先去看看效果，回来接着改。</p>`,
    `<button class="btn" onclick="closeDialog()">留在这里</button><a class="btn primary" href="${href}" target="_blank" style="text-decoration:none" onclick="closeDialog()">在新标签页里看</a>`);
}

// ================= 对话框 =================
function dialog(title, body, foot){
  closeDialog();
  const s = document.createElement("div"); s.className = "scrim";
  s.onclick = e => { if (e.target === s) closeDialog(); };
  s.innerHTML = `<div class="dialog" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" aria-label="关闭" onclick="closeDialog()">${ICON.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  document.body.append(s);
}
function closeDialog(){ document.querySelector(".scrim:not(.dirpick)")?.remove(); }
function confirmBox(title, text, okLabel){
  return new Promise(res => {
    dialog(title, `<p>${esc(text)}</p>`, `<button class="btn" id="cb-no">取消</button><button class="btn danger" id="cb-ok">${esc(okLabel)}</button>`);
    $("#cb-no").onclick = () => { closeDialog(); res(false); };
    $("#cb-ok").onclick = () => { closeDialog(); res(true); };
    $("#cb-ok").focus();
  });
}

function toggleList(on){
  document.querySelector(".app").classList.toggle("list-off", !on);
  if (narrow()) return;                  // 窄屏的抽屉开关不记，宽屏时还按原来的习惯
  try { localStorage.setItem("ccim.listOff", on ? "" : "1"); } catch {}
}

let wasNarrow = narrow();
addEventListener("resize", () => {             // 跨过窄屏线时：变窄按当前页面收起，变宽恢复原来的习惯
  if (narrow() === wasNarrow) return;
  wasNarrow = narrow();
  let off = !!current.id;
  if (!wasNarrow) { try { off = !!localStorage.getItem("ccim.listOff"); } catch { off = false; } }
  document.querySelector(".app").classList.toggle("list-off", off);
});

// ================= 启动 =================
(async () => {
  try { if (localStorage.getItem("ccim.listOff") && !narrow()) document.querySelector(".app").classList.add("list-off"); } catch {}
  try { await loadState(); } catch (e) { $("#main").innerHTML = `<div class="empty"><h2>连不上 ccim</h2><p>${esc(e.message)}</p></div>`; return; }
  connectEvents();
  if (!location.hash) history.replaceState(null, "", "#/chats/new");
  route();
})();
</script>
</body>
</html>
