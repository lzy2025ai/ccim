<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccim</title>
<style>
:root{
  --paper:#F1F2EE; --panel:#FFFFFF; --sunk:#E8EAE5; --line:#DCDFD8; --line-strong:#C9CDC4;
  --ink:#1D222B; --ink-2:#3A404A; --muted:#6C7169; --faint:#9A9F97;
  --qing:#2B4C6F; --qing-soft:#E3EAF1;
  --lu:#3F7A5E; --zhe:#9A5B34; --huang:#B8902A; --zhu:#B5402F; --dai:#4A4F6B;
  --ok:#3F7A5E; --warn:#B8902A; --bad:#B5402F;
  --song:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:76px 300px 1fr;height:100vh;overflow:hidden}
body{overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line)}
.brand{font:700 15px/1 var(--song);letter-spacing:.5px;margin-bottom:18px;color:var(--ink)}
.rail a{width:60px;padding:9px 0 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:12px}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--panel);color:var(--qing);box-shadow:0 0 0 1px var(--line)}
.rail .spacer{flex:1}

.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.list-head h1{font:600 19px/1.2 var(--song);margin:0}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;padding:0 8px 16px}
.group{font-size:12px;color:var(--faint);padding:12px 10px 4px}
.item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:flex-start;width:100%;text-align:left}
.item:hover{background:var(--sunk)}
.item.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.item .t{flex:1;min-width:0}
.item .title,.item .sub{display:block}
.item .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{font-size:12px;color:var(--faint);white-space:nowrap}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}

/* ---------- 印章 ---------- */
.seal{--c:var(--qing);flex:none;width:34px;height:34px;border-radius:7px;background:var(--c);color:#fff;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;padding:3px;
  font:700 12px/1 var(--song);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.seal.one{grid-template-columns:1fr;grid-template-rows:1fr;font-size:16px}
.seal span{display:block}
.seal.vert{grid-template-columns:1fr;gap:1px}
.seal.lg{width:64px;height:64px;font-size:22px;border-radius:12px;padding:6px}
.seal.lg.one{font-size:30px}
.seal.sm{width:26px;height:26px;font-size:10px;border-radius:6px;padding:2px}
.seal.sm.one{font-size:13px}
.seal.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.seal .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--faint)}
.seal .dot.on{background:var(--ok)} .seal .dot.busy{background:var(--huang)}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--qing);border-color:var(--qing);color:#fff}
.btn.primary:hover{background:#223d5a}
.btn.danger{color:var(--bad);border-color:#E3C3BD}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn svg{width:15px;height:15px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.feishu{background:#E4ECF7;color:#2F5A93} .tag.weixin{background:#E3F1E7;color:#2E6E45} .tag.term{background:#ECE9E3;color:#5E5547}
.tag.web{background:var(--qing-soft);color:var(--qing)}
.path{font:12px/1.4 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.on i{background:var(--ok)} .status.busy i{background:var(--huang)} .status.err i{background:var(--bad)}
.status.busy{color:#7A6216}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:380px;padding:40px 20px}
.empty h2{font:600 22px/1.3 var(--song);color:var(--ink);margin:0 0 8px}

/* ---------- 对话 ---------- */
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
.chat-head .name{font:600 16px/1.3 var(--song)}
.chat-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.chat-head .grow{flex:1;min-width:0}
.notice{margin:12px 22px 0;padding:9px 12px;border-radius:8px;background:#F4F1E6;color:#6B5A27;font-size:13px}
.thread{flex:1;overflow:auto;padding:22px 0 10px}
.msg{max-width:760px;margin:0 auto 22px;padding:0 22px}
.msg.me{display:flex;justify-content:flex-end}
.bubble{background:var(--sunk);padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:80%;white-space:pre-wrap}
.msg.me .from{display:none}
.from-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.from-row b{font:600 14px var(--song)}
.from-row .tag{margin-left:2px}
.answer{line-height:1.75}
.answer p{margin:0 0 10px}
.answer code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.answer pre{font:12.5px/1.6 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px 14px;border-radius:8px;overflow:auto}
.steps{border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;font-size:13px}
.steps>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink-2)}
.steps>button .chev{margin-left:auto;transition:transform .15s}
.steps.open>button .chev{transform:rotate(90deg)}
.steps ol{display:none;margin:0;padding:2px 12px 10px 34px;color:var(--muted)}
.steps.open ol{display:block}
.steps li{padding:2px 0}
.steps li code{font:12px var(--mono);color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--huang);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--ink-2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.approve{border:1px solid #E6D7AE;background:#FBF7EA;border-radius:10px;padding:12px 14px;margin:4px 0 12px}
.approve .q{font-weight:600;margin-bottom:4px}
.approve pre{margin:6px 0 10px;font:12.5px var(--mono);background:#fff;border:1px solid #EFE5C8;padding:8px 10px;border-radius:6px;white-space:pre-wrap}
.approve .acts{display:flex;gap:8px;flex-wrap:wrap}
.approve.done{background:var(--paper);border-color:var(--line)}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.file{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.composer{max-width:760px;width:100%;margin:0 auto 18px;padding:0 22px}
.box{border:1px solid var(--line-strong);border-radius:14px;background:var(--panel);box-shadow:0 1px 0 rgba(29,34,43,.03)}
.box:focus-within{border-color:var(--qing)}
.box textarea{width:100%;border:0;outline:none;resize:none;padding:12px 14px 4px;min-height:52px;max-height:200px;background:none}
.box .bar{display:flex;align-items:center;gap:4px;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--sunk)}
.chip svg{width:12px;height:12px}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--qing);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--line-strong);cursor:default}
.send.stop{background:var(--ink)}
.send svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(29,34,43,.14);padding:6px;min-width:200px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.pop button:hover{background:var(--sunk)}
.pop button .ck{margin-left:auto;color:var(--qing)}
.pop .sec{font-size:12px;color:var(--faint);padding:6px 10px 2px}
.pop .desc{font-size:12px;color:var(--muted)}

.newchat{margin:auto;width:min(720px,100%);padding:0 22px 12vh}
.newchat h2{font:600 26px/1.3 var(--song);margin:0 0 16px}
.seg.mini{padding:2px}
.seg.mini button{padding:3px 9px;font-size:12px}
.chip .path{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or{margin-top:22px;font-size:13px;color:var(--muted)}
.link{color:var(--qing);text-decoration:underline;text-underline-offset:3px}
.pop{max-height:60vh;overflow:auto}

.select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--panel);text-align:left}
.select:hover{border-color:var(--ink-2)}
.select[aria-expanded="true"]{border-color:var(--qing);box-shadow:0 0 0 3px var(--qing-soft)}
.select svg{width:14px;height:14px;color:var(--muted);flex:none}

/* ---------- 弹窗 ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,34,43,.28);display:grid;place-items:center;z-index:20}
.dialog{background:var(--panel);border-radius:16px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(29,34,43,.25)}
.dialog header{padding:18px 22px 4px;display:flex;align-items:center}
.dialog header h2{font:600 19px var(--song);margin:0;flex:1}
.dialog .body{padding:10px 22px 20px}
.dialog footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form .seg{justify-self:start}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:left}
.pick:hover{border-color:var(--ink-2)}
.pick.on{border-color:var(--qing);box-shadow:0 0 0 1px var(--qing)}
.pick .nm{font-weight:500} .pick .ds{font-size:12px;color:var(--muted)}

/* ---------- 表单 ---------- */
.form{display:grid;grid-template-columns:120px 1fr;gap:16px 18px;align-items:start}
.form>label{padding-top:7px;color:var(--ink-2)}
.form .help{font-size:12px;color:var(--muted);margin-top:4px}
.input,.textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);outline:none}
.input:focus,.textarea:focus{border-color:var(--qing)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:6px;background:var(--c)}
.swatches button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}

/* ---------- Agent ---------- */
.agent-page{overflow:auto;flex:1}
.agent-top{display:flex;gap:18px;align-items:center;padding:26px 32px 20px;border-bottom:1px solid var(--line)}
.agent-top h2{font:600 24px/1.25 var(--song);margin:0}
.agent-top .role{color:var(--muted);margin-top:2px;max-width:560px}
.agent-top .grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 8px;margin:0 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.pane{padding:22px 32px 40px;max-width:900px}
.sect{margin-bottom:28px}
.sect h3{font:600 15px var(--song);margin:0 0 10px}
.channel{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.channel .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 13px var(--sans)}
.channel .ci.feishu{background:#E4ECF7;color:#2F5A93} .channel .ci.weixin{background:#E3F1E7;color:#2E6E45}
.channel .grow{flex:1;min-width:0}
.channel.add{border-style:dashed;color:var(--muted)}
.channel.add:hover{border-color:var(--ink-2);color:var(--ink)}
.channel svg{width:16px;height:16px;flex:none}
.chat-row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chat-row:hover .tt{color:var(--qing)}
.chat-row .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 18px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.working{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#7A6216;margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:40}

@media (max-width:980px){.app{grid-template-columns:64px 250px 1fr}.rail a{width:52px}}
@media (max-width:760px){.app{grid-template-columns:1fr}.rail,.list{display:none}}
/* ---------- 正式版补充 ---------- */
.answer h1,.answer h2,.answer h3{font:600 16px/1.4 var(--song);margin:14px 0 6px}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
.answer li{margin:2px 0}
.answer table{border-collapse:collapse;margin:6px 0 12px;font-size:13px}
.answer th,.answer td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.answer th{background:var(--paper)}
.answer blockquote{margin:0 0 10px;padding:2px 12px;border-left:3px solid var(--line-strong);color:var(--muted)}
.answer a{color:var(--qing)}
.answer img{max-width:100%;border-radius:8px}
.note{max-width:760px;margin:-8px auto 18px;padding:0 22px;font-size:13px;color:var(--muted)}
.note .answer{line-height:1.6}
.card-done{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 12px}
.sentfile{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
  text-decoration:none;color:inherit;margin:2px 0 10px}
.sentfile:hover{border-color:var(--ink-2)}
.sentimg{display:block;max-width:420px;max-height:320px;border-radius:10px;border:1px solid var(--line);margin:2px 0 10px}
.pending{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.pending .file button{color:var(--muted);margin-left:2px}
.box.drag{border-color:var(--qing);background:var(--qing-soft)}
.state-err{color:var(--bad)}
.qr{width:220px;height:220px;margin:8px auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr svg{width:100%;height:100%}
.logs{font:12px/1.5 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px;border-radius:8px;max-height:60vh;overflow:auto;white-space:pre-wrap}
.custom{display:flex;gap:6px;padding:6px 10px 8px}
.custom input{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line-strong);border-radius:7px;outline:none}
.loading{margin:auto;color:var(--faint)}
.chip,.seg button,.btn,.tag{white-space:nowrap}
.box .bar{flex-wrap:wrap;row-gap:4px}
.chat-head .meta .path{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1100px){.app{grid-template-columns:64px 240px 1fr}.rail a{width:52px}}
.retry{color:var(--bad);font-size:13px}

</style>

</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand">ccim</div>
    <a href="#/chats" data-nav="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H9l-5 4z"/></svg>对话</a>
    <a href="#/agents" data-nav="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 10h6M9 14h4"/></svg>Agent</a>
    <div class="spacer"></div>
    <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>设置</a>
  </nav>
  <section class="list" id="list"></section>
  <main class="main" id="main"></main>
</div>

<script>
// ================= 基础 =================
const COLORS = {qing:"#2B4C6F", lu:"#3F7A5E", zhe:"#9A5B34", huang:"#B8902A", zhu:"#B5402F", dai:"#4A4F6B"};
const BASE = {claude:"Claude Code", codex:"Codex"};
const CLAUDE_MODELS = [["opus","Opus","最强，复杂任务"],["sonnet","Sonnet","快，日常够用"],["haiku","Haiku","最快最省"],["fable","Fable",""]];
const EFFORTS = {claude:["low","medium","high","xhigh","max"], codex:["minimal","low","medium","high","xhigh"]};
const EFF_DESC = {minimal:"几乎不思考，最快", low:"快，适合简单的事", medium:"日常够用", high:"想得更周全", xhigh:"更深入", max:"最深入，最慢"};
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  clip:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',

async function api(path, body){

function when(ts){
  if (!ts) return "";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  if (isNaN(d)) return "";
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function group(ts){
  if (!ts) return "更早";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  return d.toDateString() === now.toDateString() ? "今天" : "更早";
}
function modelName(m){
  if (!m) return "默认";
  const s = String(m), one = s.includes("[1m]") ? "（1M）" : "", b = s.replace("[1m]", "");
  const hit = CLAUDE_MODELS.find(([k]) => b === k || b.startsWith(`claude-${k}`));
  if (!hit) return s;
  const v = b.match(/(\d+)-(\d+)(?:-\d{8})?$/);
  return hit[1] + (v ? ` ${v[1]}.${v[2]}` : "") + one;
}
function seal(a, size = "", dot = true){
  const txt = a ? (a.seal || "新") : "临";
  const chars = [...txt].slice(0, 2);
  const c = a ? (COLORS[a.color] || COLORS.qing) : "#8A8F87";
  const cls = ["seal", size, chars.length === 1 ? "one" : "vert"].join(" ");
  const d = a && dot ? `<i class="dot ${a.busy ? "busy" : (a.channels || []).some(c => c.state === "online") || !(a.channels || []).length ? "on" : ""}"></i>` : "";
  return `<span class="${cls}" style="--c:${c}" aria-hidden="true">${chars.map(x => `<span>${esc(x)}</span>`).join("")}${d}</span>`;
}

// ---- Markdown（只认常见写法，先转义再排版） ----
function md(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let i = 0;
  while (i < lines.length){
    let l = lines[i];
    if (/^```/.test(l)){
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const row = s => s.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))){ out.push(`<h3>${inline(m[2])}</h3>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)){
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    if (!l.trim()){ i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|\s*([-*]|\d+\.)\s|>)/.test(lines[i])) buf.push(inline(lines[i++]));
    out.push(`<p>${buf.join("<br>")}</p>`);
  }
  return out.join("");
}

function closePop(){ document.querySelectorAll(".pop").forEach(p => p.remove()); document.querySelectorAll(".select[aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false")); }
function pop(e, html, below){
  e.stopPropagation(); closePop();
  const p = document.createElement("div"); p.className = "pop"; p.innerHTML = html; document.body.append(p);
  p.addEventListener("click", ev => ev.stopPropagation());
  const r = e.currentTarget.getBoundingClientRect();
  if (below) p.style.minWidth = r.width + "px";
  p.style.left = Math.max(10, Math.min(r.left, innerWidth - p.offsetWidth - 10)) + "px";
  const up = r.top - p.offsetHeight - 6;
  p.style.top = (below || up < 10 ? Math.min(r.bottom + 6, innerHeight - p.offsetHeight - 10) : up) + "px";
  p.querySelector("input")?.focus();
  return p;
}

addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); document.querySelector(".scrim")?.remove(); } });
const DD = {};
function dd(id, opts, value, onpick){

function optList(opts, value, pickJs){
  return opts.map(([v, l, ds]) => `<button role="option" aria-selected="${value === v}" onclick="${pickJs(v)}"><span><div>${esc(l)}</div>${ds ? `<div class="desc">${esc(ds)}</div>` : ""}</span>${value === v ? `<span class="ck">✓</span>` : ""}</button>`).join("");
}
function openDD(e, id){

function connectEvents(){
  const es = new EventSource("/api/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (detail && ev.chat === detail.id){
      if (ev.type === "progress"){
        detail.progress = ev.state === "working" ? ev : null;
        detail.busy = ev.state === "working";
        drawThread(); drawComposerState();
      } else {
        const i = ev.type === "card" ? detail.log.findIndex(r => r.type === "card" && r.id === ev.id) : -1;
        if (i >= 0) detail.log[i] = ev; else detail.log.push(ev);
        drawThread();
      }
    }
    if (ev.type !== "progress" || ev.state !== "working") refreshSoon();
    else { const c = S.chats.find(x => x.id === ev.chat); if (c && !c.busy) refreshSoon(); }
  };
  es.onerror = () => {};   // 浏览器会自己重连
}

async function addFiles(list){

  const [cm, ce] = S.defaults.claude || [], [xm, xe] = S.defaults.codex || [];
  $("#main").innerHTML = `<div class="agent-page"><div class="agent-top"><div class="grow"><h2>默认模型和思考深度</h2>
    <div class="role">Agent 和对话里没单独设置时用这里的。这里也不设，就跟随 Claude Code、Codex 自己的设置，和你在终端里用的一致。</div></div></div>
    <div class="pane"><div class="sect"><h3>Claude Code</h3><div class="form">
      <label>模型</label>${dd("g-cm", modelOpts("claude", `跟随 Claude Code 设置（${modelName(cm)}）`), gs.model, v => gs.model = v)}
      <label>思考深度</label>${dd("g-ce", effortOpts("claude", `跟随 Claude Code 设置（${ce || "默认"}）`), gs.effort, v => gs.effort = v)}</div></div>
      ${S.codex ? `<div class="sect"><h3>Codex</h3><div class="form">
      <label>模型</label>${dd("g-xm", modelOpts("codex", `跟随 Codex 设置（${xm || "默认"}）`), gs.codex_model, v => gs.codex_model = v)}
      <label>思考深度</label>${dd("g-xe", effortOpts("codex", `跟随 Codex 设置（${xe || "默认"}）`), gs.codex_effort, v => gs.codex_effort = v)}</div></div>` : ""}
      <button class="btn primary" onclick="saveGlobal()">保存</button></div></div>`;
}
async function saveGlobal(){ await act(() => api("/api/global", gs), "已保存，新开的对话开始用"); await loadState(); }

// ================= 对话框 =================
function dialog(title, body, foot){
  closeDialog();
  const s = document.createElement("div"); s.className = "scrim";
  s.onclick = e => { if (e.target === s) closeDialog(); };
  s.innerHTML = `<div class="dialog" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" aria-label="关闭" onclick="closeDialog()">${ICON.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  document.body.append(s);
}
function closeDialog(){ document.querySelector(".scrim")?.remove(); }
function confirmBox(title, text, okLabel){
  return new Promise(res => {
    dialog(title, `<p>${esc(text)}</p>`, `<button class="btn" id="cb-no">取消</button><button class="btn danger" id="cb-ok">${esc(okLabel)}</button>`);
    $("#cb-no").onclick = () => { closeDialog(); res(false); };
    $("#cb-ok").onclick = () => { closeDialog(); res(true); };
    $("#cb-ok").focus();
  });
}

// ================= 启动 =================
(async () => {
  try { await loadState(); } catch (e) { $("#main").innerHTML = `<div class="empty"><h2>连不上 ccim</h2><p>${esc(e.message)}</p></div>`; return; }
  connectEvents();
  if (!location.hash) history.replaceState(null, "", "#/chats/new");
  route();
})();
</script>
