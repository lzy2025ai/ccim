}
function latestOf(){   // 最新版本：服务器上的（每次合并自动部署 main），没用服务器就看哪台电脑问到了 GitHub
  if (S.hub && S.hub.commit) return S.hub.commit;
  for (const m of S.machines || []) { const v = verOf(m); if (v && v.latest) return v.latest.commit; }
  return null;
}
function upgradeBox(m){
  const v = verOf(m);
  if (!v) return m.online ? `<span class="upg new" title="在那台电脑的终端里运行：uv tool upgrade ccim，再运行 ccim restart 网页">版本较旧，在那台电脑上运行 uv tool upgrade ccim</span>` : "";
  const j = v.job || {};
  if (j.state === "running" && Date.now() / 1000 - j.at < 900) { if (!window._upw) setTimeout(watchUpgrade); return `<span class="upg busy"><span class="spin"></span>正在升级：${esc(j.step || "")}</span>`; }
  const recent = j.at && Date.now() / 1000 - j.at < 86400;
  const note = recent && j.state === "done" && j.to !== j.from ? `<span class="upg ok">已升级到 ${esc(j.to)}</span>`
    : recent && j.state === "done" && j.note && Date.now() / 1000 - j.at < 600 ? `<span class="upg ok">${esc(j.note)}</span>`
    : recent && (j.state === "failed" || j.state === "rolled_back") ? `<span class="upg err" title="${esc(j.error || "")}">${j.state === "rolled_back" ? "新版本没起来，已装回原来的版本" : "升级失败"}</span>` : "";
  if (v.kind !== "release") return note;
  const lt = latestOf();
  if (lt && v.commit === lt) return note || `<span class="upg">已是最新</span>`;
  // 不知道最新版本（没用服务器、也连不上 GitHub）：「检查更新」，点了它自己去取，是最新就说已经是最新版
  const label = lt ? `升级到 ${esc(lt)}` : "检查更新";
  const btn = m.online && v.can_upgrade ? `<button class="btn" onclick="upgradeMachine(${q(m.id)},${q(m.name)},false,${lt ? "true" : "false"})">${label}</button>`
    : `<span class="upg">在那台电脑上运行 uv tool upgrade ccim</span>`;
  return `${lt ? note || `<span class="upg new">有新版本</span>` : note}${btn}`;
}
async function upgradeMachine(mid, name, force, known){

function liveOf(r){
  // 排队中的回答：它所在的对话正在干活、而且它是那个对话里最早没做完的一件，就是正在做的这件
  if (r.state !== "queued") return null;
  const p = proj.progress[r.chat]; if (!p) return null;
  const first = proj.feed.find(x => x.type === "reply" && x.chat === r.chat && x.state === "queued");
  return first && first.id === r.id ? p : null;
}
function stateLabel(r, live){
  if (live) return `<span class="status busy"><i></i>干活中</span>`;
  if (r.type === "mention" && r.state === "queued" && detail && detail.log) {     // 只有前面真有它没做完的活才算排队；轮到它了、进度还没到时是准备中
    const first = detail.log.find(x => x.type === "mention" && x.chat === r.chat && x.state === "queued");
    if (!first || first.id === r.id) return `<span class="status busy"><i></i>准备中</span>`;
  }
  return {done: `<span class="status on"><i></i>完成${r.elapsed ? `，用时 ${fmtSec(r.elapsed)}` : ""}</span>`,
          queued: `<span class="status"><i></i>排队中，前面的做完就开始</span>`,
          error: `<span class="status err"><i></i>出错了</span>`, stopped: `<span class="status"><i></i>停下了</span>`,
          lost: `<span class="status"><i></i>没做完（ccim 重启过）</span>`}[r.state] || "";
}
function fmtSec(s){ s = Math.round(s || 0); return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${String(s % 60).padStart(2, "0")} 秒`; }
function replyBody(r, live){

    const head = `<span class="spin"></span>${live.retry ? `网络不稳，正在重试（第 ${live.retry} 次）` : last ? "正在" + esc(last) : "思考中"}`;

}

const WEEK = ["一", "二", "三", "四", "五", "六", "日"];
let sched = null, sd = null;

function pad2(n){ return String(n).padStart(2, "0"); }
function fmtDay(d){
  const now = new Date(), t = new Date(now); t.setDate(now.getDate() + 1);
  if (d.toDateString() === now.toDateString()) return "今天";
  if (d.toDateString() === t.toDateString()) return "明天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function fmtTs(sec){ if (!sec) return ""; const d = new Date(sec * 1000); return `${fmtDay(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function freqText(s){
  if (s.freq === "daily") return `每天 ${s.time}`;
  if (s.freq === "workday") return `每个工作日 ${s.time}`;
  if (s.freq === "weekly") return `每周${(s.days || []).map(d => WEEK[d]).join("、")} ${s.time}`;
  if (s.freq === "monthly") return `每月 ${s.dom} 号 ${s.time}`;
  return `${s.date ? fmtDay(new Date(s.date + "T00:00")) : ""} ${s.time}，只跑一次`;
}
const groupOf = id => S.chats.find(c => c.id === id);
function schedMark(s){
  if (s.target.kind === "group") { const g = groupOf(s.target.id); return seal(g ? agentOf(g.agent) : null, "", false); }
  if (s.target.kind === "project") return pmark(projSummary(s.target.id) || {name: "项"});
  return seal(agentOf(s.target.id), "", false);
}
function schedTarget(s){
  if (s.target.kind === "group") {
    const g = groupOf(s.target.id);
    const who = s.target.agents.length ? s.target.agents : g ? [g.agent] : [];
    return `群聊「${g ? g.title : "已删除"}」：${who.map(a => (agentOf(a) || {name: "已删除的 Agent"}).name).join("、")}`;
  }
  if (s.target.kind === "project") {
    const p = projSummary(s.target.id);
    return `项目「${p ? p.name : "已删除"}」：${s.target.agents.map(a => (agentOf(a) || {name: "已删除的 Agent"}).name).join("、")}`;

}

  if (keep.name !== undefined) { d.name = keep.name; d.prompt = keep.prompt; }
  const hours = Array.from({length: 24}, (_, h) => [pad2(h), pad2(h) + " 点", ""]);
  const mins = Array.from({length: 12}, (_, i) => [pad2(i * 5), pad2(i * 5) + " 分", ""]);
  const [hh, mm] = d.time.split(":");
  const where = x => multi() ? "，在" + ((machineOf(x.machine) || {}).name || "") : "";
  const tgtOpts = [...S.agents.map(a => ["agent:" + a.id, a.name, BASE[a.base || "claude"] + where(a)]),
                   ...S.chats.filter(c => c.agent && (c.members || []).length).map(c => ["group:" + c.id, `群聊「${c.title}」`, `${c.members.length + 1} 个 Agent` + where(c)])];
  const g = d.target.kind === "group" ? groupOf(d.target.id) : null;
  const p = g ? {members: g.members} : null;          // 群聊里选交给谁（不选就是主 Agent）
  const a = d.target.kind === "agent" ? agentOf(d.target.id) : g ? agentOf(g.agent) : null;
  const ch = k => a && a.channels.find(c => (k === "weixin") === (c.kind === "weixin"));
  const dates = Array.from({length: 60}, (_, i) => { const x = new Date(); x.setDate(x.getDate() + i);
    const v = `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`; return [v, fmtDay(x) + (i > 1 ? `（周${WEEK[(x.getDay() + 6) % 7]}）` : ""), ""]; });
  $("#main").innerHTML = `<div class="agent-page"><div class="agent-top"><div class="grow"><h2>${d._id ? "编辑定时任务" : "新建定时任务"}</h2>
    <div class="role">到了时间，ccim 会把任务交给它去做；电脑睡着错过了，醒来补跑一次。</div></div></div>
    <div class="pane"><div class="form">
      <label for="sd-name">名字</label><input id="sd-name" class="input" value="${esc(d.name)}" placeholder="比如：每日站会小结">
      <label>给谁</label><div>${tgtOpts.length ? dd("sd-target", tgtOpts, d.target.kind + ":" + d.target.id, v => {
          const [k, i] = v.split(":");
          sd.target = k === "group" ? {kind: k, id: i, agents: []} : {kind: k, id: i};
          sd.deliver = []; drawScheduleForm(); }) : `<span class="muted">先去 Agent 页新建一个 Agent。</span>`}
        ${p ? `<div class="row" style="margin-top:8px">${p.members.map(m => { const ag = agentOf(m); return ag ? `<button class="pick ${d.target.agents.includes(m) ? "on" : ""}" style="padding:6px 10px" data-m="${esc(m)}">${seal(ag, "sm", false)}<span class="nm">${esc(ag.name)}</span></button>` : ""; }).join("")}</div>
          <div class="help">不选就交给「${esc((agentOf(g.agent) || {}).name || "")}」；选了就在群里 @ 他们。</div>` : ""}</div>
      <label for="sd-prompt">做什么</label><textarea id="sd-prompt" class="textarea" placeholder="写清楚每次要它做什么，就像平时发消息一样">${esc(d.prompt)}</textarea>
      <label>什么时候</label><div>
        <div class="seg" id="sd-freq">${[["daily", "每天"], ["workday", "工作日"], ["weekly", "每周"], ["monthly", "每月"], ["once", "只一次"]].map(([k, n]) => `<button class="${d.freq === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px">
          ${d.freq === "weekly" ? `<span class="weekdays">${WEEK.map((w, i) => `<button class="${d.days.includes(i) ? "on" : ""}" data-d="${i}" aria-label="周${w}">${w}</button>`).join("")}</span>` : ""}
          ${d.freq === "monthly" ? `<span style="width:120px">${dd("sd-dom", Array.from({length: 28}, (_, i) => [String(i + 1), `${i + 1} 号`, ""]), String(d.dom), v => sd.dom = +v)}</span>` : ""}
          ${d.freq === "once" ? `<span style="width:170px">${dd("sd-date", dates, dates.some(x => x[0] === d.date) ? d.date : (sd.date = dates[0][0]), v => sd.date = v)}</span>` : ""}
          <span style="width:110px">${dd("sd-h", hours, hh, v => sd.time = v + ":" + sd.time.split(":")[1])}</span>
          <span style="width:110px">${dd("sd-m", mins, mins.some(x => x[0] === mm) ? mm : "00", v => sd.time = sd.time.split(":")[0] + ":" + v)}</span>
        </div></div>
      <label>结果发到哪</label><div class="checks">
        <span class="check on locked">${ICON.check}留在这里</span>
        ${ch("feishu") ? `<button class="check ${d.deliver.includes("feishu") ? "on" : ""}" data-dl="feishu">${ICON.check}也发到飞书「${esc(ch("feishu").bot)}」</button>` : ""}
        ${ch("weixin") ? `<button class="check ${d.deliver.includes("weixin") ? "on" : ""}" data-dl="weixin">${ICON.check}也发到微信「${esc(ch("weixin").bot)}」</button>` : ""}
      </div>
      ${d.target.kind === "agent" && a ? `<label>对话</label><div><div class="seg" id="sd-sess"><button class="${d.session === "new" ? "on" : ""}" data-s="new">每次开新对话</button><button class="${d.session === "same" ? "on" : ""}" data-s="same">接着同一个对话</button></div>
        <div class="help">${d.session === "new" ? "每次从头开始，互不影响。" : "记得之前每次跑的结果，适合「和上次比有什么变化」这类任务。"}</div></div>` : ""}
      <span></span><div class="row" style="margin-top:6px"><button class="btn primary" id="sd-save">${d._id ? "保存" : "新建"}</button><button class="btn" id="sd-try">先试跑一次</button></div>
    </div></div></div>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const m = b.dataset.m; sd.target.agents = sd.target.agents.includes(m) ? sd.target.agents.filter(x => x !== m) : [...sd.target.agents, m]; drawScheduleForm(); });
  document.querySelectorAll("#sd-freq button").forEach(b => b.onclick = () => { sd.freq = b.dataset.f; drawScheduleForm(); });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const i = +b.dataset.d; sd.days = sd.days.includes(i) ? sd.days.filter(x => x !== i) : [...sd.days, i].sort(); drawScheduleForm(); });
  document.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => { const k = b.dataset.dl; sd.deliver = sd.deliver.includes(k) ? sd.deliver.filter(x => x !== k) : [...sd.deliver, k]; drawScheduleForm(); });
  document.querySelectorAll("#sd-sess button").forEach(b => b.onclick = () => { sd.session = b.dataset.s; drawScheduleForm(); });
  $("#sd-save").onclick = saveSchedule;
  $("#sd-try").onclick = trySchedule;
}
function schedFields(){
  sd.name = $("#sd-name").value; sd.prompt = $("#sd-prompt").value;
  const {_id, ...f} = sd; return f;
}
async function saveSchedule(){
  const f = schedFields();
  const r = await act(() => api("/api/schedule/save", {id: sd._id, fields: f}, sd._id ? ownerOf(sd._id) : ownerOf(f.target && f.target.id) || S.me), sd._id ? "已保存" : "已新建");
  await loadState(); location.hash = `#/schedules/${encodeURIComponent(r.id)}`;
}
async function trySchedule(){
  const fs = schedFields();
  const r = await act(() => api("/api/schedule/try", {fields: fs}, ownerOf(fs.target && fs.target.id) || S.me));
  await loadState();
  const href = r.chat ? `#/chats/${encodeURIComponent(r.chat)}` : `#/projects/${encodeURIComponent(r.project)}`;
  dialog("试跑开始了", `<p>这次试跑不会保存成定时任务。可以先去看看效果，回来接着改。</p>`,
    `<button class="btn" onclick="closeDialog()">留在这里</button><a class="btn primary" href="${href}" target="_blank" style="text-decoration:none" onclick="closeDialog()">在新标签页里看</a>`);
}

// ================= 文档预览和编辑（#34） =================
const DOC_KIND = {md: "md", markdown: "md", html: "html", htm: "html", docx: "docx"};
const DOC_LABEL = {md: "Markdown 文档", html: "网页", docx: "Word 文档"};
function docKind(name){ const m = /\.([a-z]+)$/i.exec(name || ""); return m ? DOC_KIND[m[1].toLowerCase()] || null : null; }

// 文档用的 Markdown：比聊天里的全（各级标题、图片、嵌套列表、任务、对齐的表格）。
// 每块带 data-l="起-止"（原文行号），之后在排好版的页面上改哪一段就知道对应原文哪几行。
function docMd(src, assets = {}, nested){
  const L = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const isFence = l => /^\s{0,3}(```|~~~)/.test(l);
  const isHead = l => /^\s{0,3}#{1,6}(\s|$)/.test(l);
  const isHr = l => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isQuote = l => /^\s{0,3}>/.test(l);
  const isTable = k => /\|/.test(L[k] || "") && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[k + 1] || "");
  const at = (a, b) => nested ? "" : ` data-l="${a}-${b}"`;
  let i = 0;
  while (i < L.length){
    const l = L[i], a = i;
    if (!l.trim()){ i++; continue; }
    if (isFence(l)){
      const mark = l.trim().slice(0, 3), lang = l.trim().slice(3).trim(), buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(mark)) buf.push(L[i++]);
      i++;
      out.push(`<pre${at(a, i - 1)}><code${lang ? ` data-lang="${esc(lang)}"` : ""}>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (isHead(l)){
      const m = l.trim().match(/^(#{1,6})\s*(.*?)\s*#*\s*$/);
      out.push(`<h${m[1].length}${at(a, a)}>${mdInline(m[2], assets)}</h${m[1].length}>`); i++; continue;
    }
    if (isHr(l)){ out.push(`<hr${at(a, a)}>`); i++; continue; }
    if (isTable(i)){
      const row = s => s.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      const head = row(L[i]), align = row(L[i + 1]).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : "");
      const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ""}>${mdInline(c, assets)}</${tag}>`;
      i += 2; const body = [];
      while (i < L.length && L[i].trim() && /\|/.test(L[i])) body.push(row(L[i++]));
      out.push(`<table${at(a, i - 1)}><thead><tr>${head.map((c, k) => cell("th", c, k)).join("")}</tr></thead><tbody>${body.map(r => `<tr>${head.map((_, k) => cell("td", r[k] || "", k)).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (isQuote(l)){
      const buf = [];
      while (i < L.length && L[i].trim() && (isQuote(L[i]) || !(isFence(L[i]) || isHead(L[i]) || isList(L[i])))) buf.push(L[i++].replace(/^\s{0,3}>\s?/, ""));
      out.push(`<blockquote${at(a, i - 1)}>${docMd(buf.join("\n"), assets, true)}</blockquote>`); continue;
    }
    if (isList(l)){
      const items = [];
      while (i < L.length){
        const x = L[i];
        if (!x.trim()){
          let k = i; while (k < L.length && !L[k].trim()) k++;
          if (k < L.length && (isList(L[k]) || /^\s{2,}\S/.test(L[k]))) { i = k; continue; }
          break;
        }
        const m = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m && items.length && m[1].length <= items[0].ind && /\d/.test(m[2]) !== items[0].ord) break;   // 有序、无序换了：另起一个列表
        if (m) items.push({ind: m[1].replace(/\t/g, "    ").length, ord: /\d/.test(m[2]), start: parseInt(m[2]) || 1, text: m[3]});
        else if (items.length && (/^\s+\S/.test(x) || !(isFence(x) || isHead(x) || isQuote(x) || isHr(x)))) items[items.length - 1].text += "\n" + x.trim();
        else break;
        i++;
      }
      out.push(mdList(items, assets).replace(/^<(ul|ol)/, `<$1${at(a, i - 1)}`)); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !isFence(L[i]) && !isHead(L[i]) && !isHr(L[i]) && !isQuote(L[i]) && !isTable(i) && !isList(L[i])) buf.push(L[i++]);
    const text = buf.join("\n");
    const one = text.trim().match(/^!\[([^\]]*)\]\(([^)]*)\)$/);    // 单独一行的图片：图注用它的说明文字
    out.push(one && one[1].trim() ? `<figure${at(a, i - 1)}>${mdInline(text.trim(), assets)}<figcaption>${esc(one[1])}</figcaption></figure>` : `<p${at(a, i - 1)}>${mdInline(text, assets)}</p>`);
  }
  return out.join("");
}
function mdList(items, assets){
  if (!items.length) return "";
  const base = items[0].ind, ord = items[0].ord, html = [];
  let k = 0;
  while (k < items.length){
    const it = items[k++], kids = [];
    while (k < items.length && items[k].ind > base) kids.push(items[k++]);
    const task = it.text.match(/^\[([ xX])\]\s+/);
    const body = mdInline(task ? it.text.slice(task[0].length) : it.text, assets);
    html.push(task ? `<li class="task"><span class="tick">${task[1] === " " ? "☐" : "☑"}</span>${body}${mdList(kids, assets)}</li>` : `<li>${body}${mdList(kids, assets)}</li>`);
  }
  return ord ? `<ol${items[0].start !== 1 ? ` start="${items[0].start}"` : ""}>${html.join("")}</ol>` : `<ul>${html.join("")}</ul>`;
}
function mdInline(s, assets = {}){
  const keep = [], put = h => `\u0000${keep.push(h) - 1}\u0000`;
  const src = u => { u = (u || "").trim().replace(/^<|>$/g, ""); return assets[u] || (/^(https?:|data:image\/)/i.test(u) ? u : ""); };
  const href = u => /^(https?:|mailto:|#)/i.test(u) ? u : "";
  const img = (alt, u) => { const v = src(u); return put(v ? `<img src="${esc(v)}" alt="${esc(alt)}">` : `<span class="miss">图片没找到：${esc(u.replace(/^<|>$/g, ""))}</span>`); };
  const fmt = t => t
    .replace(/\*\*(?=\S)(.+?)\*\*/g, "<b>$1</b>").replace(/__(?=\S)(.+?)__/g, "<b>$1</b>")
    .replace(/~~(?=\S)(.+?)~~/g, "<s>$1</s>")
    .replace(/(^|[^*\w])\*(?=[^\s*])(.+?)\*(?![\w*])/g, "$1<i>$2</i>");
  s = String(s)
    .replace(/\\([\\`*_{}\[\]()#+\-.!|~<>])/g, (_, c) => put(esc(c)))
    .replace(/`([^`]+)`/g, (_, c) => put(`<code>${esc(c)}</code>`))
    .replace(/!\[([^\]]*)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+["'][^"']*["'])?\s*\)/g, (_, alt, u) => img(alt, u))
    .replace(/\[([^\]]+)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+["'][^"']*["'])?\s*\)/g, (m, t, u) => { const h = href(u.replace(/^<|>$/g, "")); return h ? put(`<a href="${esc(h)}" target="_blank" rel="noopener">${fmt(esc(t)).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n])}</a>`) : t; })
    .replace(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi, (m, u) => { const a = m.match(/\balt\s*=\s*["']([^"']*)["']/i); return img(a ? a[1] : "", u); })
    .replace(/<br\s*\/?>/gi, () => put("<br>"))
    .replace(/(^|[^"'(\w])(https?:\/\/[^\s<>）)\]，。]+)/g, (_, p, u) => p + put(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`))
    .replace(/( {2,}|\\)\n/g, () => put("<br>"))
    .replace(/([　-〿一-鿿＀-￯])\n(?=[　-〿一-鿿＀-￯])/g, "$1");   // 中文之间的换行不要变成空格
  return fmt(esc(s)).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]).replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
}

let DOC = null;   // 打开的文档：{chat, machine, path, d（接口给的）, mode: view / edit, draft, dirty}
async function openDoc(path, v, chat){
  chat = chat || (DOC && DOC.path === path ? DOC.chat : detail && detail.id);
  if (DOC && DOC.dirty && !(DOC.path === path && v == null) && !await confirmBox("还没保存", "刚才改的内容还没保存，现在离开就丢掉了。", "丢掉")) return;
  const machine = DOC && DOC.chat === chat ? DOC.machine : ctxMachine;
  if (!DOC || DOC.path !== path) { DOC = {chat, machine, path, d: null, mode: "view", draft: "", dirty: false}; drawDoc(); }
  let d;
  try { d = await api(`/api/doc?chat=${encodeURIComponent(chat)}&path=${encodeURIComponent(path)}${v != null ? "&v=" + v : ""}`, undefined, machine); }
  catch (e) { toast(e.message); if (DOC && !DOC.d) closeDoc(true); return; }
  if (!DOC || DOC.path !== path) return;
  DOC = {...DOC, d, draft: d.text || "", dirty: false, mode: DOC.mode === "edit" && d.latest && d.editable ? "edit" : "view"};
  drawDoc();
}
async function closeDoc(force){
  if (!DOC) return;
  if (!force && DOC.dirty && !await confirmBox("还没保存", "刚才改的内容还没保存，关掉就丢掉了。", "丢掉")) return;
  DOC = null; drawDoc();
}
function docBody(){
  const d = DOC.d;
  if (!d) return `<div class="doc-loading">…</div>`;
  if (DOC.mode === "edit") return `<textarea id="doc-ta" class="${d.kind === "html" ? "code" : ""}" spellcheck="false" oninput="docInput(this)" onkeydown="docKey(event)">${esc(DOC.draft)}</textarea>`;
  if (d.kind === "md") return `<article class="doc-md">${docMd(DOC.draft, d.assets)}</article>`;
  if (d.kind === "docx") return `<article class="doc-md">${d.html}</article>`;
  const html = DOC.dirty ? DOC.draft : d.html;     // 改过没保存：按改的预览（图片只认原来就有的）
  return `<iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(html)}" title="${esc(d.name)}"></iframe>`;
}
function verLabel(x, k){
  const t = x.at ? new Date(x.at * 1000) : null, p = n => String(n).padStart(2, "0");
  return `第 ${k + 1} 版 · ${x.by === "me" ? "你改的" : "Agent 发的"}${t ? ` · ${t.getMonth() + 1}月${t.getDate()}日 ${p(t.getHours())}:${p(t.getMinutes())}` : ""}`;
}
function drawDoc(){
  let el = $("#docpane");
  if (!DOC){ el?.remove(); document.body.classList.remove("doc-open"); return; }
  if (!el){ el = document.createElement("aside"); el.id = "docpane"; el.className = "docpane"; el.setAttribute("aria-label", "文档"); document.body.append(el); }
  document.body.classList.add("doc-open");
  const d = DOC.d, vs = d ? d.versions : [];
  const name = d ? d.name : DOC.path.split("/").pop();
  el.innerHTML = `<div class="doc-top">
      <button class="icon-btn" aria-label="关闭" onclick="closeDoc()">${narrow() ? ICON.left : ICON.x}</button>
      <div class="nm" title="${esc(DOC.path)}">${esc(name)}${DOC.dirty ? `<span class="dot" title="没保存"></span>` : ""}</div>
      ${vs.length > 1 ? `<button class="vbtn" onclick="docVersions(event)">第 ${d.v + 1} 版${ICON.down}</button>` : ""}
      ${d && d.editable && d.latest ? `<span class="seg mini"><button class="${DOC.mode === "view" ? "on" : ""}" onclick="docMode('view')">预览</button><button class="${DOC.mode === "edit" ? "on" : ""}" onclick="docMode('edit')">编辑</button></span>` : ""}
      ${d && d.editable && d.latest ? `<button class="btn primary" id="doc-save" ${DOC.dirty ? "" : "hidden"} onclick="docSave()">保存</button>` : ""}
    </div>
    ${d && !d.latest ? `<div class="doc-old"><span>${esc(verLabel(vs[d.v], d.v))}</span><span class="sp"></span>
      ${d.editable ? `<button class="btn" onclick="docRestore()">用这一版的内容</button>` : ""}<button class="btn" onclick="openDoc(DOC.path)">看最新的</button></div>` : ""}
    <div class="doc-body">${docBody()}</div>`;
}
function docVersions(e){
  const vs = DOC.d.versions;
  pop(e, vs.map((x, k) => `<button role="option" aria-selected="${k === DOC.d.v}" onclick="closePop();openDoc(DOC.path,${k === vs.length - 1 ? "null" : k})"><span>${esc(verLabel(x, k))}</span>${k === DOC.d.v ? `<span class="ck">✓</span>` : ""}</button>`).reverse().join(""), true);
}
function docMode(m){
  if (!DOC || DOC.mode === m) return;
  DOC.mode = m; drawDoc();
  if (m === "edit") $("#doc-ta")?.focus();
}
function docInput(ta){
  DOC.draft = ta.value;
  if (!DOC.dirty){ DOC.dirty = true; $("#doc-save")?.removeAttribute("hidden"); $("#docpane .nm")?.insertAdjacentHTML("beforeend", `<span class="dot" title="没保存"></span>`); }
}
function docKey(e){
  if ((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); docSave(); }
  if (e.key === "Escape") e.stopPropagation();
}
async function docSave(){
  if (!DOC || !DOC.dirty || DOC.saving) return;
  DOC.saving = true;
  const {chat, path, draft, machine} = DOC;
  try {
    const d = await api("/api/doc/save", {chat, path, text: draft, mtime: DOC.d.mtime}, machine);
    if (DOC && DOC.path === path){ DOC.d = d; DOC.dirty = DOC.draft !== d.text; if (DOC.mode !== "edit") drawDoc(); else { $("#doc-save")?.toggleAttribute("hidden", !DOC.dirty); $("#docpane .nm .dot")?.remove(); } }
    toast("已保存");
  } catch (e) { toast(e.message); }
  finally { if (DOC) DOC.saving = false; }
}
async function docRestore(){   // 看旧版本时：把它的内容拿到最新版里编辑，保存了才算
  const text = DOC.d.text;
  await openDoc(DOC.path);
  if (!DOC || !DOC.d || !DOC.d.latest) return;
  DOC.draft = text; DOC.dirty = text !== DOC.d.text; DOC.mode = "edit"; drawDoc();
}
function docChanged(rec, chat){   // 对话里来了这个文件的新版本
  if (!DOC || DOC.chat !== chat || rec.path !== DOC.path || !DOC.d) return;
  if (DOC.dirty) { toast("这个文件有新版本了，保存前先看看"); return; }
  if (DOC.d.latest) openDoc(DOC.path);
}
function docChip(path, name, sub){
  return `<button class="docfile" onclick="openDoc(${q(path)})"><span class="di">${ICON.file}</span><span class="t"><b>${esc(name)}</b><small>${esc(sub)}</small></span></button>`;
}

// ================= 对话框 =================
function dialog(title, body, foot){
  closeDialog();
  const s = document.createElement("div"); s.className = "scrim";
  s.onclick = e => { if (e.target === s) closeDialog(); };
  s.innerHTML = `<div class="dialog" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" aria-label="关闭" onclick="closeDialog()">${ICON.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  document.body.append(s);
}
function closeDialog(){ document.querySelector(".scrim:not(.dirpick)")?.remove(); }
function confirmBox(title, text, okLabel){
  return new Promise(res => {
    dialog(title, `<p>${esc(text)}</p>`, `<button class="btn" id="cb-no">取消</button><button class="btn danger" id="cb-ok">${esc(okLabel)}</button>`);
    $("#cb-no").onclick = () => { closeDialog(); res(false); };
    $("#cb-ok").onclick = () => { closeDialog(); res(true); };
    $("#cb-ok").focus();
  });
}

function toggleList(on){
  document.querySelector(".app").classList.toggle("list-off", !on);
  if (narrow()) return;                  // 窄屏的抽屉开关不记，宽屏时还按原来的习惯
  try { localStorage.setItem("ccim.listOff", on ? "" : "1"); } catch {}
}

// 列表和内容之间的分隔线：拖动改宽度，记住；双击恢复默认（#32）
(function(){
  const app = document.querySelector(".app"), rz = $("#resizer");
  try { const w = +localStorage.getItem("ccim.listW"); if (w) app.style.setProperty("--list-w", w + "px"); } catch {}
  let start = null;
  rz.addEventListener("pointerdown", e => {
    e.preventDefault();                      // 不然浏览器开始选文字，拖动就断了
    start = {x: e.clientX, w: $("#list").getBoundingClientRect().width};
    rz.classList.add("drag"); document.body.classList.add("resizing");
  });
  addEventListener("pointermove", e => {
    if (!start) return;
    const w = Math.round(Math.min(Math.max(start.w + e.clientX - start.x, 200), Math.min(620, innerWidth - 420)));
    app.style.setProperty("--list-w", w + "px");
  });
  const end = () => {
    if (!start) return;
    start = null; rz.classList.remove("drag"); document.body.classList.remove("resizing");
    try { localStorage.setItem("ccim.listW", Math.round($("#list").getBoundingClientRect().width)); } catch {}
    drawToc && drawToc();
  };
  addEventListener("pointerup", end); addEventListener("pointercancel", end);
  rz.addEventListener("dblclick", () => { app.style.removeProperty("--list-w"); try { localStorage.removeItem("ccim.listW"); } catch {} });
})();
// iPad、手机：输入法收起后 Safari 有时不把页面滚回去，上半截卡着（#56）。输入框失焦、可视区域变回原高时滚回顶部
(function(){
  const reset = () => { if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = document.body.scrollTop = 0; } };
  document.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("textarea,input")) setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("textarea,input")) reset(); }, 120); });
  const vv = window.visualViewport;
  if (vv) { let full = vv.height; vv.addEventListener("resize", () => { if (vv.height >= full - 1) { full = vv.height; reset(); } else if (vv.height > full) full = vv.height; }); }
})();
let wasNarrow = narrow();
addEventListener("resize", () => {             // 跨过手机宽度：变窄按当前页面一屏一个，变宽恢复原来的折叠习惯
  if (narrow() === wasNarrow) return;
  wasNarrow = narrow();
  const app = document.querySelector(".app");
  app.classList.toggle("phone-main", wasNarrow && phoneMain());
  let off = false;
  if (!wasNarrow) { try { off = !!localStorage.getItem("ccim.listOff"); } catch {} }
  app.classList.toggle("list-off", off);
});

// ================= 启动 =================
(async () => {
  watchListScroll();
  try { if (localStorage.getItem("ccim.listOff") && !narrow()) document.querySelector(".app").classList.add("list-off"); } catch {}
  try { await loadState(); } catch (e) { $("#main").innerHTML = `<div class="empty"><h2>连不上 ccim</h2><p>${esc(e.message)}</p></div>`; return; }
  connectEvents();
  if (!location.hash) history.replaceState(null, "", "#/chats/new");
  route();
})();
</script>
