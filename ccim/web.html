  if (DOC && DOC.ws) { el?.remove(); if (!SIDE) document.body.classList.remove("doc-open"); if (WS && $("#ws-ed")) drawWsDoc(); return; }
  if (!DOC){ el?.remove(); if (!SIDE) document.body.classList.remove("doc-open"); if (WS && wsEdShown() && $("#ws-ed")) drawWsEditor(); return; }
  if (!el){ el = document.createElement("aside"); el.id = "docpane"; el.className = "docpane"; el.setAttribute("aria-label", "文档"); document.body.append(el); }
  document.body.classList.add("doc-open");
  const d = DOC.d, vs = d ? d.versions : [];
  const name = d ? d.name : DOC.path.split("/").pop();
  el.innerHTML = `<div class="doc-top">
      <button class="icon-btn" aria-label="关闭" onclick="closeDoc()">${narrow() ? ICON.left : ICON.x}</button>
      <div class="nm" title="${esc(DOC.path)}">${esc(name)}${DOC.dirty ? `<span class="dot" title="没保存"></span>` : ""}</div>
      ${vs.length > 1 ? `<button class="vbtn" onclick="docVersions(event)">第 ${d.v + 1} 版${ICON.down}</button>` : ""}
      ${d && (d.kind === "md" || d.editable && d.latest) ? `<span class="seg mini">${[["view", "预览"], ...(d.kind === "md" ? [["wx", "公众号"]] : []), ...(d.editable && d.latest ? [["edit", "编辑"]] : [])]
        .map(([m, l]) => `<button class="${DOC.mode === m ? "on" : ""}" onclick="docMode('${m}')">${l}</button>`).join("")}</span>` : ""}
      ${d && d.kind === "pdf" ? pdfTab() : ""}
      ${d ? `<a class="icon-btn" aria-label="下载" title="下载" href="${esc(docFileUrl())}" download="${esc(name)}">${ICON.dl}</a>` : ""}
      ${d && d.editable && d.latest ? `<button class="btn primary" id="doc-save" ${DOC.dirty ? "" : "hidden"} onclick="docSave()">保存</button>` : ""}
    </div>
    ${d && !d.latest ? `<div class="doc-old"><span>${esc(verLabel(vs[d.v], d.v))}</span><span class="sp"></span>
      ${d.editable ? `<button class="btn" onclick="docRestore()">用这一版的内容</button>` : ""}<button class="btn" onclick="openDoc(DOC.path)">看最新的</button></div>` : ""}
    <div class="doc-body">${docBody()}</div>`;
  if (DOC.mode === "wx") wxImgTools();
  codeSync();
}
// 手机浏览器里嵌着的 PDF 可能只显示第一页，新标签页里能完整翻。主屏幕图标打开的网页新标签页没登录，不给这个按钮
const pdfTab = () => STANDALONE ? "" : `<a class="icon-btn" aria-label="在新标签页打开" title="在新标签页打开" href="${esc(docFileUrl())}" target="_blank" rel="noopener">${ICON.ext}</a>`;
function docFileUrl(){   // 正在看的这一版：最新的是原文件，旧版本是留底
  return `/api/file/-/${encodeURIComponent(String(DOC.path).split("/").pop() || "file")}?chat=${encodeURIComponent(DOC.chat)}&path=${encodeURIComponent(DOC.d.file || DOC.path)}`
    + (isRemote(DOC.machine) ? `&machine=${encodeURIComponent(DOC.machine)}` : "");
}
function docVersions(e){
  const vs = DOC.d.versions;
  pop(e, vs.map((x, k) => `<button role="option" aria-selected="${k === DOC.d.v}" onclick="closePop();openDoc(DOC.path,${k === vs.length - 1 ? "null" : k})"><span>${esc(verLabel(x, k))}</span>${k === DOC.d.v ? `<span class="ck">✓</span>` : ""}</button>`).reverse().join(""), true);
}
function docMode(m){
  if (!DOC || DOC.mode === m) return;
  DOC.mode = m; drawDoc();
  if (m === "edit") $("#doc-ta")?.focus();
  else if (DOC.d && DOC.d.kind === "md") try { localStorage.setItem("ccim.mdView", m); } catch {}   // Markdown 默认用上次看的版式
}
function docInput(ta){
  DOC.draft = ta.value;
  if (!DOC.dirty){ DOC.dirty = true; $("#doc-save")?.removeAttribute("hidden"); docRoot()?.querySelector(".doc-top .nm")?.insertAdjacentHTML("beforeend", `<span class="dot" title="没保存"></span>`); }
  if (DOC.ws) wsAutosave();
}
function docKey(e){
  if ((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); docSave(); }
  if (e.key === "Escape") e.stopPropagation();
}
async function docSave(quiet){
  if (!DOC || !DOC.dirty || DOC.saving) return;
  const doc = DOC;
  doc.saving = true;
  const {chat, path, draft, machine} = doc;
  try {
    const d = await api("/api/doc/save", {chat, path, text: draft, mtime: doc.d.mtime}, machine);
    doc.d = {...d, name: doc.d.name}; doc.dirty = doc.draft !== d.text;
    if (DOC === doc){
      const root = docRoot();
      root?.querySelector("#doc-save")?.toggleAttribute("hidden", !doc.dirty);
      if (!doc.dirty) root?.querySelector(".doc-top .nm .dot")?.remove();
      if (doc.ws) { doc.savedAt = Date.now(); const top = root?.querySelector(".doc-top"); if (top && !top.querySelector(".saved")) top.querySelector(".nm").insertAdjacentHTML("afterend", `<span class="saved">已保存</span>`); }
      else if (doc.mode !== "edit") drawDocBody();
    }
    if (!quiet) toast("已保存");
    if (doc.ws && WS) { const t = $("#ws-ed .ws-tab.on .dot"); if (t && !doc.dirty) t.remove(); }
  } catch (e) { toast(e.message); }
  finally { doc.saving = false; }
}
async function docRestore(){   // 看旧版本时：把它的内容拿到最新版里编辑，保存了才算
  const text = DOC.d.text;
  await openDoc(DOC.path);
  if (!DOC || !DOC.d || !DOC.d.latest) return;
  DOC.draft = text; DOC.dirty = text !== DOC.d.text; DOC.mode = "edit"; drawDoc();
}
function docChanged(rec, chat){   // 对话里来了这个文件的新版本
  if (!DOC || DOC.chat !== chat || rec.path !== DOC.path || !DOC.d) return;
  if (DOC.dirty) { toast("这个文件有新版本了，保存前先看看"); return; }
  if (DOC.d.latest) openDoc(DOC.path);
}
function docChip(path, name, sub){
  return `<button class="docfile" onclick="openDoc(${q(path)})"><span class="di">${ICON.file}</span><span class="t"><b>${esc(name)}</b><small>${esc(sub)}</small></span></button>`;
}

// ---- 公众号排版（#35）：Markdown 按公众号版式显示，样式全写成内联的（公众号编辑器只认内联样式），一键复制 ----
const WX_THEMES = {
  fresh: {name: "清爽", acc: "#1F7A8C"},
  warm: {name: "暖橙", acc: "#D9673B"},
  ink: {name: "墨韵", acc: "#222222"},
};
let wxTheme = (() => { try { return WX_THEMES[localStorage.getItem("ccim.wxTheme")] ? localStorage.getItem("ccim.wxTheme") : "fresh"; } catch { return "fresh"; } })();
function wxCss(key){
  const a = WX_THEMES[key].acc, ink = key === "ink", serif = `"Songti SC","STSong",serif`;
  return [
    ["*", ""],
    ["p", "margin:0 0 1.2em;"],
    ["h1", `font-size:22px;font-weight:bold;line-height:1.5;margin:1.4em 0 1em;text-align:center;color:#222;${ink ? `font-family:${serif};` : ""}`],
    ["h2", key === "warm" ? `display:table;margin:2em auto 1.1em;padding:4px 16px;background:${a};color:#fff;border-radius:4px;font-size:17px;font-weight:bold;line-height:1.6;`
      : ink ? `font-size:19px;font-weight:bold;line-height:1.5;margin:2em 0 1em;padding-bottom:8px;border-bottom:1px solid #222;text-align:center;font-family:${serif};color:#111;`
      : `font-size:18px;font-weight:bold;line-height:1.5;margin:2em 0 1em;padding-left:10px;border-left:4px solid ${a};color:#222;`],
    ["h3", `font-size:16px;font-weight:bold;line-height:1.5;margin:1.6em 0 .8em;color:${ink ? "#111" : a};${ink ? `font-family:${serif};` : ""}`],
    ["h4,h5,h6", "font-size:15px;font-weight:bold;margin:1.4em 0 .6em;color:#333;"],
    ["b,strong", `font-weight:bold;color:${ink ? "#000" : a};`],
    ["i,em", "font-style:italic;"],
    ["s", "text-decoration:line-through;color:#999;"],
    ["blockquote", `margin:0 0 1.2em;padding:10px 14px;background:${ink ? "#f5f5f5" : "#f7f8f8"};border-left:3px solid ${ink ? "#999" : a};color:#666;font-size:14px;line-height:1.75;border-radius:0 4px 4px 0;`],
    ["blockquote p", "margin:0 0 .6em;"],
    ["blockquote > :last-child", "margin-bottom:0;"],
    ["ul,ol", "margin:0 0 1.2em;padding-left:1.6em;"],
    ["li", "margin:.3em 0;"],
    ["li ul,li ol", "margin:.3em 0 0;"],
    ["li.task", "list-style:none;margin-left:-1.4em;"],
    ["code", "font-size:90%;padding:2px 5px;margin:0 2px;border-radius:3px;background:rgba(27,31,35,.06);color:#C7254E;font-family:Menlo,Consolas,monospace;"],
    ["pre", "margin:0 0 1.2em;padding:12px 14px;background:#F6F8FA;border-radius:6px;font-size:13px;line-height:1.65;overflow-x:auto;"],
    ["pre code", "display:block;padding:0;margin:0;background:none;color:#333;font-size:13px;white-space:nowrap;"],
    ["figure", "margin:1.5em 0;text-align:center;"],
    ["img", "max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px;"],
    ["figcaption", "font-size:13px;color:#999;margin-top:8px;text-align:center;line-height:1.5;"],
    ["table", "border-collapse:collapse;width:100%;margin:0 0 1.2em;font-size:14px;line-height:1.6;"],
    ["th", "background:#F5F6F7;font-weight:bold;border:1px solid #DDD;padding:8px 10px;"],
    ["td", "border:1px solid #DDD;padding:8px 10px;"],
    ["td p,th p", "margin:0;"],
    ["hr", "border:0;border-top:1px solid #E5E5E5;margin:2em 0;"],
    ["sup[data-note]", `color:${ink ? "#666" : a};font-size:12px;margin-left:1px;`],
    [".miss", "display:inline-block;padding:2px 8px;border:1px dashed #ccc;border-radius:4px;font-size:13px;color:#999;"],
  ].filter(x => x[1]);
}
const WX_ROOT = `font-size:15px;line-height:1.8;color:#333;letter-spacing:.5px;word-break:break-word;text-align:justify;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;`;
function wxHtml(src, assets){
  const t = document.createElement("template");
  t.innerHTML = docMd(src, assets);
  const c = t.content, notes = [];
  c.querySelectorAll("a").forEach(a => {   // 公众号正文里外链点不了：改成文末的参考资料
    const h = a.getAttribute("href") || "";
    const s = document.createElement("span"); s.dataset.href = h; s.innerHTML = a.innerHTML;
    if (/^https?:\/\/mp\.weixin\.qq\.com\//.test(h)) { a.removeAttribute("target"); a.removeAttribute("rel"); return; }
    if (/^https?:/.test(h) && a.textContent !== h){
      let n = notes.indexOf(h); if (n < 0) { notes.push(h); n = notes.length - 1; }
      s.insertAdjacentHTML("beforeend", `<sup data-note="">[${n + 1}]</sup>`);
    }
    a.replaceWith(s);
  });
  c.querySelectorAll("pre code").forEach(x => { x.innerHTML = x.innerHTML.replace(/\t/g, "    ").replace(/ /g, "&nbsp;").replace(/\n/g, "<br>"); });
  if (notes.length){
    c.append(Object.assign(document.createElement("h4"), {textContent: "参考资料"}));
    const p = document.createElement("p"); p.setAttribute("style", "font-size:13px;color:#888;line-height:1.7;word-break:break-all;");
    p.innerHTML = notes.map((h, k) => `[${k + 1}] ${esc(h)}`).join("<br>");
    c.append(p);
  }
  for (const [sel, css] of wxCss(wxTheme)) c.querySelectorAll(sel).forEach(el => el.setAttribute("style", (el.getAttribute("style") || "").replace(/;?\s*$/, ";").replace(/^;$/, "") + css));   // 后面的规则优先
  const box = document.createElement("div"); box.append(c);
  return `<section id="wx-art" style="${esc(WX_ROOT)}">${box.innerHTML}</section>`;
}
function wxView(){
  const d = DOC.d;
  return `<div class="wx-bar">${dd("wxtheme", Object.entries(WX_THEMES).map(([k, t]) => [k, t.name]), wxTheme, v => { wxTheme = v; try { localStorage.setItem("ccim.wxTheme", v); } catch {} drawDocBody(); })}
      <span class="sp"></span><button class="btn primary" onclick="wxCopy()">${ICON.copy}复制到公众号</button></div>
    <div class="wx-page ${canBlock() ? "can-edit" : ""}" onclick="blockClick(event)">${wxHtml(DOC.draft, d.assets)}</div>`;
}
function cleanCopy(el){
  const c = el.cloneNode(true);
  c.querySelectorAll(".wx-img").forEach(x => x.remove());
  [c, ...c.querySelectorAll("*")].forEach(x => { ["data-l", "data-src", "data-href", "data-note", "data-lang", "contenteditable", "class", "id"].forEach(a => x.removeAttribute(a)); });
  return c;
}
async function wxCopy(){
  const art = $("#wx-art"); if (!art) return;
  const c = cleanCopy(art), html = c.outerHTML, text = art.innerText;
  try {
    await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})]);
  } catch {
    const tmp = document.createElement("div");                 // 剪贴板接口用不了时：选中再复制
    tmp.style.cssText = "position:fixed;left:-9999px;top:0"; tmp.append(c); document.body.append(tmp);
    const r = document.createRange(); r.selectNodeContents(tmp);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    const ok = document.execCommand("copy"); s.removeAllRanges(); tmp.remove();
    if (!ok) { toast("复制没成功，再试一次"); return; }
  }
  toast("已复制，到公众号编辑器里粘贴");
}
async function wxCopyImg(e, btn){
  e.stopPropagation();
  const img = btn.closest(".wx-imgbox")?.querySelector("img"); if (!img) return;
  try {
    const png = await new Promise((res, rej) => {               // 剪贴板只认 PNG：先画到画布上再转
      const im = new Image(); im.onload = () => { const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
        cv.getContext("2d").drawImage(im, 0, 0); cv.toBlob(b => b ? res(b) : rej(), "image/png"); }; im.onerror = rej; im.src = img.src; });
    await navigator.clipboard.write([new ClipboardItem({"image/png": png})]);
    toast("图片已复制");
  } catch { toast("这张图复制不了，用「下载」"); }
}
function wxSaveImg(e, btn){
  e.stopPropagation();
  const img = btn.closest(".wx-imgbox")?.querySelector("img"); if (!img) return;
  const a = document.createElement("a"); a.href = img.src;
  a.download = (img.dataset.src || "图片").split("/").pop().replace(/\.svg$/i, ".svg") || "图片";
  document.body.append(a); a.click(); a.remove();
}
function wxImgTools(){   // 每张图下面：复制图片、下载（不进复制出去的内容）
  document.querySelectorAll("#wx-art img").forEach(img => {
    if (img.parentElement.classList.contains("wx-imgbox")) return;
    const box = document.createElement("span"); box.className = "wx-imgbox";
    img.replaceWith(box); box.append(img);
    box.insertAdjacentHTML("beforeend", `<span class="wx-img"><button onclick="wxCopyImg(event,this)">复制图片</button><button onclick="wxSaveImg(event,this)">下载</button></span>`);
  });
}

// ---- 在排好版的页面上直接改（#35）：点一段，改完点别处就写回原文的那几行 ----
const canBlock = () => !!(DOC && DOC.d && DOC.d.latest && DOC.d.editable && DOC.d.kind === "md");
function blockClick(e){
  if (!canBlock()) return;
  if (e.target.closest("button,.wx-img,a,[contenteditable=true],textarea")) return;
  const el = e.target.closest("[data-l]");
  if (!el || el.closest("[contenteditable=true]")) return;
  const [a, b] = el.dataset.l.split("-").map(Number);
  const rich = /^(P|H[1-6]|BLOCKQUOTE|UL|OL)$/.test(el.tagName) && !el.querySelector("table,pre,figure");
  if (rich){
    el.contentEditable = "true"; el.classList.add("editing");
    const at = document.caretRangeFromPoint && document.caretRangeFromPoint(e.clientX, e.clientY);
    el.focus();
    if (at){ const s = getSelection(); s.removeAllRanges(); s.addRange(at); }
    let cancel = false;
    el.onkeydown = ev => {
      if (ev.key === "Escape"){ ev.stopPropagation(); cancel = true; el.blur(); }
      if ((ev.metaKey || ev.ctrlKey) && ev.key === "s"){ ev.preventDefault(); el.blur(); docSave(); }
      if ((ev.metaKey || ev.ctrlKey) && /^[bi]$/.test(ev.key)){ ev.preventDefault(); document.execCommand(ev.key === "b" ? "bold" : "italic"); }
    };
    el.onpaste = ev => { ev.preventDefault(); document.execCommand("insertText", false, ev.clipboardData.getData("text/plain")); };
    el.onblur = () => { el.onblur = null; cancel ? drawDocBody() : putLines(a, b, blockMd(el)); };
  } else {
    const L = DOC.draft.replace(/\r/g, "").split("\n");
    const ta = document.createElement("textarea"); ta.className = "block-src"; ta.spellcheck = false;
    ta.value = L.slice(a, b + 1).join("\n");
    el.replaceWith(ta);
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
    fit(); ta.oninput = fit; ta.focus();
    let cancel = false;
    ta.onkeydown = ev => { if (ev.key === "Escape"){ ev.stopPropagation(); cancel = true; ta.blur(); } if ((ev.metaKey || ev.ctrlKey) && ev.key === "s"){ ev.preventDefault(); ta.blur(); docSave(); } };
    ta.onblur = () => { ta.onblur = null; cancel ? drawDocBody() : putLines(a, b, ta.value); };
  }
}
function putLines(a, b, text){
  const L = DOC.draft.replace(/\r/g, "").split("\n"), old = L.slice(a, b + 1).join("\n");
  if (text.trim() === old.trim() || docMd(text, {}, true) === docMd(old, {}, true)) { drawDocBody(); return; }   // 只是写法不同、显示一样：不算改
  L.splice(a, b - a + 1, ...(text.trim() ? text.replace(/\s+$/, "").split("\n") : []));
  DOC.draft = L.join("\n");
  docInput({value: DOC.draft});
  drawDocBody();
}
// 改过的一段转回 Markdown
function blockMd(el){
  const tag = el.tagName;
  if (/^H[1-6]$/.test(tag)) return "#".repeat(+tag[1]) + " " + inlineMd(el).replace(/\s*\n\s*/g, " ").trim();
  if (tag === "BLOCKQUOTE") return paras(el).map(p => p.split("\n").map(x => "> " + x).join("\n")).join("\n>\n");
  if (tag === "UL" || tag === "OL") return listMd(el, 0);
  return paras(el).join("\n\n");
}
function paras(el){   // 段落里按回车会分出 div / p：每个算一段
  const out = []; let cur = "";
  for (const n of el.childNodes){
    if (n.nodeType === 1 && /^(DIV|P)$/.test(n.tagName)){ if (cur.trim()) out.push(cur.trim()); cur = ""; const t = inlineMd(n).trim(); if (t) out.push(t); }
    else cur += n.nodeType === 3 ? mdText(n.nodeValue) : inlineMd({childNodes: [n]});
  }
  if (cur.trim()) out.push(cur.trim());
  return out.length ? out : [""];
}
function listMd(el, depth){
  const ord = el.tagName === "OL"; let k = parseInt(el.getAttribute("start")) || 1;
  return [...el.children].filter(li => li.tagName === "LI").map(li => {
    const sub = [...li.children].filter(x => x.tagName === "UL" || x.tagName === "OL");
    const tick = li.querySelector(":scope > .tick");
    const own = {childNodes: [...li.childNodes].filter(x => !sub.includes(x) && x !== tick)};
    const mark = ord ? `${k++}. ` : "- ";
    const box = tick ? (tick.textContent.includes("☑") ? "[x] " : "[ ] ") : "";
    return "  ".repeat(depth) + mark + box + inlineMd(own).replace(/\s*\n\s*/g, " ").trim() + sub.map(s => "\n" + listMd(s, depth + 1)).join("");
  }).join("\n");
}
const mdText = s => s.replace(/\u00a0/g, " ").replace(/([*`\\])/g, "\\$1");
function inlineMd(node){
  let s = "";
  for (const n of node.childNodes){
    if (n.nodeType === 3) { s += mdText(n.nodeValue); continue; }
    if (n.nodeType !== 1) continue;
    const t = n.tagName, inner = () => inlineMd(n);
    if (n.matches("sup[data-note],.wx-img")) continue;
    if (t === "B" || t === "STRONG") s += wrap(inner(), "**");
    else if (t === "I" || t === "EM") s += wrap(inner(), "*");
    else if (t === "S" || t === "DEL" || t === "STRIKE") s += wrap(inner(), "~~");
    else if (t === "CODE") s += "`" + n.textContent + "`";
    else if (t === "A" || n.dataset.href){
      const h = n.getAttribute("href") || n.dataset.href, x = inner();
      s += x === h ? h : `[${x}](${h})`;
    }
    else if (t === "IMG") s += `![${n.getAttribute("alt") || ""}](${n.dataset.src || n.getAttribute("src")})`;
    else if (n.classList.contains("miss")) s += `![](${n.dataset.src || ""})`;
    else if (t === "BR") s += "  \n";
    else if (t === "DIV" || t === "P") s += "\n\n" + inner();
    else s += inner();
  }
  return s;
}
function wrap(x, m){   // **加粗** 的空格要放到外面，不然不认
  const a = x.match(/^\s*/)[0], b = x.match(/\s*$/)[0], core = x.trim();
  return core ? a + m + core + m + b : x;
}
function drawDocBody(){
  const b = docRoot()?.querySelector(".doc-body"); if (!b || !DOC) return;
  const top = b.scrollTop;
  b.innerHTML = docBody(); b.scrollTop = top;
  if (DOC.mode === "wx") wxImgTools();
  codeSync();
}

// ================= 工作区（#206） =================
// 同一个对话两种看法：对话 / 工作区（左边是对话工作目录的文件树，中间编辑区，右边还是这个对话）。
// 编辑区就是文档面板（DOC）画在中间：每个标签一个 DOC，切标签时换。手机上没有三栏：对话头部「文件」→ 全屏文件树 → 全屏编辑。
let WS = null;
const WS_TEXT = /\.(txt|text|log|csv|tsv|json|jsonl|ya?ml|toml|ini|cfg|conf|env|py|m?js|cjs|ts|tsx|jsx|vue|svelte|css|scss|less|sh|zsh|bash|go|rs|java|kt|swift|c|h|cc|cpp|hpp|m|rb|php|lua|sql|xml|r|tex|bib|srt|vtt|gitignore)$/i;
const WS_TEXT_NAMES = new Set(["Makefile", "Dockerfile", "LICENSE", "README", ".gitignore", ".env"]);
function wsKind(name){
  if (isImg(name)) return "img";
  if (isVideo(name)) return "video";
  return docKind(name) || (WS_TEXT.test(name || "") || WS_TEXT_NAMES.has(name) ? "text" : "other");
}
const wsName = p => (p || "").split("/").pop();
const wsDir = p => (p || "").slice(0, Math.max(0, (p || "").lastIndexOf("/")));
const wsInside = p => !!(WS && p && (p === WS.root || p.startsWith(WS.root + "/")));
const wsRel = p => p === WS.root ? "" : p.slice(WS.root.length + 1);
const wsEnabled = () => !!(S.global || {}).workspace;   // 设置里打开了工作区才能用（#245）
function wsCan(c){ return !!(wsEnabled() && c && c.ws_root && !c.readonly && !c.mention_of && !c.side_of && !String(c.id).startsWith("x:")); }
function wsSaved(id){ try { return JSON.parse(localStorage.getItem("ccim.ws." + id) || "{}"); } catch { return {}; } }
function wsStore(){
  if (!WS) return;
  try { localStorage.setItem("ccim.ws." + WS.chat, JSON.stringify({on: WS.on, nochat: WS.nochat, tabs: WS.tabs, cur: WS.cur, open: [...WS.open], seen: WS.seen})); } catch {}
}
const wsShown = () => !!(WS && (narrow() ? WS.scr === "file" || WS.scr === "files" : WS.on));
const wsEdShown = () => !!(WS && (narrow() ? WS.scr === "file" : WS.on));

function wsMount(c){
  if (!wsCan(c)) { if (WS && DOC && DOC.ws) DOC = null; WS = null; wsPending = null; wsApply(); return; }
  if (!WS || WS.chat !== c.id) {
    if (WS && DOC && DOC.ws) DOC = null;
    const s = wsSaved(c.id);
    WS = {chat: c.id, machine: ctxMachine, root: c.ws_root, on: !!s.on, nochat: !!s.nochat, scr: null, dirs: {}, open: new Set(s.open || []),
          tabs: (s.tabs || []).filter(p => p.startsWith(c.ws_root + "/")), docs: {}, cur: s.cur || null, flags: {}, writing: new Set(),
          seen: s.seen || {}, ctx: true, renaming: null, busyDirs: new Set()};
    WS.open.add(WS.root);
    if (!WS.tabs.includes(WS.cur)) WS.cur = WS.tabs[0] || null;
  }
  WS.root = c.ws_root; WS.machine = ctxMachine;
  wsFlagsFromLog(c);
  wsApply();
  if (wsShown()) wsShow();
  if (wsPending === c.id) { wsPending = null; setTimeout(() => narrow() ? wsGo("files") : wsSetMode(true)); }
}
// 最近一次改了文件的回答：没打开看过的标出来（「AI 刚改的」）
function wsFlagsFromLog(c){
  const r = [...(c.log || [])].reverse().find(x => x.type === "answer" && (x.changed || []).length);
  WS.flags = {};
  if (!r) return;
  for (const f of r.changed) if (wsInside(f.path) && !((WS.seen[f.path] || 0) >= (r.at || 0))) WS.flags[f.path] = f.new ? "new" : "mod";
}
// iPad 竖屏（#237）：对话栏浮在编辑区上面，默认收起，点按钮滑出来；横屏照旧按用户上次的选择
const wsFloat = () => innerWidth > 760 && innerWidth <= 1000;
const wsNoChat = () => !!WS && (wsFloat() ? !WS.pchat : WS.nochat);
addEventListener("resize", () => { if (WS && WS.on) wsApply(); });
function wsApply(){
  const m = $("#main"), app = document.querySelector(".app");
  const on = !!(WS && WS.on && !narrow());
  m?.classList.toggle("ws", on);
  m?.classList.toggle("ws-nochat", on && wsNoChat());
  m?.classList.toggle("ws-files", !!(WS && narrow() && WS.scr === "files"));
  m?.classList.toggle("ws-file", !!(WS && narrow() && WS.scr === "file"));
  app.classList.toggle("ws-mode", on);
  document.documentElement.classList.toggle("ws-dark", on || !!(WS && narrow() && (WS.scr === "files" || WS.scr === "file")));
  const bb = $("#ws-backbtn"); if (bb) bb.hidden = !on;
  const cb = $("#ws-chatbtn"); if (cb) { cb.hidden = !on; cb.classList.toggle("on", !!WS && !wsNoChat()); cb.title = wsNoChat() ? "显示对话" : "收起对话"; }
  const fb = $("#ws-filesbtn"); if (fb) { const n = WS ? Object.keys(WS.flags).length : 0; fb.innerHTML = ICON.folder + (n ? `<span class="badge">${n}</span>` : ""); }
  drawWsCtx();
}
// 三点菜单里的「打开工作区 / 回到对话」：不是当前打开的对话就先打开它，等工作区准备好再进去
let wsPending = null;
function wsFromMenu(id){
  if (WS && WS.chat === id) return narrow() ? wsGo("files") : wsSetMode(!WS.on);
  const c = rowOf(id); if (!c) return;
  wsPending = id; location.hash = boardHref(c);
}
function wsHead(c){
  if (!wsCan(c)) return "";
  // 工作区是对话的补充（#206 第二轮）：入口在三点菜单里，顶部只在工作区里时放一个「回到对话」
  return `<button class="btn ws-backchat" id="ws-backbtn" hidden onclick="wsSetMode(false)">${ICON.chat}回到对话</button>
    <button class="icon-btn ws-chatbtn" id="ws-chatbtn" hidden aria-label="收起对话" onclick="wsToggleChat()">${ICON.panel}</button>
    <button class="icon-btn ws-filesbtn" id="ws-filesbtn" aria-label="文件" title="文件" onclick="wsGo('files')">${ICON.folder}</button>`;
}
// 切换动效：浏览器支持 View Transitions 就用（对话滑到右边，文件树和编辑区展开），不支持或减弱动态效果时直接切
function wsVt(kind, fn){
  const h = document.documentElement;
  if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(); return; }
  closePop(); document.querySelector(".seltool")?.remove();
  h.dataset.vt = kind;
  const t = document.startViewTransition(fn);
  t.finished.finally(() => { if (h.dataset.vt === kind) delete h.dataset.vt; });
}
function wsSetMode(on){
  if (!WS || WS.on === on) return;
  wsVt(on ? "to-ws" : "to-chat", () => {
    if (!on && DOC && DOC.ws) { WS.docs[DOC.path] = DOC; DOC = null; }
    WS.on = on; wsStore(); wsApply();
    if (on) wsShow();
  });
}
function wsToggleChat(){ if (!WS) return; wsVt("side", () => { if (wsFloat()) WS.pchat = !WS.pchat; else { WS.nochat = !WS.nochat; wsStore(); } wsApply(); }); }
const WS_DEPTH = {chat: 0, files: 1, file: 2};
function wsGo(scr){           // 手机：对话 → 文件树 → 文件
  if (!WS) return;
  const from = WS.scr || "chat"; if (scr === "chat") scr = null;
  if ((scr || "chat") === from) return;
  wsVt(WS_DEPTH[scr || "chat"] > WS_DEPTH[from] ? "push" : "pop", () => {
    if (!scr && DOC && DOC.ws) { WS.docs[DOC.path] = DOC; DOC = null; }
    WS.scr = scr; wsApply();
    if (scr) wsShow();
    if (!scr) { const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight; }
  });
}
async function wsShow(){
  if (!WS) return;
  drawWsTree();
  if (!WS.dirs[WS.root]) await wsLoadOpen();
  if (wsEdShown()) {
    if (DOC && DOC.ws && DOC.path === WS.cur) drawDoc();
    else if (WS.cur) wsActivate(WS.cur);
    else drawWsEditor();
  }
}
async function wsLoad(dir){
  if (!WS) return;
  const ws = WS;
  try {
    const r = await api(`/api/ws/ls?chat=${encodeURIComponent(ws.chat)}&path=${encodeURIComponent(dir)}`, undefined, ws.machine);
    ws.dirs[dir] = r.entries;
  } catch (e) { if (dir === ws.root) ws.err = e.message; delete ws.dirs[dir]; ws.open.delete(dir); }
}
async function wsLoadOpen(){
  if (!WS) return;
  const ws = WS;
  await Promise.all([...ws.open].filter(d => d === ws.root || d.startsWith(ws.root + "/")).map(wsLoad));
  if (WS === ws) drawWsTree();
}
// 文件夹里的东西变了：重新取（只取已经展开的）
let wsReloadT = null;
function wsReload(dirs){
  if (!WS) return;
  for (const d of dirs) WS.busyDirs.add(d);
  clearTimeout(wsReloadT);
  wsReloadT = setTimeout(async () => {
    if (!WS) return;
    const ws = WS, ds = [...ws.busyDirs].filter(d => ws.dirs[d] || ws.open.has(d)); ws.busyDirs.clear();
    await Promise.all(ds.map(wsLoad));
    if (WS === ws) drawWsTree();
  }, 250);
}
function wsExpandTo(p){
  let d = wsDir(p); const add = [];
  while (d && wsInside(d)) { if (!WS.open.has(d)) { WS.open.add(d); add.push(d); } if (d === WS.root) break; d = wsDir(d); }
  return add;
}

// ---- 文件树 ----
// 文件树图标（#237）：文件夹实心，文件按类型上色、折角处标两三个字母
const FT = [
  [/^(py|pyi|ipynb)$/, "#4B8BBE", "PY"], [/^(js|mjs|cjs|jsx)$/, "#D9B43A", "JS"], [/^(ts|tsx)$/, "#3178C6", "TS"],
  [/^(json|jsonl)$/, "#C08A2E", "{}"], [/^(md|markdown|mdx)$/, "#5B8DEF", "MD"], [/^(html|htm|xml|svg|vue)$/, "#E06A3B", "<>"],
  [/^(css|scss|less)$/, "#7E57C2", "#"], [/^(sh|bash|zsh|fish|command)$/, "#5FA05A", "$"], [/^(yml|yaml|toml|ini|cfg|conf|env|plist)$/, "#B8545A", "⚙"],
  [/^(png|jpe?g|gif|webp|heic|bmp|ico)$/, "#A66BC9", "◩"], [/^(mp4|mov|webm|m4v|mp3|wav|m4a)$/, "#D2577F", "▶"],
  [/^(pdf)$/, "#D24B3E", "PDF"], [/^(docx?|pages)$/, "#2F6DB5", "W"], [/^(xlsx?|csv|numbers)$/, "#2E8B57", "X"], [/^(zip|gz|tgz|tar|7z|rar|whl)$/, "#8A8F98", "ZIP"],
  [/^(go)$/, "#3FA7C9", "GO"], [/^(rs)$/, "#C4734B", "RS"], [/^(java|kt)$/, "#C7623A", "J"], [/^(c|h|cpp|hpp|cc|m|swift)$/, "#5C7FB8", "C"],
  [/^(txt|log|lock)$/, "#8A8F98", ""],
];
function wsIcon(e){
  if (e.dir) return `<svg viewBox="0 0 24 24"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5l2 2h9a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5z" fill="currentColor" opacity=".9"/></svg>`;
  const n = e.name || "", ext = n.includes(".") ? n.split(".").pop().toLowerCase() : n.toLowerCase();
  const t = FT.find(([re]) => re.test(ext)) || [null, "#8A8F98", ""];
  const lab = t[2], fs = lab.length >= 3 ? 6 : lab.length === 2 ? 7.5 : 9.5;
  return `<svg viewBox="0 0 24 24"><path d="M5 2.5h9.5L20 8v13.5H5z" fill="${t[1]}" opacity=".18"/><path d="M5 2.5h9.5L20 8v13.5H5z" fill="none" stroke="${t[1]}" stroke-width="1.5" stroke-linejoin="round"/><path d="M14.5 2.5V8H20" fill="none" stroke="${t[1]}" stroke-width="1.5" stroke-linejoin="round"/>${lab ? `<text x="12.5" y="18.2" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif" fill="${t[1]}">${esc(lab)}</text>` : ""}</svg>`;
}
function wsRow(e, depth){
  const p = e.path, on = !e.dir && p === WS.cur;
  if (WS.renaming === p) return `<div class="ws-row" style="--d:${depth}"><span class="chev none">${ICON.chev}</span><span class="ic ft ${e.dir ? "dir" : ""}">${wsIcon(e)}</span>
    <input class="ws-ren" id="ws-ren" value="${esc(e.name)}" onkeydown="wsRenKey(event)" onblur="wsRenDone(this.value)"></div>`;
  const fl = WS.writing.has(p) ? `<span class="ws-writing" title="正在写"></span>` : WS.flags[p] ? `<span class="ws-flag ${WS.flags[p]}">${WS.flags[p] === "new" ? "新" : "改"}</span>` : "";
  return `<button class="ws-row ${on ? "on" : ""}" style="--d:${depth}" data-p="${esc(p)}" data-dir="${e.dir ? 1 : ""}" draggable="true"
      onclick="wsClick(${q(p)},${e.dir ? 1 : 0})" oncontextmenu="wsMenu(event,${q(p)},${e.dir ? 1 : 0})">
    <span class="chev ${e.dir ? (WS.open.has(p) ? "open" : "") : "none"}">${ICON.chev}</span><span class="ic ft ${e.dir ? "dir" : ""}">${wsIcon(e)}</span>
    <span class="nm">${esc(e.name)}</span>${fl}<span class="more" onclick="wsMenu(event,${q(p)},${e.dir ? 1 : 0})">${ICON.more}</span></button>`;
}
function wsWalk(dir, depth){
  const es = WS.dirs[dir]; if (!es) return WS.open.has(dir) ? `<div class="ws-row muted" style="--d:${depth}"><span class="chev none"></span>…</div>` : "";
  let h = "";
  for (const e of es) { h += wsRow(e, depth); if (e.dir && WS.open.has(e.path)) h += wsWalk(e.path, depth + 1); }
  if (!es.length && depth) h += `<div class="ws-row muted empty" style="--d:${depth}"><span class="chev none"></span>空文件夹</div>`;
  return h;
}
function drawWsTree(){
  const el = $("#ws-tree"); if (!el || !WS) return;
  const keep = $("#ws-tscroll")?.scrollTop || 0;
  const changed = Object.keys(WS.flags);
  const recent = changed.length ? `<div class="ws-sec">AI 刚改的 ${changed.length} 个<button onclick="wsClearFlags()">都看过了</button></div>`
    + changed.map(p => `<button class="ws-row ${p === WS.cur ? "on" : ""}" style="--d:0" onclick="wsOpen(${q(p)})"><span class="chev none"></span>
        <span class="ic">${ICON.file}</span><span class="nm">${esc(wsName(p))} <small>${esc(wsDir(wsRel(p)))}</small></span>
        ${WS.writing.has(p) ? `<span class="ws-writing"></span>` : `<span class="ws-flag ${WS.flags[p]}">${WS.flags[p] === "new" ? "新" : "改"}</span>`}</button>`).join("")
    + `<div class="ws-sec">全部文件</div>` : "";
  const writingNew = [...WS.writing].filter(p => !WS.flags[p] && wsInside(p));
  el.innerHTML = `<div class="ws-thead">
      <button class="icon-btn m-only" aria-label="返回" onclick="WS.phoneCtx=false;wsGo('chat')">${ICON.left}</button>
      <span class="root" title="${esc(tilde(WS.root, WS.machine))}">${esc(wsName(WS.root) || WS.root)}</span>
      <button class="icon-btn" aria-label="新建文件" title="新建文件" onclick="wsNew(false)">${ICON.newfile}</button>
      <button class="icon-btn" aria-label="新建文件夹" title="新建文件夹" onclick="wsNew(true)">${ICON.newdir}</button>
      <button class="icon-btn" aria-label="上传" title="上传" onclick="$('#ws-upload').click()">${ICON.upload}</button>
      <input type="file" id="ws-upload" multiple hidden onchange="wsUpload(this.files, wsTargetDir());this.value=''"></div>
    <div class="ws-tscroll" id="ws-tscroll">${WS.err && !WS.dirs[WS.root] ? `<div class="ws-err">${esc(WS.err)}</div>` : ""}${recent}
      ${writingNew.length ? writingNew.map(p => `<div class="ws-row"><span class="chev none"></span><span class="ic">${ICON.file}</span><span class="nm">${esc(wsName(p))}</span><span class="ws-writing"></span></div>`).join("") : ""}
      ${wsWalk(WS.root, 0)}<div class="ws-drop d-only">把文件拖到这里上传</div></div>`;
  $("#ws-tscroll").scrollTop = keep;
  const r = $("#ws-ren"); if (r) { r.focus(); const k = r.value.lastIndexOf("."); r.setSelectionRange(0, k > 0 ? k : r.value.length); }
  wsTreeDnd(el);
}
async function wsClick(p, isDir){
  if (!isDir) return wsOpen(p);
  if (WS.open.has(p)) WS.open.delete(p);
  else { WS.open.add(p); if (!WS.dirs[p]) { drawWsTree(); await wsLoad(p); } }
  wsStore(); drawWsTree();
}
function wsClearFlags(){
  const now = Date.now() / 1000;
  for (const p of Object.keys(WS.flags)) WS.seen[p] = now;
  WS.flags = {}; wsStore(); drawWsTree(); wsApply();
}
const wsTargetDir = () => WS.cur && wsInside(WS.cur) ? wsDir(WS.cur) : WS.root;

// ---- 打开、标签 ----
async function wsOpen(p){
  if (!WS || !wsInside(p)) return openDoc(p);
  if (WS.flags[p]) { WS.seen[p] = Date.now() / 1000; delete WS.flags[p]; wsApply(); }
  const add = wsExpandTo(p);
  if (!WS.tabs.includes(p)) WS.tabs.push(p);
  WS.cur = p; wsStore();
  if (narrow()) { if (WS.scr !== "file") { wsGo("file"); return; } }
  else if (!WS.on) { wsSetMode(true); return; }
  drawWsTree();
  if (add.length) wsReload(add);
  wsActivate(p);
}
async function wsOpenAll(paths){
  paths = paths.filter(wsInside);
  if (!paths.length) return;
  for (const p of paths) if (!WS.tabs.includes(p)) WS.tabs.push(p);
  wsOpen(paths.find(p => wsKind(p) === "md") || paths[0]);
}
function wsActivate(p){
  if (DOC && DOC.ws && DOC.path !== p) WS.docs[DOC.path] = DOC;
  WS.cur = p; wsStore();
  const k = wsKind(wsName(p));
  if (WS.docs[p]) { DOC = WS.docs[p]; drawDoc(); return; }
  if (k === "img" || k === "video" || k === "other") {
    DOC = {chat: WS.chat, machine: WS.machine, path: p, ws: true, mode: "view", draft: "", dirty: false,
           d: {kind: k, name: wsName(p), versions: [], latest: true, v: 0}};
    WS.docs[p] = DOC; drawDoc(); return;
  }
  DOC = null;
  openDoc(p, null, WS.chat, true);
}
async function wsCloseTab(p, e){
  e && e.stopPropagation();
  const d = WS.docs[p] || (DOC && DOC.path === p ? DOC : null);
  if (d && d.dirty) { if (DOC !== d) DOC = d; await docSave(); }
  const i = WS.tabs.indexOf(p);
  WS.tabs = WS.tabs.filter(x => x !== p); delete WS.docs[p];
  if (WS.cur === p) {
    WS.cur = WS.tabs[Math.min(i, WS.tabs.length - 1)] || null;
    if (DOC && DOC.path === p) DOC = null;
    if (WS.cur) wsActivate(WS.cur); else drawWsEditor();
  } else drawDoc();
  wsStore(); drawWsTree(); drawWsCtx();
}
function wsTabs(){
  return `<div class="ws-tabs d-only">${WS.tabs.map(t => `<button class="ws-tab ${t === WS.cur ? "on" : ""}" onclick="wsActivate(${q(t)});drawWsTree()" title="${esc(wsRel(t))}">
    ${esc(wsName(t))}${(WS.docs[t] || {}).dirty || (DOC && DOC.path === t && DOC.dirty) ? `<span class="dot"></span>` : ""}<span class="x" onclick="wsCloseTab(${q(t)},event)">${ICON.x}</span></button>`).join("")}</div>`;
}
function drawWsEditor(){
  const el = $("#ws-ed"); if (!el || !WS) return;
  el.innerHTML = `${wsTabs()}<div class="ws-empty"><h2>从左边选个文件</h2><p>或者在右边让 AI 写一个</p></div>`;
  drawWsCtx();
}
// 编辑区里的文件：自己改的停一下就保存
function wsAutosave(){
  clearTimeout(window._wsSave);
  const d = DOC;
  window._wsSave = setTimeout(() => { if (DOC === d && d.dirty) docSave(true); }, 1200);
}

// ---- 新建、改名、移动、删除、上传 ----
async function wsNew(folder, dir){
  if (!WS) return;
  dir = dir || wsTargetDir();
  try {
    const r = await act(() => api("/api/ws/new", {chat: WS.chat, path: dir, name: folder ? "新建文件夹" : "未命名.md", dir: folder}, WS.machine));
    WS.open.add(dir); await wsLoad(dir);
    WS.renaming = r.path; WS.newPath = folder ? null : r.path;
    if (narrow() && WS.scr !== "files") wsGo("files"); else drawWsTree();
  } catch {}
}
function wsRenKey(e){
  if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  if (e.key === "Escape") { e.preventDefault(); WS.renaming = null; WS.newPath = null; drawWsTree(); }
}
async function wsRenDone(name){
  const p = WS && WS.renaming; if (!p) return;
  WS.renaming = null;
  const open = WS.newPath === p; WS.newPath = null;
  let np = p;
  if (name.trim() && name.trim() !== wsName(p)) {
    try { np = (await act(() => api("/api/ws/rename", {chat: WS.chat, path: p, name: name.trim()}, WS.machine))).path; wsMoved(p, np); }
    catch {}
  }
  await wsLoad(wsDir(np)); drawWsTree();
  if (open) wsOpen(np);
}
// 改名、移动以后：标签、打开着的文件跟着换路径
function wsMoved(from, to){
  const mv = x => x === from ? to : x.startsWith(from + "/") ? to + x.slice(from.length) : x;
  WS.tabs = WS.tabs.map(mv); WS.cur = WS.cur && mv(WS.cur);
  const docs = {}; for (const [k, v] of Object.entries(WS.docs)) { v.path = mv(v.path); docs[mv(k)] = v; } WS.docs = docs;
  if (DOC && DOC.ws) { DOC.path = mv(DOC.path); if (DOC.d) DOC.d.name = wsName(DOC.path); }
  WS.open = new Set([...WS.open].map(mv));
  const fl = {}; for (const [k, v] of Object.entries(WS.flags)) fl[mv(k)] = v; WS.flags = fl;
  wsStore(); if (DOC && DOC.ws) drawDoc();
}
async function wsMove(p, to){
  if (!to || to === wsDir(p) || to === p || to.startsWith(p + "/")) return;
  try {
    const r = await act(() => api("/api/ws/move", {chat: WS.chat, path: p, to}, WS.machine));
    wsMoved(p, r.path); WS.open.add(to);
    await Promise.all([wsLoad(wsDir(p)), wsLoad(to)]); drawWsTree();
    wsToast(`已移到「${wsName(to) || wsName(WS.root)}」`);
  } catch {}
}
async function wsTrash(p){
  const ws = WS;
  try {
    const r = await act(() => api("/api/ws/trash", {chat: ws.chat, path: p}, ws.machine));
    for (const t of ws.tabs.filter(t => t === p || t.startsWith(p + "/"))) { ws.tabs = ws.tabs.filter(x => x !== t); delete ws.docs[t]; if (DOC && DOC.path === t) DOC = null; }
    if (ws.cur && (ws.cur === p || ws.cur.startsWith(p + "/"))) { ws.cur = ws.tabs[0] || null; ws.cur ? wsActivate(ws.cur) : drawWsEditor(); }
    delete ws.flags[p]; wsStore();
    await wsLoad(wsDir(p)); drawWsTree();
    wsToast(`已把「${wsName(p)}」移到废纸篓`, async () => {
      try { await act(() => api("/api/ws/restore", {chat: ws.chat, token: r.token, path: r.path}, ws.machine)); if (WS === ws) { await wsLoad(wsDir(p)); drawWsTree(); } } catch {}
    });
  } catch {}
}
async function wsUpload(list, dir){
  if (!WS || !list || !list.length) return;
  const ws = WS; let n = 0;
  for (const file of list) {
    try {
      const r = await fetch("/api/upload", {method: "POST", headers: {"X-CCIM": "1", "X-Name": encodeURIComponent(file.name), ...remoteHeader(ws.machine)}, body: file});
      const d = await r.json(); if (!r.ok) throw new Error(d.error || "上传失败");
      await api("/api/ws/put", {chat: ws.chat, key: d.key, path: dir, name: file.name}, ws.machine); n++;
    } catch (e) { toast(`${file.name} 没传上：${e.message}`); }
  }
  if (n && WS === ws) { ws.open.add(dir); await wsLoad(dir); drawWsTree(); toast(`已上传 ${n} 个文件`); }
}
function wsMention(p){
  const input = $("#input"); if (!input) return;
  input.value += (input.value && !/\s$/.test(input.value) ? " " : "") + `「${wsRel(p)}」`;
  if (narrow()) wsGo("chat"); else if (wsNoChat()) wsToggleChat();
  drawComposerState(); input.focus();
}
function wsMenu(e, p, isDir){
  e.preventDefault(); e.stopPropagation();
  const at = e.type === "contextmenu"
    ? {stopPropagation(){}, currentTarget: {getBoundingClientRect: () => ({left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY, width: 0})}}
    : e;
  const b = (js, label, cls = "") => `<button class="${cls}" onclick="closePop();${esc(js)}">${label}</button>`;
  pop(at, [
    isDir ? b(`wsNew(false,${JSON.stringify(p)})`, "新建文件") + b(`wsNew(true,${JSON.stringify(p)})`, "新建文件夹") : "",
    b(`WS.renaming=${JSON.stringify(p)};drawWsTree()`, "重命名"),
    b(`wsMention(${JSON.stringify(p)})`, "在对话里提到它"),
    isDir ? "" : b(`wsDownload(${JSON.stringify(p)})`, "下载"),
    b(`wsTrash(${JSON.stringify(p)})`, "移到废纸篓", "danger"),
  ].join(""), true);
}
function wsDownload(p){
  const a = document.createElement("a");
  a.href = fileUrl(WS.chat, p) + (isRemote(WS.machine) ? `&machine=${encodeURIComponent(WS.machine)}` : ""); a.download = wsName(p);
  document.body.append(a); a.click(); a.remove();
}
function wsTreeDnd(el){
  let dragP = null;
  el.ondragstart = e => { const r = e.target.closest?.(".ws-row[data-p]"); if (r) { dragP = r.dataset.p; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", wsRel(dragP)); } };
  el.ondragover = e => {
    e.preventDefault();
    el.querySelectorAll(".ws-row.drop").forEach(x => x.classList.remove("drop"));
    const r = e.target.closest?.('.ws-row[data-dir="1"]');
    if (dragP) { if (r && r.dataset.p !== dragP && !r.dataset.p.startsWith(dragP + "/")) r.classList.add("drop"); }
    else { el.classList.add("dragover"); if (r) r.classList.add("drop"); }
  };
  el.ondragleave = e => { if (!el.contains(e.relatedTarget)) { el.classList.remove("dragover"); el.querySelectorAll(".ws-row.drop").forEach(x => x.classList.remove("drop")); } };
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove("dragover");
    const r = e.target.closest?.('.ws-row[data-dir="1"]'), to = r ? r.dataset.p : WS.root;
    el.querySelectorAll(".ws-row.drop").forEach(x => x.classList.remove("drop"));
    if (dragP) { const p = dragP; dragP = null; wsMove(p, to); return; }
    if (e.dataTransfer.files.length) wsUpload(e.dataTransfer.files, to);
  };
  el.ondragend = () => { dragP = null; };
}
function wsToast(text, undo){
  document.querySelector(".toast.ws-t")?.remove();
  const t = document.createElement("div"); t.className = "toast ws-t";
  t.innerHTML = `<span>${esc(text)}</span>${undo ? `<button>撤销</button>` : ""}`;
  document.body.append(t);
  if (undo) t.querySelector("button").onclick = () => { t.remove(); undo(); };
  setTimeout(() => t.remove(), 5000);
}

// ---- 输入框：带上正在看的文件 ----
function drawWsCtx(){
  const el = $("#ws-ctx"); if (!el) return;
  const p = wsCtxFile();
  el.innerHTML = p ? `<span class="ws-ctxchip">${ICON.file}<span class="t">正在看 ${esc(wsName(p))}</span><button aria-label="不带上这个文件" onclick="WS.ctx=false;drawWsCtx()">${ICON.x}</button></span>` : "";
}
// 手机上从文件页点「问 AI」回到对话时也带上（phoneCtx）
const wsCtxFile = () => WS && (wsShown() || narrow() && WS.phoneCtx) && WS.ctx && WS.cur && wsInside(WS.cur) ? WS.cur : null;

// ---- AI 干活时：正在写的文件实时出现，改完标出来 ----
function wsProgress(ev){
  if (!WS || ev.chat !== WS.chat) return;
  const was = WS.writing;
  WS.writing = new Set(ev.state === "working" ? (ev.writing || []).filter(wsInside) : []);
  const dirs = new Set();
  for (const p of ev.changed || []) if (wsInside(p) && !WS.flags[p]) { WS.flags[p] = "mod"; dirs.add(wsDir(p)); for (const d of wsExpandTo(p)) dirs.add(d); }
  for (const p of WS.writing) dirs.add(wsDir(p));
  const done = [...was].filter(p => !WS.writing.has(p));
  for (const p of done) dirs.add(wsDir(p));
  if (dirs.size) wsReload([...dirs]);
  else if (was.size !== WS.writing.size) drawWsTree();
  for (const p of done) wsRefreshDoc(p);
  wsApply();
}
function wsAnswer(rec){
  if (!WS || !(rec.changed || []).length) return;
  const dirs = new Set();
  for (const f of rec.changed) if (wsInside(f.path)) {
    WS.flags[f.path] = f.new ? "new" : "mod";
    dirs.add(wsDir(f.path)); for (const d of wsExpandTo(f.path)) dirs.add(d);
    wsRefreshDoc(f.path);
  }
  WS.writing = new Set();
  if (WS.cur && WS.flags[WS.cur] && wsEdShown()) { WS.seen[WS.cur] = Date.now() / 1000; delete WS.flags[WS.cur]; }
  wsStore(); wsReload([...dirs]); wsApply();
}
// AI 改了打开着的文件：没改过的直接换成新的；自己正在改的先不动，提示一下
function wsRefreshDoc(p){
  const d = DOC && DOC.path === p ? DOC : WS.docs[p];
  if (!d || !d.d || ["img", "video", "other"].includes(d.d.kind)) return;
  if (d.dirty) { if (DOC === d) toast("AI 也改了这个文件，你的改动保存时会提示"); return; }
  if (DOC === d && wsEdShown()) { DOC = null; delete WS.docs[p]; openDoc(p, null, WS.chat, true); }
  else delete WS.docs[p];
}
// 回答下面：这一轮改了哪些文件，点一下在工作区打开
function changesHtml(r){
  if (!WS || !(r.changed || []).length) return "";
  const fs = r.changed.filter(f => wsInside(f.path)); if (!fs.length) return "";
  return `<div class="ws-changes"><div class="h">${ICON.edit}<span class="grow">改了 ${fs.length} 个文件</span><button onclick='wsOpenAll(${esc(JSON.stringify(fs.map(f => f.path)))})'>${narrow() ? "查看" : "在工作区查看"}</button></div>
    ${fs.slice(0, 8).map(f => `<button class="chg" onclick="wsOpen(${q(f.path)})">${ICON.file}<span class="p">${esc(wsName(f.path))} <i>${esc(wsDir(wsRel(f.path)))}</i></span><span class="ws-flag ${f.new ? "new" : "mod"}">${f.new ? "新建" : "改了"}</span>${ICON.chev}</button>`).join("")}
    ${fs.length > 8 ? `<div class="more">还有 ${fs.length - 8} 个</div>` : ""}</div>`;
}
// 编辑区里选中一段：让 AI 改 / 问一下（带上是哪个文件的哪段）
function wsSelTool(sel){
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const body = node && node.closest("#ws-ed .doc-body");
  if (!body || !body.contains(sel.focusNode) || !DOC || !DOC.ws) return false;
  const text = sel.toString().trim();
  if (text.length < 2) return true;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  const t = document.createElement("div"); t.className = "seltool";
  t.innerHTML = `<button>${ICON.edit}让 AI 改</button><button>${ICON.quote}问一下</button>`;
  t.style.left = Math.max(8, rect.left) + "px"; t.style.top = Math.max(8, rect.top - 40) + "px";
  t.addEventListener("mousedown", e => e.preventDefault());
  const [ed, ask] = t.querySelectorAll("button");
  const go = how => {
    t.remove(); getSelection().removeAllRanges();
    const p = DOC.path;
    if (narrow()) { WS.phoneCtx = true; wsGo("chat"); } else if (wsNoChat()) wsToggleChat();
    setTimeout(() => { addQuote(`${wsRel(p)}：\n${text}`); const i = $("#input"); if (i) i.placeholder = how === "edit" ? "要怎么改？比如：说得更口语一点" : "想问什么？"; }, 30);
  };
  ed.onclick = () => go("edit"); ask.onclick = () => go("ask");
  document.body.append(t);
  return true;
}

// ================= 对话框 =================
function dialog(title, body, foot){
  closeDialog();
  const s = document.createElement("div"); s.className = "scrim";
  s.onclick = e => { if (e.target === s) closeDialog(); };
  s.innerHTML = `<div class="dialog" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" aria-label="关闭" onclick="closeDialog()">${ICON.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  document.body.append(s);
}
function closeDialog(){ document.querySelector(".scrim:not(.dirpick)")?.remove(); }
function confirmBox(title, text, okLabel){
  return new Promise(res => {
    dialog(title, `<p>${esc(text)}</p>`, `<button class="btn" id="cb-no">取消</button><button class="btn danger" id="cb-ok">${esc(okLabel)}</button>`);
    $("#cb-no").onclick = () => { closeDialog(); res(false); };
    $("#cb-ok").onclick = () => { closeDialog(); res(true); };
    $("#cb-ok").focus();
  });
}

function toggleList(on){
  document.querySelector(".app").classList.toggle("list-off", !on);
  if (on && document.querySelector(".list-tip")) closeListTip();   // 找到了，不用再提示
  else listTip();
  if (narrow()) return;                  // 窄屏的抽屉开关不记，宽屏时还按原来的习惯
  try { localStorage.setItem("ccim.listOff", on ? "" : "1"); } catch {}
}

// 列表和内容之间的分隔线：拖动改宽度，记住；双击恢复默认（#32）
(function(){
  const app = document.querySelector(".app"), rz = $("#resizer");
  try { const w = +localStorage.getItem("ccim.listW"); if (w) app.style.setProperty("--list-w", w + "px"); } catch {}
  let start = null;
  rz.addEventListener("pointerdown", e => {
    e.preventDefault();                      // 不然浏览器开始选文字，拖动就断了
    start = {x: e.clientX, w: $("#list").getBoundingClientRect().width};
    rz.classList.add("drag"); document.body.classList.add("resizing");
  });
  addEventListener("pointermove", e => {
    if (!start) return;
    const w = Math.round(Math.min(Math.max(start.w + e.clientX - start.x, 200), Math.min(620, innerWidth - 420)));
    app.style.setProperty("--list-w", w + "px");
  });
  const end = () => {
    if (!start) return;
    start = null; rz.classList.remove("drag"); document.body.classList.remove("resizing");
    try { localStorage.setItem("ccim.listW", Math.round($("#list").getBoundingClientRect().width)); } catch {}
    drawToc && drawToc();
  };
  addEventListener("pointerup", end); addEventListener("pointercancel", end);
  rz.addEventListener("dblclick", () => { app.style.removeProperty("--list-w"); try { localStorage.removeItem("ccim.listW"); } catch {} });
})();
// iPad、手机：输入法收起后 Safari 有时不把页面滚回去，上半截卡着（#56）。输入框失焦、可视区域变回原高时滚回顶部。
// 弹出输入法时 Safari 不只滚整页，还会把输入框外层 overflow:hidden 的容器（布局用的，用户自己滚不动）也滚上去，
// 只复位整页的话换个页面结构就又卡住（#237 工作区）。所以把这类被滚过的容器一起复位，所有页面通用
(function(){
  const stuck = () => {
    const out = [];
    for (const el of document.querySelectorAll("body *")) {
      if (!el.scrollTop && !el.scrollLeft) continue;
      const o = getComputedStyle(el);
      if (/hidden|clip/.test(o.overflowY + o.overflowX) && !/auto|scroll/.test(o.overflowY)) out.push(el);
    }
    return out;
  };
  const reset = () => {
    if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = document.body.scrollTop = 0; }
    for (const el of stuck()) { el.scrollTop = 0; el.scrollLeft = 0; }
  };
  document.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("textarea,input")) setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("textarea,input")) reset(); }, 120); });
  const vv = window.visualViewport;
  if (vv) { let full = vv.height; vv.addEventListener("resize", () => { if (vv.height >= full - 1) { full = vv.height; reset(); } else if (vv.height > full) full = vv.height; }); }
})();
let wasNarrow = narrow(), wasPortrait = portrait();
addEventListener("resize", () => {             // 跨过手机宽度：变窄按当前页面一屏一个，变宽恢复原来的折叠习惯
  const app = document.querySelector(".app");
  if (narrow() !== wasNarrow){
    wasNarrow = narrow(); wasPortrait = portrait();
    app.classList.toggle("phone-main", wasNarrow && phoneMain());
    let off = false;
    if (!wasNarrow) { try { off = !!localStorage.getItem("ccim.listOff"); } catch {} }
    app.classList.toggle("list-off", off);
    return;
  }
  if (wasNarrow || portrait() === wasPortrait) return;
  // iPad 转屏（#220）：竖屏打开了对话就收起列表；转到横屏恢复用户自己的折叠习惯，不让竖屏的自动收起留下来
  wasPortrait = portrait();
  let off = false;
  if (wasPortrait) off = !!current.id && current.id !== "new";
  else { try { off = !!localStorage.getItem("ccim.listOff"); } catch {} }
  app.classList.toggle("list-off", off);
  if (WS && $("#ws-tree")) { if (!wasNarrow) WS.scr = null; wsApply(); if (wsShown()) wsShow(); }
});
addEventListener("resize", () => listTip());

// ================= 启动 =================
(async () => {
  watchListScroll();
  try { if (localStorage.getItem("ccim.listOff") && !narrow()) document.querySelector(".app").classList.add("list-off"); } catch {}
  try { await loadState(); } catch (e) { $("#main").innerHTML = `<div class="empty"><h2>连不上 ccim</h2><p>${esc(e.message)}</p></div>`; return; }
  if (!EMBED) {                          // 右下角助理里嵌着的对话页：推送由外面的页面转过来（#294）
    connectEvents();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshSoon(); });   // 切回前台：后台时可能漏了推送
  }
  if (!location.hash) history.replaceState(null, "", "#/chats/new");
  route();
  if (EMBED) window.pkReady = true;
  perfMark("load", S.hub ? "打开网页（经总控）" : "打开网页", performance.now());
})();
</script>
