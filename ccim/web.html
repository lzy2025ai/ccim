<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ccim">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>ccim</title>
<style>
:root{
  --paper:#F1F2EE; --panel:#FFFFFF; --sunk:#E8EAE5; --line:#DCDFD8; --line-strong:#C9CDC4;
  --ink:#1D222B; --ink-2:#3A404A; --muted:#6C7169; --faint:#9A9F97;
  --qing:#2B4C6F; --qing-soft:#E3EAF1;
  --lu:#3F7A5E; --zhe:#9A5B34; --huang:#B8902A; --zhu:#B5402F; --dai:#4A4F6B;
  --ok:#3F7A5E; --warn:#B8902A; --bad:#B5402F;
  --song:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:76px var(--list-w,300px) 1fr;height:100vh;overflow:hidden;position:relative;--rail-w:76px}
.resizer{position:absolute;top:0;bottom:0;left:calc(var(--rail-w) + var(--list-w,300px) - 4px);width:8px;cursor:col-resize;z-index:15;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
.resizer:hover::after,.resizer.drag::after{background:var(--qing)}
.app.list-off .resizer,.app.cards .resizer{display:none}
body.resizing{cursor:col-resize;user-select:none}
.topbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .2s}
.topbar.on{opacity:1}
.topbar::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--qing);animation:topbar 1s ease-in-out infinite}
@keyframes topbar{to{left:100%}}
button.pending,.btn.pending{opacity:.6;pointer-events:none;cursor:progress}
.msg.me.sending .bubble{opacity:.65}
body{overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line)}
.brand{font:700 15px/1 var(--song);letter-spacing:.5px;margin-bottom:18px;color:var(--ink)}
.rail a{width:60px;padding:9px 0 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:12px}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--panel);color:var(--qing);box-shadow:0 0 0 1px var(--line)}
.rail .spacer{flex:1}

.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.list-head h1{font:600 19px/1.2 var(--song);margin:0}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;padding:0 8px 16px}
.group{font-size:12px;color:var(--faint);padding:12px 10px 4px}
.item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:flex-start;width:100%;text-align:left}
.item:hover{background:var(--sunk)}
.item.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.item .t{flex:1;min-width:0}
.item .title,.item .sub{display:block}
.item .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{font-size:12px;color:var(--faint);white-space:nowrap;flex:none;min-width:52px;text-align:right}   /* 宽度固定，前面的来源标签才对得齐 */

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}

/* ---------- 印章 ---------- */
.seal{--c:var(--qing);flex:none;width:34px;height:34px;border-radius:7px;background:var(--c);color:#fff;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;padding:3px;
  font:700 12px/1 var(--song);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.seal.one{grid-template-columns:1fr;grid-template-rows:1fr;font-size:16px}
.seal span{display:block}
.seal.vert{grid-template-columns:1fr;gap:1px}
.seal.lg{width:64px;height:64px;font-size:22px;border-radius:12px;padding:6px}
.seal.lg.one{font-size:30px}
.seal.sm{width:26px;height:26px;font-size:10px;border-radius:6px;padding:2px}
.seal.sm.one{font-size:13px}
.seal.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.seal.picture{padding:0;box-shadow:none}
.seal.picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.seal .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--faint)}
.seal .dot.on{background:var(--ok)} .seal .dot.busy{background:var(--huang)}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--qing);border-color:var(--qing);color:#fff}
.btn.primary:hover{background:#223d5a}
.btn.danger{color:var(--bad);border-color:#E3C3BD}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn svg{width:15px;height:15px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.feishu{background:#E4ECF7;color:#2F5A93} .tag.weixin{background:#E3F1E7;color:#2E6E45} .tag.term{background:#ECE9E3;color:#5E5547}
.tag.web{background:var(--qing-soft);color:var(--qing)}
.path{font:12px/1.4 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.on i{background:var(--ok)} .status.busy i{background:var(--huang)} .status.err i{background:var(--bad)}
.status.busy{color:#7A6216}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:380px;padding:40px 20px}
.empty h2{font:600 22px/1.3 var(--song);color:var(--ink);margin:0 0 8px}

/* ---------- 对话 ---------- */
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
.chat-head .name{font:600 16px/1.3 var(--song)}
.chat-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.chat-head .grow{flex:1;min-width:0}
.notice{margin:12px 22px 0;padding:9px 12px;border-radius:8px;background:#F4F1E6;color:#6B5A27;font-size:13px}
.notice.warn{background:#FBE9E4;color:#9A3412}
.thread{flex:1;overflow:auto;padding:22px 0 10px}
.chat-mid{flex:1;display:flex;min-height:0}
.chat-mid .thread{min-width:0}
.toc{width:210px;flex:none;border-left:1px solid var(--line);padding:16px 12px;overflow:auto}
.toc h3{font-size:12px;color:var(--faint);font-weight:500;margin:0 0 8px 4px}
.toc ol{list-style:none;margin:0;padding:0;border-left:1.5px solid var(--line)}
.toc li button{display:block;width:100%;text-align:left;padding:5px 8px 5px 12px;margin-left:-1.5px;border-left:1.5px solid transparent;font-size:13px;color:var(--ink-2);line-height:1.4}
.toc li button:hover{color:var(--ink)}
.toc li button .d{display:block;font-size:11.5px;color:var(--faint)}
.toc li button.on{border-left-color:var(--qing);color:var(--qing);font-weight:500}
.chap{max-width:760px;margin:0 auto 6px;padding:0 22px;scroll-margin-top:14px}
.chap button{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--qing);background:var(--qing-soft);padding:2px 9px 2px 7px;border-radius:6px}
.chap svg{width:13px;height:13px}
.chap.me{text-align:right}
.when.left{color:var(--warn)}
.rtabs{display:inline-flex;gap:2px;margin-left:10px;background:var(--sunk);border-radius:8px;padding:2px}
.rtabs button{padding:2px 10px;border-radius:6px;font-size:12.5px;font-weight:400;color:var(--muted)}
.rtabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chaticon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ic);background:color-mix(in srgb, var(--ic) 12%, var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--ic) 28%, transparent)}
.chaticon svg{width:20px;height:20px}
.chaticon.sm{width:24px;height:24px;border-radius:6px}
.chaticon.sm svg{width:15px;height:15px}
.chaticon.lg{width:44px;height:44px;border-radius:11px}
.chaticon.lg svg{width:26px;height:26px}
.item:not(.today) .title{color:var(--ink-2)}
.item:not(.today):not(.new) .title{font-weight:400}
.item.today .title{color:var(--ink)}
.item.today .when{color:var(--qing);font-weight:500}
.has-badge{position:relative}
.nbadge{position:absolute;top:4px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--zhu);color:#fff;font-size:10.5px;line-height:16px;text-align:center}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--zhu);margin-right:6px;vertical-align:2px;flex:none}
.item.new .title{font-weight:700;color:var(--ink)}
/* 刚回答完、还没看（#54）：像邮件的未读，标题加粗 + 小圆点，第二行前面一个字的提示，不加底色和色条 */
.item.new .sub{color:var(--ink-2)}
.newtag{color:var(--qing);font-weight:600;margin-right:6px}
.newtag.ask{color:#8A6A12}
.newtag.err{color:var(--bad)}
.brow.fresh .btitle{font-weight:700}
/* 点了「知道了」、还没打开看过：最近在跟里比别的稍重一点（#65） */
.udot.soft{background:none;box-shadow:inset 0 0 0 1.5px var(--qing);margin-right:0}
.brow.quiet.unread .btitle{font-weight:600;color:var(--ink)}
/* 面板里直接回复 */
.bitem{margin-bottom:8px}
.bitem .brow{margin-bottom:0}
.breply{padding:8px 0 4px}
.breply textarea{resize:vertical;min-height:56px;display:block;border-radius:12px;padding:10px 12px}
.breply .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
/* 等你处理：玻璃卡片。后面垫一层柔和的色块，卡片半透明 + 背景模糊 + 顶部高光 + 投影（#54） */
.glass-bed{position:relative;isolation:isolate;padding:2px 0}
.glass-bed::before{content:"";position:absolute;z-index:-1;inset:-10px -6px;border-radius:24px;pointer-events:none;
  background:radial-gradient(40% 70% at 12% 30%,color-mix(in srgb,var(--qing) 36%,transparent),transparent 70%),
             radial-gradient(35% 80% at 85% 70%,color-mix(in srgb,var(--zhu) 24%,transparent),transparent 70%),
             radial-gradient(30% 60% at 55% 10%,color-mix(in srgb,var(--huang) 28%,transparent),transparent 70%);filter:blur(14px)}
.glass-bed .brow{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  border:1px solid rgba(255,255,255,.75);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(29,34,43,.04),0 10px 28px -12px rgba(43,76,111,.35),0 2px 6px rgba(29,34,43,.06);
  transition:transform .18s ease,box-shadow .18s ease}
.glass-bed .brow:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(29,34,43,.04),0 16px 34px -12px rgba(43,76,111,.42),0 3px 8px rgba(29,34,43,.08)}
@media (prefers-reduced-motion:reduce){.glass-bed .brow,.glass-bed .brow:hover{transition:none;transform:none}}
.brow.fresh .bprog{color:var(--ink)}
.brow.work,.item.work{position:relative;border-color:transparent}
.ants{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ants rect{x:.75px;y:.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:12px;ry:12px;fill:none;stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 5;animation:ants 1s linear infinite}
.item.work .ants rect{rx:10px;ry:10px;stroke-width:1.2;stroke-dasharray:5 4}
@keyframes ants{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.ants rect{animation:none}}
.bagent{font-weight:500;color:var(--ink-2);white-space:nowrap;flex:none}
.bagent::after{content:"·";color:var(--faint);margin-left:8px;font-weight:400}
.wait{display:inline-flex;align-items:center;gap:6px;color:var(--zhu);font-weight:500}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--zhu)}
.board{overflow:auto;height:100%;background:var(--panel)}
.bhead{padding:24px 36px 4px}
.bhead h1{font:600 24px/1.2 var(--song);margin:0}
.bstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 36px 4px;max-width:1240px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column}
.stat b{font:600 24px/1.2 var(--song)}
.stat span{font-size:12.5px;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding:6px 36px 48px;max-width:1240px}
.bsec{margin-top:18px}
.bsec h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 8px}
.bsec h2 i{width:7px;height:7px;border-radius:50%}
.bsec h2 .n{font-weight:400;color:var(--faint)}
.bempty{color:var(--faint);font-size:13px;margin:4px 0 0}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:inherit}
.brow:hover{border-color:var(--line-strong)}
.brow.quiet{border-color:transparent;padding:8px 14px;margin-bottom:2px}
.brow.quiet:hover{background:var(--paper)}
.bmain{min-width:0;display:flex;flex-direction:column}
.btop{display:flex;align-items:center;gap:8px;min-width:0}
.btitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.quiet .btitle{font-weight:500}
.bwho{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bprog{color:var(--ink-2);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;white-space:nowrap}
.reason{font-size:11.5px;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:none}
.reason.done{background:var(--qing-soft);color:var(--qing)} .reason.ask{background:#F6ECD3;color:#8A6A12} .reason.err{background:#F6DEDA;color:var(--bad)}
.heat{position:relative;padding-top:16px;overflow-x:auto}
.hmonths{position:absolute;top:0;left:0;height:14px;font-size:11px;color:var(--faint)}
.hmonths span{position:absolute;white-space:nowrap}
.hgrid{display:flex;gap:2px}
.hcol{display:flex;flex-direction:column;gap:2px}
.heat i{width:10px;height:10px;border-radius:2px;display:block}
.heat .l0{background:var(--sunk)} .heat .l1{background:#C7D5E4} .heat .l2{background:#8EA9C6} .heat .l3{background:#56789E} .heat .l4{background:var(--qing)}
.hfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:8px;gap:8px;flex-wrap:wrap}
.hlegend{display:inline-flex;align-items:center;gap:3px}
.hlegend i{display:inline-block}
.arow{display:grid;grid-template-columns:auto 90px 1fr auto;gap:8px;align-items:center;padding:6px 4px;text-decoration:none;color:inherit;font-size:13px;border-radius:8px}
.arow:hover{background:var(--paper)}
.an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.abar i{display:block;height:100%;background:var(--qing);border-radius:3px}
.acnt{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:1100px){.bgrid{grid-template-columns:1fr}.bstats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.bhead,.bstats,.bgrid{padding-left:14px;padding-right:14px}.brow{grid-template-columns:auto 1fr}.bmeta{grid-column:2;justify-content:space-between}}
.upg{font-size:12.5px;color:var(--muted);margin-right:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.upg.new{color:var(--warn)} .upg.ok{color:var(--ok)} .upg.err{color:var(--bad)}
.mem .btn{margin-right:12px}
.kbmark{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.kbmark svg{width:16px;height:16px}
.ov-sub{padding:0 32px 12px;min-height:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sync.part{color:var(--muted)} .sync.part i{background:var(--faint)}
.item.entry .sub2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--muted)}
.kb-read{max-width:820px;margin:0 auto;padding:26px 32px 40px;overflow:auto;height:100%}
.kb-top{display:flex;align-items:center;gap:10px}
.kb-top h2{font:600 20px/1.35 var(--song);margin:0;min-width:0}
.kb-top .grow{flex:1}
.kb-read .src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin:6px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.kb-read .src a{color:var(--qing);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.kb-read .src svg{width:13px;height:13px}
.kb-read .gone{text-decoration:line-through;color:var(--faint)}
.kb-hits{padding:0 0 32px;display:grid;gap:8px;max-width:900px}
.kb-hit{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit}
.kb-hit b{margin-right:8px} .kb-hit p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.kbrow{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.kbrow:empty{display:none}
.kbm{display:inline-flex;align-items:center;gap:5px;padding:2px 6px 2px 8px;border-radius:7px;background:var(--qing-soft);color:var(--qing);font-size:12.5px}
.kbm svg{width:13px;height:13px}
.kbm button{display:inline-flex;opacity:.6;padding:2px}
.kbm button:hover{opacity:1}
.wchip.kbm{background:var(--qing-soft);border-color:#C8D6E6;color:var(--qing)}
.wchip.add{border-style:dashed;color:var(--muted)}
.seltool{position:fixed;z-index:25;display:flex;gap:2px;background:var(--ink);color:#fff;border-radius:8px;padding:3px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.seltool button{padding:4px 9px;border-radius:6px;display:inline-flex;gap:5px;align-items:center;color:#fff}
.seltool button:hover{background:rgba(255,255,255,.14)}
.seltool svg{width:14px;height:14px}
.pick-list{display:grid;gap:6px}
.pick-list .pick{width:100%}
.anc{display:block;height:0;scroll-margin-top:12px}
.show-more{display:block;margin:0 auto 18px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.show-more:hover{color:var(--ink);border-color:var(--line-strong)}
.msg.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--qing-soft)}100%{background:transparent}}
.chat-head .icon-btn.on{background:var(--qing-soft);color:var(--qing)}
.msg{max-width:760px;margin:0 auto 22px;padding:0 22px}
.msg.me{display:flex;justify-content:flex-end}
.msg.me>div{max-width:80%;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--sunk);padding:9px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg:not(.me)>.bubble{display:inline-block;max-width:80%;margin-top:6px;border-radius:14px 14px 14px 4px}
.msg-acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity .15s}
.msg:hover .msg-acts,.msg:focus-within .msg-acts{opacity:1}
@media (hover:none){.msg-acts{opacity:1}}
.msg-acts button{display:flex;align-items:center;gap:4px;height:26px;padding:0 7px;border-radius:7px;font-size:12px;color:var(--muted)}
.msg-acts button:hover{background:var(--sunk);color:var(--ink)}
.msg-acts svg{width:14px;height:14px}
/* 分叉出来的对话：从上面那个对话的印章下面引一条线，每个分支一个拐角，最后一个到拐角为止 */
.kids{margin:-2px 0 2px 26px}
.kids>.node{position:relative;padding-left:16px}
.kids>.node::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line-strong)}
.kids>.node:last-child::before{display:none}
.kids>.node::after{content:"";position:absolute;left:0;top:0;width:11px;height:17px;border-left:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);border-bottom-left-radius:7px}
.kids>.node:first-child::before{top:-8px}
.kids>.node:first-child::after{top:-8px;height:25px}   /* 第一条接到印章底下 */
.kids .kids{margin-left:10px}
.item.child{padding:6px 10px;align-items:center}
.item.child .title{font-weight:400;font-size:13.5px}
.item{position:relative}
.item .more{display:none;flex:none;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;color:var(--muted);margin:-2px -4px -2px 0}
.item .more svg{width:15px;height:15px}
.item .more:hover{background:var(--sunk);color:var(--ink)}
.item:hover .more,.item.on .more{display:inline-flex}
@media (hover:hover){.item:hover .more,.item.on .more{margin-left:32px}}   /* 顶替时间那一格（52px），标签不跳 */
.item:hover .when,.item.on .when{display:none}
.item .t .mk,.item .title .mk{display:inline-flex;vertical-align:-2px;margin-right:5px}
.item .t{display:flex;align-items:center;min-width:0}
.item:not(.child) .t{display:block}
.item .mk svg{width:13px;height:13px}
.item .mk.dot{width:8px;height:8px;border-radius:50%;vertical-align:1px;flex:none}
.item.child .t .title{min-width:0}
.arch-toggle{display:flex;align-items:center;gap:4px;width:100%;text-align:left}
.arch-toggle .chev{transition:transform .15s}
.arch-toggle.open .chev{transform:rotate(90deg)}
.pop .marks{display:flex;gap:4px;padding:2px 6px}
.pop .marks button{width:30px;height:30px;padding:0;justify-content:center;border-radius:7px}
.pop .marks button.on{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.pop .marks .sw i{display:block;width:14px;height:14px;border-radius:50%}
.pop button.danger{color:var(--bad)}
.quote-box{border-left:3px solid var(--line-strong);padding:4px 10px;color:var(--ink-2);margin:0 0 12px;background:var(--paper);border-radius:0 6px 6px 0;white-space:pre-wrap;max-height:120px;overflow:auto}
.checkrow{display:flex;gap:9px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left}
.checkrow .cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.checkrow .cb svg{width:12px;height:12px}
.checkrow .files-list{display:block;font:12px/1.5 var(--mono);color:var(--muted);margin-top:4px;word-break:break-all}
.checkrow .cb{align-self:flex-start;margin-top:2px}
.checkrow[aria-checked=true] .cb{background:var(--qing);border-color:var(--qing);color:#fff}
@media (hover:none){.item .more{display:inline-flex}.item:hover .when,.item.on .when{display:inline}}
.msg.wide{max-width:1180px}
/* 新对话：在哪台电脑、哪个目录干活，放在输入框上面（名字、路径再长也不挤输入框下面那一行） */
.where-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.wchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;color:var(--ink-2)}
.wchip:hover{border-color:var(--line-strong);color:var(--ink)}
.wchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wchip span.path{font:12.5px var(--mono);color:inherit}
.wchip svg{width:14px;height:14px;flex:none}
/* 群聊 */
#main{position:relative}
#main.with-panel .thread,#main.with-panel .composer,#main.with-panel .notice{margin-right:300px}
.gpanel{position:absolute;right:0;top:var(--head-h,65px);bottom:0;width:300px;border-left:1px solid var(--line);background:var(--panel);padding:16px 18px;overflow:auto;z-index:2}
.gpanel .gp-top{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 10px 0}
.gpanel .gp-top b{font:600 15px var(--song)}
.chat-head .btn.on{border-color:var(--ink-2)}
.gpanel h3{font:600 14px var(--song);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
.gpanel h3 .link{font:400 12.5px var(--sans)}
.gdesc{font-size:13px;line-height:1.7;color:var(--ink-2);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:20px;white-space:pre-wrap}
.gmem{display:flex;gap:10px;align-items:center;padding:7px 0}
.gmem .t{flex:1;min-width:0}
.gmem .title{display:block;font-weight:500;font-size:13.5px}
.gmem .sub{display:block;font-size:12px;color:var(--muted)}
.owner{font-size:11px;padding:0 6px;border-radius:4px;background:var(--qing-soft);color:var(--qing);font-weight:400}
.minis{display:flex;margin-right:4px}
.minis .seal{width:16px;height:16px;border-radius:4px;font-size:8px;padding:1px;box-shadow:0 0 0 1.5px var(--paper)}
.minis .seal.one{font-size:9px}
.minis .seal+.seal{margin-left:-4px}
@media (max-width:1100px){#main.with-panel .thread,#main.with-panel .composer{margin-right:0}.gpanel{box-shadow:-8px 0 30px rgba(29,34,43,.14)}}
/* 卡片总览：Agent、项目（不要中间那一列） */
.app.cards,.app.cards.list-off{grid-template-columns:76px 1fr}
.app.cards .list{display:none!important}
.overview{display:flex;flex-direction:column;min-height:0;height:100%}
.ov-head{padding:22px 32px 0;display:flex;align-items:center;gap:12px}
.ov-head h1{font:600 24px/1.2 var(--song);margin:0}
.ov-head .grow{flex:1}
.ov-head .search{margin:0;width:220px}
.mtabs{display:flex;gap:4px;padding:16px 32px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{display:flex;align-items:center;gap:7px;padding:9px 14px 11px;border-radius:9px 9px 0 0;color:var(--muted);white-space:nowrap;position:relative;font-size:13.5px}
.mtab:hover{color:var(--ink);background:var(--paper)}
.mtab.on{color:var(--ink);font-weight:600}
.mtab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--qing)}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.mdot.off{background:var(--line-strong)}
.mtab .n,.mtab .me{font-size:12px;color:var(--faint);font-weight:400}
.ov-body{flex:1;overflow:auto;padding:22px 32px 48px}
.sec-m{margin-bottom:30px}
.sec-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--faint)}
.sec-head b{font:600 15px var(--song);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-decoration:none;color:inherit;text-align:left}
.ccard:hover{border-color:var(--line-strong);box-shadow:0 6px 18px rgba(29,34,43,.07)}
.ccard.off{background:#FAFAF8}
.ccard.off .seal,.ccard.off .pmark{filter:grayscale(.85) opacity(.65)}
.ccard .top{display:flex;gap:12px;align-items:flex-start}
.ccard .t{flex:1;min-width:0}
.ccard .nm{font:600 16px/1.3 var(--song);margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.ccard .role{font-size:12.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.ccard .meta{display:flex;flex-wrap:wrap;gap:5px}
.ccard .path{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto;font-size:12.5px;color:var(--muted)}
.ccard .foot .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .go{color:var(--qing);font-weight:500}
.ccard .pin{position:absolute;top:12px;right:40px;color:var(--faint);opacity:0;padding:2px}
.ccard:hover .pin,.ccard .pin.on{opacity:1}
.ccard .more{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:0}
.ccard .more svg{width:16px;height:16px}
.ccard:hover .more{opacity:1}
.ccard .more:hover{background:var(--sunk);color:var(--ink)}
.ccard .pin.on{color:var(--warn)}
.ccard .pin svg{width:15px;height:15px}
.ccard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:170px;gap:6px;background:transparent}
.ccard.add svg{width:22px;height:22px}
.ccard.add:hover{color:var(--qing);border-color:var(--qing);box-shadow:none}
.ccard .seal{width:42px;height:42px;border-radius:9px;font-size:14px}
.ccard .seal.one{font-size:19px}
.ccard .pmark{width:42px;height:42px;font-size:19px}
.stack{display:flex;align-items:center}
.stack .seal{box-shadow:0 0 0 2px var(--panel)}
.stack .seal+.seal{margin-left:-6px}
.task-line{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;min-width:0}
.task-line .who{color:var(--qing);white-space:nowrap}
.task-line .what{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off-note{color:var(--faint);font-size:12.5px}
/* 进入 Agent / 项目后左边那一列 */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;text-decoration:none}
.back:hover{color:var(--ink)}
.back svg{width:15px;height:15px}
.side-card{margin:2px 12px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;gap:10px;align-items:center}
.side-card .t{flex:1;min-width:0}
.side-card .nm{font:600 15px/1.3 var(--song);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-card .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-new{margin:0 12px 6px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;border:1px dashed var(--line-strong);color:var(--ink-2);font-size:13px;text-decoration:none;width:calc(100% - 24px)}
.side-new:hover{border-color:var(--qing);color:var(--qing)}
.side-new svg{width:14px;height:14px}
.side-m{margin:0 14px 8px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.where{font-size:11px;padding:0 6px;border-radius:4px;background:#F3EEDC;color:#7A6320;white-space:nowrap;font-weight:400}
.dirs{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.dirs .dir{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.dirs .dir:hover{background:var(--sunk)}
.dirs .dir svg{width:15px;height:15px;color:var(--muted)}
.dirs .dir.up{color:var(--muted)}
.tag.mach{background:#EEF0E8;color:#4F5A3B;margin-right:4px;display:inline-block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tag.mach.off{color:var(--faint);background:var(--sunk)}
.approve .pw{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);outline:none}
.approve .pw:focus{border-color:var(--ink-2)}
.box .rcpt:empty{display:none}
.fork-from{font-size:12px;color:var(--muted);text-decoration:none}
.fork-from:hover{color:var(--ink)}
.msg.me .from{display:none}
.from-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.from-row b{font:600 14px var(--song)}
.from-row .tag{margin-left:2px}
.answer{line-height:1.75}
.answer p{margin:0 0 10px}
.answer code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.answer pre{font:12.5px/1.6 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px 14px;border-radius:8px;overflow:auto}
.steps{border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;font-size:13px}
.steps>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink-2)}
.steps>button .chev{margin-left:auto;transition:transform .15s}
.steps.open>button .chev{transform:rotate(90deg)}
.steps ol{display:none;margin:0;padding:2px 12px 10px 34px;color:var(--muted)}
.steps.open ol{display:block}
.steps li{padding:2px 0}
.steps li code{font:12px var(--mono);color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--huang);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--ink-2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.approve{border:1px solid #E6D7AE;background:#FBF7EA;border-radius:10px;padding:12px 14px;margin:4px 0 12px}
.approve .q{font-weight:600;margin-bottom:4px}
.approve pre{margin:6px 0 10px;font:12.5px var(--mono);background:#fff;border:1px solid #EFE5C8;padding:8px 10px;border-radius:6px;white-space:pre-wrap}
.approve .acts{display:flex;gap:8px;flex-wrap:wrap}
.approve.done{background:var(--paper);border-color:var(--line)}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.file{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.composer{max-width:760px;width:100%;margin:0 auto 18px;padding:0 22px}
.box{border:1px solid var(--line-strong);border-radius:14px;background:var(--panel);box-shadow:0 1px 0 rgba(29,34,43,.03)}
.box:focus-within{border-color:var(--qing)}
.box textarea{width:100%;border:0;outline:none;resize:none;padding:12px 14px 4px;min-height:52px;max-height:200px;background:none}
#box{position:relative}
#box textarea{max-height:none}
.grip{position:absolute;top:-5px;left:14px;right:14px;height:10px;cursor:row-resize;touch-action:none;z-index:2}
#box:has(.grip:hover),#box:has(.grip.on){border-top-color:var(--qing)}
@media (hover:none){.grip{display:none}}
.ta-wrap{position:relative}
.ta-wrap .icon-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;background:var(--panel)}
.ta-wrap .icon-btn svg{width:14px;height:14px}
.ta-wrap.big textarea{padding-right:40px}
.ta-wrap .icon-btn[hidden]{display:none}
.quote .qt{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble .bq{border-left:3px solid var(--line-strong);padding-left:10px;color:var(--muted);font-size:13px;margin:2px 0 6px}
.box .bar{display:flex;align-items:center;gap:4px;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--sunk)}
.chip svg{width:12px;height:12px}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--qing);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--line-strong);cursor:default}
.send.stop{background:var(--ink)}
.send svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(29,34,43,.14);padding:6px;min-width:200px;overflow-y:auto;overscroll-behavior:contain}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.pop.slash button.on{background:var(--sunk)}
.pop.slash b{font:600 13px var(--mono);min-width:110px}
.pop.slash b .arg{font:400 12px var(--sans);color:var(--muted)}
.pop button:hover{background:var(--sunk)}
.pop button .ck{margin-left:auto;color:var(--qing)}
.pop .sec{font-size:12px;color:var(--faint);padding:6px 10px 2px}
.pop .desc{font-size:12px;color:var(--muted)}
.pop svg{width:15px;height:15px;flex:none}

.newchat{margin:auto;width:min(800px,100%);padding:0 22px 12vh}
.newchat h2{font:600 26px/1.3 var(--song);margin:0 0 16px}
.seg.mini{padding:2px}
.seg.mini button{padding:3px 9px;font-size:12px}
.chip .path{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or{margin-top:22px;font-size:13px;color:var(--muted)}
.link{color:var(--qing);text-decoration:underline;text-underline-offset:3px}
.pop{max-height:60vh;overflow:auto}

.select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--panel);text-align:left}
.select:hover{border-color:var(--ink-2)}
.select[aria-expanded="true"]{border-color:var(--qing);box-shadow:0 0 0 3px var(--qing-soft)}
.select svg{width:14px;height:14px;color:var(--muted);flex:none}

/* ---------- 项目 ---------- */
.pmark{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 16px var(--song);
  color:var(--ink-2);background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.item.on .pmark{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.stack{display:flex;flex:none}
.stack .seal{box-shadow:0 0 0 2px var(--paper),inset 0 0 0 2px rgba(255,255,255,.18)}
.stack .seal+.seal{margin-left:-9px}
.stack.lg .seal{width:34px;height:34px}
.item .stack{width:58px}
.at{display:inline-flex;align-items:center;gap:3px;color:var(--qing);background:var(--qing-soft);border-radius:6px;padding:0 6px;font-size:13px;white-space:nowrap}
.at button{color:var(--qing);font-size:11px;opacity:.7}
.bubble .at{background:#fff}
.meta-r{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:12px;color:var(--faint);margin-top:4px}
.quote{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px;margin-bottom:6px;background:var(--paper);border-radius:0 8px 8px 0}
.quote.in-box{margin:8px 10px 0}
.quote .icon-btn{margin-left:auto;width:22px;height:22px;flex:none}
.rcpt{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;min-height:24px}
.from-row .status{margin-left:6px}
.acts-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.compare .col{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.compare .col.chosen{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.branch{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--ink-2);margin-bottom:8px}
.proj-body{flex:1;min-height:0;display:flex}
.proj-main{flex:1;min-width:0;display:flex;flex-direction:column}
.proj-main .msg,.proj-main .composer{max-width:1180px}
.proj-main .msg:has(.compare){max-width:none}          /* 对比几栏并排：用满宽度 */
.members{width:280px;flex:none;border-left:1px solid var(--line);padding:16px;overflow:auto;background:var(--paper)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mem .title,.mem .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .sub{font-size:12px;color:var(--muted)}
.danger-link{color:var(--bad)}

.diff .d-add{color:#9FE6A0}.diff .d-del{color:#F2A49B}.diff .d-hunk{color:#8FB8E8}
.acts-row a.link{text-decoration:underline;text-underline-offset:3px}

/* ---------- 定时任务 ---------- */
.run{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.run-head{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left}
.run-head .chev{margin-left:auto;transition:transform .15s}
.run.open .run-head .chev{transform:rotate(90deg)}
.run-body{display:none;padding:0 14px 12px;border-top:1px solid var(--line)}
.run.open .run-body{display:block;padding-top:10px}
.weekdays{display:inline-flex;gap:4px}
.weekdays button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);font-size:13px;color:var(--ink-2)}
.weekdays button.on{background:var(--qing);border-color:var(--qing);color:#fff}
.checks{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:6px}
.check{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.check svg{width:18px;height:18px;padding:2px;border-radius:5px;border:1.5px solid var(--line-strong);color:transparent;box-sizing:border-box}
.check.on svg{background:var(--qing);border-color:var(--qing);color:#fff}
.check.locked{color:var(--muted)}
.check.locked svg{background:var(--faint);border-color:var(--faint)}
.kv dd{white-space:pre-wrap}

/* ---------- 弹窗 ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,34,43,.28);display:grid;place-items:center;z-index:20}
.dialog{background:var(--panel);border-radius:16px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(29,34,43,.25)}
.dialog header{padding:18px 22px 4px;display:flex;align-items:center}
.dialog header h2{font:600 19px var(--song);margin:0;flex:1}
.dialog .body{padding:10px 22px 20px}
.dialog footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form .seg{justify-self:start}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:left}
.pick:hover{border-color:var(--ink-2)}
.pick.on{border-color:var(--qing);box-shadow:0 0 0 1px var(--qing)}
.pick .nm{font-weight:500} .pick .ds{font-size:12px;color:var(--muted)}

/* ---------- 表单 ---------- */
.form{display:grid;grid-template-columns:120px 1fr;gap:16px 18px;align-items:start}
.form>label,.form>.sub>label{padding-top:7px;color:var(--ink-2)}
.form>.sub{display:contents}
.form .help{font-size:12px;color:var(--muted);margin-top:4px}
.input,.textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);outline:none}
.input:focus,.textarea:focus{border-color:var(--qing)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:6px;background:var(--c)}
.swatches button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.avatar-picker{min-width:0}
.avatar-preview{margin-bottom:12px}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:10px;max-width:600px;margin-top:14px}
.avatar-choice{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 3px;border:2px solid transparent;border-radius:10px;font-size:11px;color:var(--muted)}
.avatar-choice img{width:48px;height:48px;object-fit:cover;border-radius:9px}
.avatar-choice:hover{background:var(--sunk)}
.avatar-choice.on{border-color:var(--qing);background:var(--sunk);color:var(--ink)}
.avatar-choice:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
.avatar-text{margin-top:16px}
.avatar-text[hidden],.avatar-grid[hidden]{display:none}

/* ---------- Agent ---------- */
.agent-page{overflow:auto;flex:1}
.agent-top{display:flex;gap:18px;align-items:center;padding:26px 32px 20px;border-bottom:1px solid var(--line)}
.agent-top h2{font:600 24px/1.25 var(--song);margin:0}
.agent-top .role{color:var(--muted);margin-top:2px;max-width:560px}
.agent-top .grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 8px;margin:0 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.pane{padding:22px 32px 40px;max-width:900px}
.sect{margin-bottom:28px}
.sect h3{font:600 15px var(--song);margin:0 0 10px}
.channel{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.channel .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 13px var(--sans)}
.channel .ci.feishu{background:#E4ECF7;color:#2F5A93} .channel .ci.weixin{background:#E3F1E7;color:#2E6E45}
.channel .grow{flex:1;min-width:0}
.channel.add{border-style:dashed;color:var(--muted)}
.channel.add:hover{border-color:var(--ink-2);color:var(--ink)}
.channel svg{width:16px;height:16px;flex:none}
.chat-row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chat-row:hover .tt{color:var(--qing)}
.chat-row .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 18px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.working{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#7A6216;margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:40}

/* 文档预览（#34）：对话里发来的 Markdown、网页、Word 在右侧打开，能看能改 */
.docfile{display:inline-flex;align-items:center;gap:10px;padding:9px 14px 9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;max-width:100%}
.docfile:hover{border-color:var(--line-strong)}
.docfile .di{width:30px;height:30px;border-radius:7px;background:var(--qing-soft);color:var(--qing);display:grid;place-items:center;flex:none}
.docfile .t{min-width:0}
.docfile b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docfile small{display:block;font-size:12px;color:var(--muted)}
.file.doc{cursor:pointer}
.file.doc:hover{border-color:var(--line-strong)}
.doc-edit{text-align:right;font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.doc-edit button{color:var(--qing)}
.docpane{position:fixed;top:0;right:0;bottom:0;width:var(--doc-w);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(29,34,43,.12);z-index:15;display:flex;flex-direction:column}
body{--doc-w:min(52vw,780px)}
@media (min-width:1280px){body.doc-open .app{margin-right:var(--doc-w)}body.doc-open .docpane{box-shadow:none}}
.doc-top{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.doc-top .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-top .nm .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--qing);margin-left:6px;vertical-align:2px}
.doc-top .vbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:8px;font-size:12.5px;color:var(--ink-2)}
.doc-top .vbtn:hover{background:var(--sunk)}
.doc-top .vbtn svg{width:14px;height:14px}
.doc-top .seg button{padding:4px 12px}
.doc-old{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#FBF6E7;border-bottom:1px solid #EFE5C8;font-size:13px;color:#7A6216}
.doc-old .sp{flex:1}
.doc-body{flex:1;min-height:0;overflow:auto;position:relative}
.doc-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.doc-body textarea{display:block;width:100%;height:100%;border:0;outline:0;resize:none;padding:24px 28px 80px;font:15px/1.8 var(--sans);color:var(--ink);background:var(--panel)}
.doc-body textarea.code{font:13px/1.7 var(--mono)}
.doc-md{max-width:720px;margin:0 auto;padding:30px 34px 80px;font-size:15.5px;line-height:1.85;color:var(--ink);overflow-wrap:anywhere}
.doc-md>:first-child{margin-top:0}
.doc-md h1,.doc-md h2,.doc-md h3,.doc-md h4,.doc-md h5,.doc-md h6{font-family:var(--song);line-height:1.4;margin:1.6em 0 .7em}
.doc-md h1{font-size:26px}.doc-md h2{font-size:21px}.doc-md h3{font-size:18px}.doc-md h4,.doc-md h5,.doc-md h6{font-size:16px}
.doc-md p{margin:0 0 1.1em}
.doc-md ul,.doc-md ol{margin:0 0 1.1em;padding-left:1.5em}
.doc-md li{margin:.25em 0}
.doc-md li>ul,.doc-md li>ol{margin:.25em 0 0}
.doc-md li.task{list-style:none;margin-left:-1.3em}
.doc-md li.task .tick{display:inline-block;width:1.3em;color:var(--muted)}
.doc-md img{max-width:100%;height:auto;border-radius:6px;vertical-align:middle}
.doc-md figure{margin:1.4em 0;text-align:center}
.doc-md figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.doc-md blockquote{margin:0 0 1.1em;padding:2px 0 2px 16px;border-left:3px solid var(--line-strong);color:var(--ink-2)}
.doc-md blockquote>:last-child{margin-bottom:0}
.doc-md code{font:.88em var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.doc-md pre{font:13px/1.65 var(--mono);background:#1F242C;color:#E4E7EB;padding:14px 16px;border-radius:8px;overflow:auto;margin:0 0 1.2em}
.doc-md pre code{background:none;padding:0;color:inherit;font:inherit}
.doc-md table{border-collapse:collapse;margin:0 0 1.2em;display:block;max-width:100%;overflow-x:auto;font-size:14px;line-height:1.6}
.doc-md th,.doc-md td{border:1px solid var(--line);padding:6px 11px;min-width:3em}
.doc-md th{background:var(--paper);font-weight:600}
.doc-md td p,.doc-md th p{margin:0}
.doc-md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.doc-md a{color:var(--qing)}
.doc-md .miss{display:inline-block;padding:2px 8px;border:1px dashed var(--line-strong);border-radius:6px;font-size:12.5px;color:var(--muted)}
.doc-loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .docpane{left:0;width:auto;z-index:26;border-left:0;box-shadow:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .doc-md{padding:22px 18px 60px;font-size:16px}
  .doc-body textarea{padding:18px 16px 60px;font-size:16px}
  .doc-top{padding:8px 8px 8px 6px}
}
@media (max-width:980px){.app{grid-template-columns:64px 250px 1fr}.rail a{width:52px}}
/* 手机（#17）：底部标签栏；列表和内容一屏一个（.phone-main 时看内容，否则看列表），进去左上角有返回 */

    padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:rgba(241,242,238,.96);backdrop-filter:blur(10px)}

    border-radius:16px 16px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(29,34,43,.22)}

.logs{font:12px/1.5 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px;border-radius:8px;max-height:60vh;overflow:auto;white-space:pre-wrap}

<body>

<script>
// ================= 基础 =================
const COLORS = {qing:"#2B4C6F", lu:"#3F7A5E", zhe:"#9A5B34", huang:"#B8902A", zhu:"#B5402F", dai:"#4A4F6B"};
const AVATARS = [["01-navigator","领航员"],["02-coder","程序员"],["03-designer","设计师"],["04-writer","写作者"],
  ["05-researcher","研究员"],["06-analyst","分析师"],["07-engineer","工程师"],["08-assistant","小助理"],
  ["09-explorer","探索者"],["10-guardian","守护者"],["11-maker","创造者"],["12-planner","规划师"],
  ["13-spark","灵感家"],["14-archivist","知识管家"],["15-buddy","搭档"],["16-sprout","成长伙伴"]];
const BASE = {claude:"Claude Code", codex:"Codex"};
const CLAUDE_MODELS = [["opus","Opus","最强，复杂任务"],["sonnet","Sonnet","快，日常够用"],["haiku","Haiku","最快最省"],["fable","Fable",""]];
const EFFORTS = {claude:["low","medium","high","xhigh","max"], codex:["minimal","low","medium","high","xhigh"]};
const EFF_DESC = {minimal:"几乎不思考，最快", low:"快，适合简单的事", medium:"日常够用", high:"想得更周全", xhigh:"更深入", max:"最深入，最慢"};
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  clip:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  monitor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  quote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h7M4 12h11M4 17h7"/><path d="M18 14v5"/></svg>',
  branch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 5 5 9-10"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5" fill="currentColor" fill-opacity=".18"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>',
  kb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10M9 8h5"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  folder:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3z"/></svg>',
  branch:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-5 4-11 7"/></svg>',
  fold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L19 7"/></svg>',
  file:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/></svg>',
  grow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
  shrink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>',
  x:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q = v => esc(JSON.stringify(String(v ?? "")));   // 放进 onclick="f(…)" 里的字符串：先成 JSON 字面量（带引号）再转义

// 多台电脑：请求交给东西所在的那台电脑（X-Machine）。没指明时按 id 找，找不到用当前打开的东西所在的电脑
const LOCAL_API = /^\/api\/(state|global|peers|events)/;
function targetOf(path, body, machine){
  if (machine !== undefined) return machine;
  if (LOCAL_API.test(path)) return null;
  const u = new URL(path, location.origin);
  return ownerOf(u.searchParams.get("id")) || ownerOf(body && (body.id || body.agent)) || ctxMachine;
}
const remoteHeader = m => m && S.me && m !== S.me ? {"X-Machine": m} : {};
// 有请求在路上：顶部细进度条（超过 150 毫秒才出现，快的看不到）；点下去的按钮进入处理中，防止连点（#32）
let inflight = 0, barTimer = null;
function busyBar(d){
  inflight = Math.max(0, inflight + d);
  const bar = $("#topbar");
  if (!bar) return;
  if (inflight && !barTimer && !bar.classList.contains("on")) barTimer = setTimeout(() => { barTimer = null; if (inflight) bar.classList.add("on"); }, 150);
  if (!inflight) { clearTimeout(barTimer); barTimer = null; bar.classList.remove("on"); }
}
let lastBtn = null;
addEventListener("pointerdown", e => { lastBtn = e.target.closest("button,.btn"); }, true);
async function api(path, body, machine){
  const btn = body !== undefined && lastBtn && document.contains(lastBtn) ? lastBtn : null;
  lastBtn = null;
  if (btn) { btn.classList.add("pending"); btn.setAttribute("aria-busy", "true"); }
  busyBar(1);
  try { return await api0(path, body, machine); }
  finally { busyBar(-1); if (btn) { btn.classList.remove("pending"); btn.removeAttribute("aria-busy"); } }
}
async function api0(path, body, machine){
  const to = targetOf(path, body, machine);
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
                               headers: {"X-CCIM": "1", "Content-Type": "application/json", ...remoteHeader(to)},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.hub) { location.reload(); throw new Error(d.error || "登录过期了"); }   // 服务器上：登录过期回到登录页
  // 别的电脑还没升级到有这个接口的版本（#74）
  if (r.status === 404 && d.error === "not found" && to && (to !== S.me || S.hub))
    throw new Error(`${(machineOf(to) || {name: "那台电脑"}).name}上的 ccim 版本较旧，先在「设置 → 电脑」里升级`);
  if (!r.ok) throw new Error(d.error || "出错了，再试一次。");
  return d;
}
async function act(fn, ok){ try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message); throw e; } }
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 2600); }
function tilde(p, machine){   // 用那台电脑自己的主目录缩写成 ~
  const home = ((S.machine_info || {})[machine || ctxMachine || S.me] || {}).home || S.home;
  return p && home && p.startsWith(home) ? "~" + p.slice(home.length) : p;
}

function when(ts){
  if (!ts) return "";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  if (isNaN(d)) return "";
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天";
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function group(ts){
  if (!ts) return "更早";
  const d = new Date(ts.replace(" ", "T")), now = new Date();
  return d.toDateString() === now.toDateString() ? "今天" : "更早";
}
function modelList(base, machine){   // [值, 名字, 说明, 具体型号]：和 Claude Code / Codex 自己的模型列表一致（当前那台电脑的）
  const info = (S.machine_info || {})[machine || ctxMachine || S.me] || {};
  const got = ((info.models || S.models) || {})[base] || [];
  return got.length || base === "codex" ? got : CLAUDE_MODELS;
}
function modelName(m){
  if (!m) return "默认";
  const s = String(m);
  const known = [...modelList("claude"), ...modelList("codex")].find(o => o[0] === s);
  if (known) return known[1];
  const one = s.includes("[1m]") ? " 1M" : "", b = s.replace("[1m]", "");
  const same = modelList("claude").find(o => o[0].replace("[1m]", "") === b);
  if (same) return same[1] + one;
  const hit = CLAUDE_MODELS.find(([k]) => b === k || b.startsWith(`claude-${k}`));
  if (!hit) return s;
  const v = b.match(/(\d+)-(\d+)(?:-\d{8})?$/);
  return hit[1] + (v ? ` ${v[1]}.${v[2]}` : "") + one;
}
function seal(a, size = "", dot = true){
  const txt = a ? (a.seal || "新") : "临";
  const chars = [...txt].slice(0, 2);
  const c = a ? (COLORS[a.color] || COLORS.qing) : "#8A8F87";
  const avatar = a && AVATARS.some(([id]) => id === a.avatar) ? a.avatar : null;
  const cls = ["seal", size, chars.length === 1 ? "one" : "vert", avatar ? "picture" : ""].join(" ");
  const d = a && dot ? `<i class="dot ${a.busy ? "busy" : (a.channels || []).some(c => c.state === "online") || !(a.channels || []).length ? "on" : ""}"></i>` : "";
  const img = avatar ? `<img src="/avatars/${avatar}.webp" alt="" decoding="async" onerror="this.parentElement.classList.remove('picture');this.remove()">` : "";
  return `<span class="${cls}" style="--c:${c}" aria-hidden="true">${chars.map(x => `<span>${esc(x)}</span>`).join("")}${img}${d}</span>`;
}

// 触屏（iPad、手机）上 Enter 换行，点发送按钮才发；有键盘的电脑上 Enter 发送（#54）
const TOUCH = matchMedia("(hover: none) and (pointer: coarse)").matches || navigator.maxTouchPoints > 1 && /Macintosh|iPad/.test(navigator.userAgent);
function sendKey(e){
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return false;
  return TOUCH ? (e.metaKey || e.ctrlKey) : !e.shiftKey;
}
function sendHint(){ return TOUCH ? "点右边的按钮发送，Enter 换行" : "Enter 发送，Shift + Enter 换行"; }
// 临时对话的图标：聊天气泡，给对话选了颜色就跟着变（#52）
function chatIcon(c, size = ""){
  const col = (c && MARK_COLORS[c.color]) || "var(--muted)";
  return `<span class="chaticon ${size}" style="--ic:${col}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4" stroke-linecap="round"/></svg></span>`;
}
const iconOf = (c, a, size = "", dot = false) => a ? seal(a, size, dot) : chatIcon(c, size);

// ---- Markdown（只认常见写法，先转义再排版） ----
function md(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let i = 0;
  while (i < lines.length){
    let l = lines[i];
    if (/^```/.test(l)){
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const row = s => s.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
      continue;
    }
    let m;
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))){ out.push(`<h3>${inline(m[2])}</h3>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)){
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));

    out.push(`<p>${buf.join("<br>")}</p>`);
  }

let chatFilter = "";
function chatTree(rows){
  // 分叉出来的对话挂在原来那个下面（置顶、归档的单独成组，不挂）；整棵树按里面最近一次聊的时间排
  const byId = Object.fromEntries(rows.map(c => [c.id, c])), kids = {};
  const secOf = (c, seen = new Set()) => {
    if (c._sec) return c._sec;
    if (c.pin != null) return c._sec = "pin";
    if (c.archived) return c._sec = "arch";
    const p = c.parent && c.parent !== c.id && byId[c.parent];
    if (p && !seen.has(p.id)) { seen.add(c.id); return c._sec = secOf(p, seen); }   // 跟着原来那个
    return c._sec = "";
  };
  rows.forEach(c => { delete c._sec; });
  rows.forEach(c => secOf(c));
  const hangs = c => c.parent && byId[c.parent] && c.parent !== c.id && byId[c.parent]._sec === c._sec && c.pin == null;
  const roots = rows.filter(c => !hangs(c));
  rows.forEach(c => { if (hangs(c)) (kids[c.parent] = kids[c.parent] || []).push(c); });
  const latest = (c, seen = new Set()) => {
    if (seen.has(c.id)) return c.last_active || ""; seen.add(c.id);
    return (kids[c.id] || []).reduce((m, k) => { const v = latest(k, seen); return v > m ? v : m; }, c.last_active || "");
  };
  roots.forEach(c => { c._latest = latest(c); });
  roots.sort((a, b) => (b._latest > a._latest ? 1 : -1));
  return {roots, kids};
}

  const arch = roots.filter(c => c._sec === "arch");
  let html = pinned.length ? `<div class="group">置顶</div>` + pinned.map(item).join("") : "";
  for (const g of ["今天", "更早"]) {

    if (items.length) html += `<div class="group">${g}</div>` + items.map(item).join("");

function drawThread(){

  // 长对话先画最近的，更早的点一下再展开（#32）
  const from = detail.showAll ? 0 : Math.max(0, detail.log.length - SHOW_RECENT);

  const more = from ? `<button class="show-more" onclick="showEarlier()">显示更早的 ${from + (detail.earlier || []).length} 条</button>` : "";

// 输入框跟着内容变高；拖上边框手动拉高（记住），双击恢复；字多了右上角可以展开、收起
let inputH = +localStorage.getItem("ccim.inputH") || 0;
const inputCap = () => Math.round(innerHeight * .6);
function fitInput(){
  const ta = $("#input"), b = $("#ta-size"); if (!ta || !b) return;
  const cap = inputCap();
  ta.style.height = "auto";
  const need = ta.scrollHeight;
  ta.style.height = Math.min(Math.max(inputH, need + 2), cap) + "px";
  const big = inputH >= cap - 1, show = big || need > 110;
  b.hidden = !show; $("#ta-wrap").classList.toggle("big", show);
  b.innerHTML = big ? ICON.shrink : ICON.grow;
  b.title = big ? "收起" : "展开"; b.setAttribute("aria-label", b.title);
}
function toggleInput(){
  inputH = inputH >= inputCap() - 1 ? 0 : inputCap();
  if (inputH) localStorage.setItem("ccim.inputH", inputH); else localStorage.removeItem("ccim.inputH");
  fitInput(); $("#input").focus();
}
function gripInput(){
  const g = $("#grip"), ta = $("#input"); if (!g) return;
  g.onpointerdown = e => {
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("on");
    const y0 = e.clientY, h0 = ta.offsetHeight, cap = Math.round(innerHeight * .6);
    g.onpointermove = m => { inputH = Math.min(Math.max(52, h0 + y0 - m.clientY), cap); ta.style.height = inputH + "px"; };
    g.onpointerup = g.onpointercancel = () => {
      g.onpointermove = g.onpointerup = g.onpointercancel = null; g.classList.remove("on");
      localStorage.setItem("ccim.inputH", inputH); fitInput();
    };
  };
  g.ondblclick = () => { inputH = 0; localStorage.removeItem("ccim.inputH"); fitInput(); };
}

function addQuote(text){

  if (!$("#quotes")) {                    // 没有引用区的输入框：照旧放进文字里
    input.value = text.split("\n").map(l => "> " + l).join("\n") + "\n\n" + input.value.replace(/^\s+/, "");
    return input.focus();
  }
  if (quotes.id !== detail.id) quotes = {id: detail.id, list: []};
  quotes.list.push(text); drawQuotes(); drawComposerState(); input.focus();

function dropQuote(k){ quotes.list.splice(k, 1); drawQuotes(); drawComposerState(); $("#input")?.focus(); }
function drawQuotes(){
  const el = $("#quotes"); if (!el) return;
  el.innerHTML = quoteList().map((t, k) => `<div class="quote in-box"><span class="qt">${esc(t)}</span><button class="icon-btn" aria-label="去掉引用" title="去掉引用" onclick="dropQuote(${k})">${ICON.x}</button></div>`).join("");
}
const withQuotes = (qs, v) => [...qs.map(t => t.split("\n").map(l => "> " + l).join("\n")), v].filter(Boolean).join("\n\n");
// 发出去的消息：开头的引用画成引用块
function userText(t){
  const ls = (t || "").split("\n"), out = []; let k = 0;
  while (k < ls.length && /^>/.test(ls[k])) {
    const b = [];
    while (k < ls.length && /^>/.test(ls[k])) b.push(ls[k++].replace(/^> ?/, ""));
    out.push(`<div class="bq">${esc(b.join("\n"))}</div>`);
    while (k < ls.length && !ls[k].trim()) k++;
  }
  return out.length ? out.join("") + esc(ls.slice(k).join("\n")) : esc(t);
}
async function sendChat(){
  const typed = $("#input").value.trim(), files = pendingFiles.filter(f => f.key), qs = quoteList().slice(), v = withQuotes(qs, typed);
  if (pendingFiles.some(f => !f.key)) return toast("文件还在上传");
  if (!v && !files.length) return;
  closePop();
  const back = () => { $("#input").value = typed; if (detail) quotes = {id: detail.id, list: qs}; drawQuotes(); };
  quotes.list = []; drawQuotes();
  if (chatRcpt.length && !detail.readonly){       // @ 了其他 Agent：交给它们答
    const to = chatRcpt;
    $("#input").value = ""; pendingFiles = []; chatRcpt = []; drawPending(); drawChatRcpt(); drawComposerState();
    try {
      const r = await act(() => api("/api/chat/mention", {id: detail.id, text: v, files, to}));
      if (r.queued) toast(`「${r.machine}」现在离线，上线后自动发出`);
      else if (detail.agent && to.some(a => !(detail.members || []).includes(a))) { toast("已拉进群聊"); reloadChat(); }
    }
    catch { back(); chatRcpt = to; drawChatRcpt(); drawComposerState(); }
    return;
  }
  if (detail.readonly && starting) return;
  $("#input").value = ""; pendingFiles = []; drawPending();
  if (detail.readonly) {                 // 接着别处的对话：转成网页里的新对话
    starting = true;
    const src = detail, mine = {type: "user", text: v, files: files.map(f => ({name: f.name})), sending: true, at: Date.now() / 1000};
    src.log.push(mine);                  // 新对话建好要一会儿：先把这条显示出来
    drawThread();
    const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight;
    try {
      const {id} = await act(() => api("/api/chat/continue", {id: src.id, text: v, files}));
      await loadState();
      quietOpen = id;                    // 换到新对话时不清空页面，内容到了直接换上（#45）
      location.hash = src.agent && current.view === "agents"
        ? `#/agents/${encodeURIComponent(src.agent)}/${encodeURIComponent(id)}` : `#/chats/${encodeURIComponent(id)}`;
    } catch {
      src.log = src.log.filter(x => x !== mine);
      if (detail === src) { drawThread(); back(); }
    } finally { starting = false; }
    return;
  }
  const mine = {type: "user", text: v, files: files.map(f => ({name: f.name})), sending: true, at: Date.now() / 1000};
  detail.log.push(mine);                 // 先显示出来，服务器那条到了再换掉
  if (!detail.busy) { detail.busy = true; detail.progress = {steps: [], text: "", guess: true}; }   // 还没开始干活，先显示思考中
  drawThread(); drawComposerState();
  const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight;
  let r;
  try { r = await act(() => api("/api/chat/send", {id: detail.id, text: v, files})); }
  catch { detail.log = detail.log.filter(x => x !== mine); detail.busy = false; detail.progress = null; back(); drawThread(); drawComposerState(); return; }
  if (r.queued) {                         // 那台电脑离线：先存着，上线后发出
    detail.busy = false; detail.progress = null; drawThread(); drawComposerState();
    toast(`「${r.machine}」现在离线，上线后自动发出`);
  }
}

async function moveChat(id, d){

const SLASH = [

  ["/status", "当前状态"],

function slashTyped(){
  const v = $("#input").value, m = /^\/(\S*)$/.exec(v);

  const hits = m ? SLASH.filter(([k, , , only]) => k.startsWith("/" + m[1].toLowerCase()) && (!only || (detail.base || "claude") === only)) : [];
  if (!hits.length || hits.length === 1 && hits[0][0] === v) { if (old) old.remove(); return; }
  if (old && old.dataset.v === v) return;
  const on = old ? Math.min(+old.dataset.on || 0, hits.length - 1) : 0;
  const p = pop({currentTarget: $("#box"), stopPropagation(){}}, hits.map(([k, d, arg], i) =>
    `<button class="${i === on ? "on" : ""}" onmousedown="event.preventDefault()" onclick="slashPick(${q(k)}, ${arg ? 1 : 0})"><b>${esc(k)}${arg ? ` <span class="arg">${esc(arg)}</span>` : ""}</b><span class="desc">${esc(d)}</span></button>`).join(""));
  p.classList.add("slash"); p.dataset.v = v; p.dataset.on = on;
}
function slashPick(k, arg){   // 回车、Tab、点选都只填进输入框，再按回车才发出（免得误触）

function slashKey(e){
  const p = document.querySelector(".pop.slash"); if (!p || e.isComposing) return false;
  const bs = [...p.querySelectorAll("button")], on = +p.dataset.on || 0;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const n = (on + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length;
    bs.forEach((b, i) => b.classList.toggle("on", i === n)); p.dataset.on = n; bs[n].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && !e.shiftKey || e.key === "Tab") bs[on].click();

}

function heatHtml(heat, today){
  const end = today ? new Date(today + "T00:00:00") : new Date(); end.setHours(0, 0, 0, 0);
  const start = new Date(end); start.setDate(start.getDate() - 7 * 26 + 1 - ((end.getDay() + 6) % 7));   // 从 26 周前的周一开始
  const max = Math.max(1, ...Object.values(heat));
  const lv = n => !n ? 0 : n <= max * .25 ? 1 : n <= max * .5 ? 2 : n <= max * .75 ? 3 : 4;
  const cols = [], months = [];
  for (let d = new Date(start), w = 0; d <= end; w++) {
    const col = [];
    for (let i = 0; i < 7 && d <= end; i++, d.setDate(d.getDate() + 1)) {
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      if (d.getDate() <= 7 && i === 0) months.push([w, `${d.getMonth() + 1}月`]);
      col.push(`<i class="l${lv(heat[k] || 0)}" title="${k}：${heat[k] || 0} 条"></i>`);
    }
    cols.push(`<span class="hcol">${col.join("")}</span>`);
  }
  const total = Object.values(heat).reduce((a, b) => a + b, 0);
  return `<div class="heat"><div class="hmonths">${months.map(([w, m]) => `<span style="left:${w * 12}px">${m}</span>`).join("")}</div><div class="hgrid">${cols.join("")}</div>
    <div class="hfoot"><span>近半年发了 ${total} 条消息</span><span class="hlegend">少<i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>多</span></div></div>`;
}
async function renderBoard(quick){

  const shown = showAllRecent ? recent : recent.slice(0, 5);

    <div class="bstats">

      <div class="stat"><b>${work.length}</b><span>正在干活</span></div>
      <div class="stat"><b>${boardStats ? st.turns_week : "…"}</b><span>本周发了几条</span></div>
      <div class="stat"><b>${boardStats ? st.done_week : "…"}</b><span>本周完成</span></div>
    </div>
    <div class="bgrid"><div class="bleft">
      ${sec("等你处理", "var(--zhu)", wait.length, wait.length ? `<div class="glass-bed">${wait.map(c => boardRow(c, "wait")).join("")}</div>` : `<p class="bempty">没有在等你的事。</p>`, "waiting")}
      ${work.length ? sec("正在干活", "var(--warn)", work.length, work.map(c => boardRow(c, "work")).join("")) : ""}
      ${(() => {
        const ags = recentAgents(recent);
        const tabs = `<span class="rtabs" role="tablist"><button role="tab" aria-selected="${recentTab === "chats"}" class="${recentTab === "chats" ? "on" : ""}" onclick="setRecentTab('chats')">对话 ${recent.length}</button><button role="tab" aria-selected="${recentTab === "agents"}" class="${recentTab === "agents" ? "on" : ""}" onclick="setRecentTab('agents')">Agent ${ags.length}</button></span>`;
        const body = recentTab === "agents"
          ? (ags.length ? ags.map(agentRecentRow).join("") : `<p class="bempty">最近 7 天没和 Agent 聊过。</p>`)
          : (recent.length ? shown.map(c => boardRow(c, "recent")).join("") + (recent.length > 5 && !showAllRecent ? `<button class="link" style="margin:4px 14px" onclick="showAllRecent=true;renderBoard(true)">显示另外 ${recent.length - 5} 件</button>` : "") : `<p class="bempty">最近 7 天没有别的对话。</p>`);
        return `<div class="bsec"><h2><i style="background:var(--faint)"></i>最近在跟${tabs}</h2>${body}</div>`;
      })()}

  if (top) $(".board").scrollTop = top;

function selTool(){

  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);

  if (!ans || !ans.contains(sel.focusNode)) return;

  const anc = [...document.querySelectorAll("#thread .anc")].filter(a => a.compareDocumentPosition(ans) & Node.DOCUMENT_POSITION_FOLLOWING).pop();
  const i = anc ? +anc.id.slice(4) : -1;

  const t = document.createElement("div"); t.className = "seltool";
  t.innerHTML = `<button>${ICON.save}存到知识库</button><button>${ICON.quote}引用</button>`;
  t.style.left = Math.max(8, rect.left) + "px"; t.style.top = Math.max(8, rect.top - 40) + "px";

function verOf(m){ return ((S.machine_info || {})[m.id] || {}).ccim || null; }
function verLine(m){
  const v = verOf(m);
  if (!v) return "";
  const kind = v.kind === "dev" ? "开发版" : "";
