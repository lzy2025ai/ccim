<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccim</title>
<style>
:root{
  --paper:#F1F2EE; --panel:#FFFFFF; --sunk:#E8EAE5; --line:#DCDFD8; --line-strong:#C9CDC4;
  --ink:#1D222B; --ink-2:#3A404A; --muted:#6C7169; --faint:#9A9F97;
  --qing:#2B4C6F; --qing-soft:#E3EAF1;
  --lu:#3F7A5E; --zhe:#9A5B34; --huang:#B8902A; --zhu:#B5402F; --dai:#4A4F6B;
  --ok:#3F7A5E; --warn:#B8902A; --bad:#B5402F;
  --song:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:76px 300px 1fr;height:100vh;overflow:hidden}
body{overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line)}
.brand{font:700 15px/1 var(--song);letter-spacing:.5px;margin-bottom:18px;color:var(--ink)}
.rail a{width:60px;padding:9px 0 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:12px}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--panel);color:var(--qing);box-shadow:0 0 0 1px var(--line)}
.rail .spacer{flex:1}

.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.list-head h1{font:600 19px/1.2 var(--song);margin:0}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.scroll{overflow:auto;flex:1;padding:0 8px 16px}
.group{font-size:12px;color:var(--faint);padding:12px 10px 4px}
.item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:flex-start;width:100%;text-align:left}
.item:hover{background:var(--sunk)}
.item.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.item .t{flex:1;min-width:0}
.item .title,.item .sub{display:block}
.item .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{font-size:12px;color:var(--faint);white-space:nowrap}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}

/* ---------- 印章 ---------- */
.seal{--c:var(--qing);flex:none;width:34px;height:34px;border-radius:7px;background:var(--c);color:#fff;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;padding:3px;
  font:700 12px/1 var(--song);position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.seal.one{grid-template-columns:1fr;grid-template-rows:1fr;font-size:16px}
.seal span{display:block}
.seal.vert{grid-template-columns:1fr;gap:1px}
.seal.lg{width:64px;height:64px;font-size:22px;border-radius:12px;padding:6px}
.seal.lg.one{font-size:30px}
.seal.sm{width:26px;height:26px;font-size:10px;border-radius:6px;padding:2px}
.seal.sm.one{font-size:13px}
.seal.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.seal .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--faint)}
.seal .dot.on{background:var(--ok)} .seal .dot.busy{background:var(--huang)}

/* ---------- 通用 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--qing);border-color:var(--qing);color:#fff}
.btn.primary:hover{background:#223d5a}
.btn.danger{color:var(--bad);border-color:#E3C3BD}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn svg{width:15px;height:15px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.feishu{background:#E4ECF7;color:#2F5A93} .tag.weixin{background:#E3F1E7;color:#2E6E45} .tag.term{background:#ECE9E3;color:#5E5547}
.tag.web{background:var(--qing-soft);color:var(--qing)}
.path{font:12px/1.4 var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.on i{background:var(--ok)} .status.busy i{background:var(--huang)} .status.err i{background:var(--bad)}
.status.busy{color:#7A6216}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:380px;padding:40px 20px}
.empty h2{font:600 22px/1.3 var(--song);color:var(--ink);margin:0 0 8px}

/* ---------- 对话 ---------- */
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
.chat-head .name{font:600 16px/1.3 var(--song)}
.chat-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.chat-head .grow{flex:1;min-width:0}
.notice{margin:12px 22px 0;padding:9px 12px;border-radius:8px;background:#F4F1E6;color:#6B5A27;font-size:13px}
.thread{flex:1;overflow:auto;padding:22px 0 10px}
.msg{max-width:760px;margin:0 auto 22px;padding:0 22px}
.msg.me{display:flex;justify-content:flex-end}
.bubble{background:var(--sunk);padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:80%;white-space:pre-wrap}
.msg.me .from{display:none}
.from-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.from-row b{font:600 14px var(--song)}
.from-row .tag{margin-left:2px}
.answer{line-height:1.75}
.answer p{margin:0 0 10px}
.answer code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.answer pre{font:12.5px/1.6 var(--mono);background:#1F242C;color:#E4E7EB;padding:12px 14px;border-radius:8px;overflow:auto}
.steps{border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;font-size:13px}
.steps>button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;color:var(--ink-2)}
.steps>button .chev{margin-left:auto;transition:transform .15s}
.steps.open>button .chev{transform:rotate(90deg)}
.steps ol{display:none;margin:0;padding:2px 12px 10px 34px;color:var(--muted)}
.steps.open ol{display:block}
.steps li{padding:2px 0}
.steps li code{font:12px var(--mono);color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--huang);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--ink-2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.approve{border:1px solid #E6D7AE;background:#FBF7EA;border-radius:10px;padding:12px 14px;margin:4px 0 12px}
.approve .q{font-weight:600;margin-bottom:4px}
.approve pre{margin:6px 0 10px;font:12.5px var(--mono);background:#fff;border:1px solid #EFE5C8;padding:8px 10px;border-radius:6px;white-space:pre-wrap}
.approve .acts{display:flex;gap:8px;flex-wrap:wrap}
.approve.done{background:var(--paper);border-color:var(--line)}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
.file{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.composer{max-width:760px;width:100%;margin:0 auto 18px;padding:0 22px}
.box{border:1px solid var(--line-strong);border-radius:14px;background:var(--panel);box-shadow:0 1px 0 rgba(29,34,43,.03)}
.box:focus-within{border-color:var(--qing)}
.box textarea{width:100%;border:0;outline:none;resize:none;padding:12px 14px 4px;min-height:52px;max-height:200px;background:none}
.box .bar{display:flex;align-items:center;gap:4px;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--sunk)}
.chip svg{width:12px;height:12px}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--qing);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--line-strong);cursor:default}
.send.stop{background:var(--ink)}
.send svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(29,34,43,.14);padding:6px;min-width:200px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left}
.pop button:hover{background:var(--sunk)}
.pop button .ck{margin-left:auto;color:var(--qing)}
.pop .sec{font-size:12px;color:var(--faint);padding:6px 10px 2px}
.pop .desc{font-size:12px;color:var(--muted)}
.pop svg{width:15px;height:15px;flex:none}

.newchat{margin:auto;width:min(720px,100%);padding:0 22px 12vh}
.newchat h2{font:600 26px/1.3 var(--song);margin:0 0 16px}
.seg.mini{padding:2px}
.seg.mini button{padding:3px 9px;font-size:12px}
.chip .path{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or{margin-top:22px;font-size:13px;color:var(--muted)}
.link{color:var(--qing);text-decoration:underline;text-underline-offset:3px}
.pop{max-height:60vh;overflow:auto}

.select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--panel);text-align:left}
.select:hover{border-color:var(--ink-2)}
.select[aria-expanded="true"]{border-color:var(--qing);box-shadow:0 0 0 3px var(--qing-soft)}
.select svg{width:14px;height:14px;color:var(--muted);flex:none}

/* ---------- 项目 ---------- */
.pmark{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 16px var(--song);
  color:var(--ink-2);background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.item.on .pmark{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.stack{display:flex;flex:none}
.stack .seal{box-shadow:0 0 0 2px var(--paper),inset 0 0 0 2px rgba(255,255,255,.18)}
.stack .seal+.seal{margin-left:-9px}
.stack.lg .seal{width:34px;height:34px}
.item .stack{width:58px}
.at{display:inline-flex;align-items:center;gap:3px;color:var(--qing);background:var(--qing-soft);border-radius:6px;padding:0 6px;font-size:13px;white-space:nowrap}
.at button{color:var(--qing);font-size:11px;opacity:.7}
.bubble .at{background:#fff}
.meta-r{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:12px;color:var(--faint);margin-top:4px}
.quote{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px;margin-bottom:6px;background:var(--paper);border-radius:0 8px 8px 0}
.quote.in-box{margin:8px 10px 0}
.quote .icon-btn{margin-left:auto;width:22px;height:22px;flex:none}
.rcpt{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;min-height:24px}
.from-row .status{margin-left:6px}
.acts-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.compare .col{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.compare .col.chosen{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.branch{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--ink-2);margin-bottom:8px}
.proj-body{flex:1;min-height:0;display:flex}
.proj-main{flex:1;min-width:0;display:flex;flex-direction:column}
.proj-main .msg,.proj-main .composer{max-width:860px}
.members{width:280px;flex:none;border-left:1px solid var(--line);padding:16px;overflow:auto;background:var(--paper)}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mem .title,.mem .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .sub{font-size:12px;color:var(--muted)}
.danger-link{color:var(--bad)}

/* ---------- 弹窗 ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,34,43,.28);display:grid;place-items:center;z-index:20}
.dialog{background:var(--panel);border-radius:16px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(29,34,43,.25)}
.dialog header{padding:18px 22px 4px;display:flex;align-items:center}
.dialog header h2{font:600 19px var(--song);margin:0;flex:1}
.dialog .body{padding:10px 22px 20px}
.dialog footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form .seg{justify-self:start}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);text-align:left}
.pick:hover{border-color:var(--ink-2)}
.pick.on{border-color:var(--qing);box-shadow:0 0 0 1px var(--qing)}
.pick .nm{font-weight:500} .pick .ds{font-size:12px;color:var(--muted)}

/* ---------- 表单 ---------- */
.form{display:grid;grid-template-columns:120px 1fr;gap:16px 18px;align-items:start}
.form>label{padding-top:7px;color:var(--ink-2)}
.form .help{font-size:12px;color:var(--muted);margin-top:4px}
.input,.textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);outline:none}
.input:focus,.textarea:focus{border-color:var(--qing)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.swatches button{width:22px;height:22px;border-radius:6px;background:var(--c)}
.swatches button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}

/* ---------- Agent ---------- */
.agent-page{overflow:auto;flex:1}
.agent-top{display:flex;gap:18px;align-items:center;padding:26px 32px 20px;border-bottom:1px solid var(--line)}
.agent-top h2{font:600 24px/1.25 var(--song);margin:0}
.agent-top .role{color:var(--muted);margin-top:2px;max-width:560px}
.agent-top .grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 8px;margin:0 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.pane{padding:22px 32px 40px;max-width:900px}
.sect{margin-bottom:28px}
.sect h3{font:600 15px var(--song);margin:0 0 10px}
.channel{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.channel .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:600 13px var(--sans)}
.channel .ci.feishu{background:#E4ECF7;color:#2F5A93} .channel .ci.weixin{background:#E3F1E7;color:#2E6E45}
.channel .grow{flex:1;min-width:0}
.channel.add{border-style:dashed;color:var(--muted)}
.channel.add:hover{border-color:var(--ink-2);color:var(--ink)}
.channel svg{width:16px;height:16px;flex:none}
.chat-row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chat-row:hover .tt{color:var(--qing)}
.chat-row .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 18px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.working{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#7A6216;margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:40}

@media (max-width:980px){.app{grid-template-columns:64px 250px 1fr}.rail a{width:52px}}
@media (max-width:760px){.app{grid-template-columns:1fr}.rail,.list{display:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand">ccim</div>
    <a href="#/chats" data-nav="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H9l-5 4z"/></svg>对话</a>
    <a href="#/projects" data-nav="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5M13 15.2c.9-.5 1.9-.7 3-.7 2.2 0 4.2 1.5 5 4.5"/></svg>项目</a>
    <a href="#/agents" data-nav="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 10h6M9 14h4"/></svg>Agent</a>
    <div class="spacer"></div>
    <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>设置</a>
  </nav>
  <section class="list" id="list"></section>
  <main class="main" id="main"></main>
</div>

<script>
// ================= 假数据 =================
const COLORS = {qing:"#2B4C6F", lu:"#3F7A5E", zhe:"#9A5B34", huang:"#B8902A", zhu:"#B5402F", dai:"#4A4F6B"};
const MODELS = {claude:[["opus","Opus 5.5","最强，复杂任务"],["sonnet","Sonnet 5","快，日常够用"],["haiku","Haiku","最快最省"]],
                codex:[["gpt-6-sol","gpt-6-sol","默认"],["gpt-6-mini","gpt-6-mini","更快"]]};
const EFFORTS = {claude:["low","medium","high","xhigh","max"], codex:["minimal","low","medium","high","xhigh"]};
const BASE = {claude:"Claude Code", codex:"Codex"};

let agents = [
  {id:"ccim", name:"ccim 开发", seal:"开发", color:"qing", base:"claude", model:"opus", effort:"high",
   role:"负责 ccim 仓库的开发：改代码、写测试、提交前跑一遍检查。改动只提交自己改的文件。",

function seal(a, size="", dot=true){

  const cls = ["seal", size, chars.length === 1 ? "one" : "", chars.length === 2 ? "vert" : "", a && a.state === "off" ? "off" : ""].join(" ");
  const d = a && dot ? `<i class="dot ${a.state === "busy" ? "busy" : a.state === "on" ? "on" : ""}"></i>` : "";

}

function finish(c, m, html){

    n += 6; m.text = full.slice(0, n).replace(/<[^>]*$/, "");

const EFF_DESC = {low:"快，适合简单的事",medium:"日常够用",high:"想得更周全",xhigh:"更深入",max:"最深入，最慢",minimal:"几乎不思考，最快"};
const DD = {};
function dd(id, opts, value){
  DD[id] = {opts, value};
  const cur = opts.find(o => o[0] === value) || opts[0];
  return `<button type="button" class="select" id="dd-${id}" aria-haspopup="listbox" aria-expanded="false" onclick="openDD(event,'${id}')"><span>${esc(cur[1])}</span>${ICON.down}</button>`;
}
function openDD(e, id){
  const d = DD[id], btn = e.currentTarget;
  pop(e, d.opts.map(([v, l, ds]) => `<button role="option" aria-selected="${d.value === v}" onclick="pickDD('${id}','${v}')"><span><div>${esc(l)}</div>${ds ? `<div class="desc">${esc(ds)}</div>` : ""}</span>${d.value === v ? `<span class="ck">✓</span>` : ""}</button>`).join(""), true);
  btn.setAttribute("aria-expanded", "true");
}
function pickDD(id, v){
  DD[id].value = v; closePop();
  document.querySelector(`#dd-${id} span`).textContent = DD[id].opts.find(o => o[0] === v)[1];
}
function pop(e, html, below){
  e.stopPropagation(); closePop();
  const p = document.createElement("div"); p.className = "pop"; p.innerHTML = html; document.body.append(p);
  const r = e.currentTarget.getBoundingClientRect();
  if (below) p.style.minWidth = r.width + "px";
  p.style.left = Math.max(10, Math.min(r.left, innerWidth - p.offsetWidth - 10)) + "px";
  const up = r.top - p.offsetHeight - 6;
  p.style.top = (below || up < 10 ? r.bottom + 6 : up) + "px";
}
addEventListener("click", closePop);
addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

  {id:"p2", name:"牵牛花插件 2.0", dir:"~/Desktop/SD-订单管理/0527-美团长期项目", members:["meituan", "qa"], last:"昨天", feed:[
    {type:"task", id:"t9", time:"昨天 19:20", text:"整理一下客户提的多浏览器授权需求，给出两个方案和报价", to:["meituan"]},
    {type:"reply", task:"t9", agent:"meituan", state:"done", elapsed:"1 分 30 秒", steps:["读了 src/license/fingerprint.ts","读了 docs/授权方案.md"],
     text:"<p><b>方案一</b>：维持按浏览器授权，同一台电脑多装几个浏览器就多占几个名额。不用开发。</p><p><b>方案二</b>：加一个本地辅助程序识别整台电脑，开发约 5 天，之后每次系统升级都要跟着测。</p>"},
  ]},
];
const projOf = id => projects.find(p => p.id === id);

function pmark(p){ return `<span class="pmark" aria-hidden="true">${esc([...p.name.replace(/[\s\d\-_.]/g, "")][0] || "项")}</span>`; }
function memberLine(p){
  const names = p.members.map(m => agentOf(m).name);
  return names.length ? names.slice(0, 3).join("、") + (names.length > 3 ? ` 等 ${names.length} 个` : "") : "还没有 Agent";
}
function renderProjectList(){
  $("#list").innerHTML = `
    <div class="list-head"><h1>项目</h1><button class="btn primary" onclick="newProject()">${ICON.plus}新建</button></div>
    <label class="search">${ICON.search}<input placeholder="搜索项目" aria-label="搜索项目"></label>
    <div class="scroll">${projects.map(p => {
      const busy = p.feed.some(f => f.type === "reply" && (f.state === "working" || f.state === "queued"));
      return `<a class="item ${current.id === p.id ? "on" : ""}" href="#/projects/${p.id}" style="text-decoration:none;color:inherit">
        ${pmark(p)}
        <span class="t"><span class="title">${esc(p.name)}</span>${busy ? `<span class="working"><span class="spin"></span>有任务在做</span>` : `<span class="sub">${esc(memberLine(p))}</span>`}</span>
        <span class="when">${p.last}</span></a>`;
    }).join("")}</div>`;
}
function renderProjectEmpty(){
  $("#main").innerHTML = `<div class="empty"><h2>项目</h2><p>把几个 Agent 拉进一个项目，在里面 @ 它们派活；同一件事也可以交给几个 Agent 各做一份，对比结果。</p>
    <button class="btn primary" onclick="newProject()">${ICON.plus}新建项目</button></div>`;
}

let rcpt = [], compareMode = true, quote = null, showMembers = false;
function chipsOf(ids){ return ids.map(id => `<span class="at">@${esc(agentOf(id).name)}</span>`).join(" "); }
function stateLabel(r){
  return {done:`<span class="status on"><i></i>完成${r.elapsed ? "，用时 " + r.elapsed : ""}</span>`,
          working:`<span class="status busy"><i></i>干活中 ${r.elapsed}</span>`,
          queued:`<span class="status"><i></i>排队中，前面的做完就开始</span>`,
          error:`<span class="status err"><i></i>出错了</span>`}[r.state] || "";
}
function replyBody(p, r){
  const live = r.state === "working";
  const steps = r.steps.length ? `<div class="steps ${live ? "open" : ""}"><button onclick="this.parentElement.classList.toggle('open')">${live ? `<span class="spin"></span>正在${esc(r.steps[r.steps.length - 1].replace(/^(读了|修改|运行|新建)/, m => ({"读了":"读","修改":"修改","运行":"运行","新建":"新建"}[m])))}` : `做了 ${r.steps.length} 步`}${ICON.chev}</button>
    <ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>` : "";
  return `${steps}${r.text ? `<div class="answer">${r.text}</div>` : ""}`;
}
function taskHtml(p, t){
  return `<div class="msg me"><div style="max-width:80%">
      ${t.quote ? `<div class="quote">${seal(agentOf(t.quote.agent), "sm", false)}<span>${esc(t.quote.text)}</span></div>` : ""}
      <div class="bubble">${chipsOf(t.to)} ${esc(t.text)}</div>
      <div class="meta-r">${t.compare ? `<span class="tag">各做一份，对比结果</span>` : ""}<span>${t.time}</span></div></div></div>`;
}
function replyHtml(p, r){
  const a = agentOf(r.agent);
  return `<div class="msg"><div class="from-row">${seal(a, "sm", false)}<b>${esc(a.name)}</b><span class="tag">${BASE[a.base]}</span>${stateLabel(r)}</div>
    ${replyBody(p, r)}
    ${r.state === "done" ? `<div class="acts-row"><button class="link" onclick="forward('${p.id}','${r.agent}','${r.task}')">转给…</button><button class="link" onclick="toast('打开「${esc(a.name)}」在这个项目里的对话')">单独聊</button></div>` : ""}</div>`;
}
function compareHtml(p, t, rs){
  return `<div class="msg"><div class="compare">${rs.map(r => {
    const a = agentOf(r.agent);
    return `<div class="col ${r.chosen ? "chosen" : ""}"><div class="from-row">${seal(a, "sm", false)}<b>${esc(a.name)}</b><span class="tag">${BASE[a.base]}</span></div>
      <div style="margin:-2px 0 8px">${stateLabel(r)}</div>
      <div class="branch">${ICON.branch}${esc(r.branch)}${r.changed ? `<span class="muted">　${esc(r.changed)}</span>` : ""}</div>
      ${replyBody(p, r)}
      ${r.state === "done" ? `<div class="acts-row">${r.chosen ? `<span class="status on"><i></i>已用这个，改动合并进项目目录了</span>`
        : `<button class="btn" onclick="toast('打开改动对比')">看改动</button><button class="btn primary" onclick="choose('${p.id}','${t.id}','${r.agent}')">用这个</button><button class="link" onclick="forward('${p.id}','${r.agent}','${t.id}')">转给…</button>`}</div>` : ""}
    </div>`; }).join("")}</div></div>`;
}
function renderProject(id){
  const p = projOf(id); if (!p) return renderProjectEmpty();
  if (!rcpt.length || rcpt.some(r => !p.members.includes(r))) rcpt = [];
  let html = p.feed.length ? "" : `<div class="empty" style="margin-top:12vh"><h2>${esc(p.name)}</h2><p>输入 @ 选一个或几个 Agent，写上要做的事，就派出去了。</p></div>`;
  for (const f of p.feed){
    if (f.type === "task"){
      html += taskHtml(p, f);
      const rs = p.feed.filter(x => x.type === "reply" && x.task === f.id);
      html += f.compare ? compareHtml(p, f, rs) : rs.map(r => replyHtml(p, r)).join("");
    }
  }
  $("#main").innerHTML = `
    <div class="chat-head">
      ${pmark(p)}
      <div class="grow"><div class="name">${esc(p.name)}</div>
        <div class="meta">${p.dir ? `<span class="path">${esc(p.dir)}</span>` : `<span class="muted" style="font-size:12px">没有工作目录，各 Agent 在自己的工作区里干活</span>`}</div></div>
      <button class="btn" onclick="showMembers=!showMembers;renderProject('${p.id}')">成员 ${p.members.length}</button>
    </div>
    <div class="proj-body">
      <div class="proj-main">
        <div class="thread" id="thread">${html}</div>
        <div class="composer">
          <div class="box">
            ${quote ? `<div class="quote in-box">${seal(agentOf(quote.agent), "sm", false)}<span>${esc(quote.text)}</span><button class="icon-btn" aria-label="去掉引用" onclick="quote=null;renderProject('${p.id}')">✕</button></div>` : ""}
            <div class="rcpt">${rcpt.length ? rcpt.map(r => `<span class="at">@${esc(agentOf(r).name)}<button aria-label="去掉" onclick="rcpt=rcpt.filter(x=>x!=='${r}');renderProject('${p.id}')">✕</button></span>`).join("") : `<span class="muted" style="font-size:12px">先 @ 选派给谁</span>`}</div>
            <textarea id="input" rows="2" placeholder="输入 @ 选 Agent，再写要做的事" aria-label="派活"></textarea>
            <div class="bar">
              <button class="chip" onclick="atMenu(event,'${p.id}')">@ 选 Agent${ICON.down}</button>
              ${rcpt.length > 1 ? `<span class="seg mini"><button class="${!compareMode ? "on" : ""}" onclick="compareMode=false;renderProject('${p.id}')">一起做</button><button class="${compareMode ? "on" : ""}" onclick="compareMode=true;renderProject('${p.id}')">各做一份，对比</button></span>` : ""}
              <button class="send" aria-label="派出去" onclick="dispatch('${p.id}')">${ICON.up}</button>
            </div>
          </div>
          <div class="hint">${rcpt.length > 1 ? (compareMode ? "每个 Agent 在自己的分支上做同一件事，互不影响，做完并排对比，挑一个合并。" : "几个 Agent 在同一个目录里一起做，各自负责的部分写清楚，免得改到一起。") : "Enter 派出去，Shift + Enter 换行"}</div>
        </div>
      </div>
      ${showMembers ? membersPanel(p) : ""}
    </div>`;
  const t = $("#thread"); t.scrollTop = t.scrollHeight;
  const i = $("#input");
  i.addEventListener("keydown", e => {
    if (e.key === "@" ) { setTimeout(() => atMenu({currentTarget: i, stopPropagation(){}}, p.id), 0); }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); dispatch(p.id); }
  });
}
function membersPanel(p){
  const others = agents.filter(a => !p.members.includes(a.id));
  return `<aside class="members"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font:600 15px var(--song)">成员</b><button class="icon-btn" aria-label="收起" onclick="showMembers=false;renderProject('${p.id}')">✕</button></div>
    ${p.members.map(m => { const a = agentOf(m); return `<div class="mem">${seal(a)}<span class="t" style="flex:1;min-width:0"><span class="title">${esc(a.name)}</span><span class="sub">${a.state === "busy" ? esc(a.doing) : BASE[a.base]}</span></span>
      <button class="link" onclick="toast('打开「${esc(a.name)}」在这个项目里的对话')">单独聊</button><button class="link danger-link" onclick="removeMember('${p.id}','${m}')">移出</button></div>`; }).join("")}
    <div class="row" style="margin-top:12px">
      ${others.length ? `<button class="btn" onclick="addMemberMenu(event,'${p.id}')">${ICON.plus}拉人</button>` : ""}
      <button class="btn" onclick="quickAgent('${p.id}')">${ICON.plus}新建 Agent</button></div></aside>`;
}
function atMenu(e, pid){
  const p = projOf(pid);
  pop(e, `<div class="sec">派给谁（可以多选）</div>`
    + `<button onclick="rcpt=[...projOf('${pid}').members];closePop();renderProject('${pid}')"><span><div>所有人</div><div class="desc">${p.members.length} 个 Agent</div></span></button>`
    + p.members.map(m => { const a = agentOf(m); const on = rcpt.includes(m);
      return `<button onclick="event.stopPropagation();toggleRcpt('${pid}','${m}',this)">${seal(a, "sm", false)}<span><div>${esc(a.name)}</div><div class="desc">${BASE[a.base]}${a.state === "busy" ? "，正在干活" : ""}</div></span>${on ? `<span class="ck">✓</span>` : ""}</button>`; }).join("")
    + `<button onclick="closePop();quickAgent('${pid}')">${ICON.plus}新建一个 Agent 拉进来</button>`);
}
function toggleRcpt(pid, m, btn){
  rcpt = rcpt.includes(m) ? rcpt.filter(x => x !== m) : [...rcpt, m];
  const ck = btn.querySelector(".ck"); if (ck) ck.remove(); else btn.insertAdjacentHTML("beforeend", `<span class="ck">✓</span>`);
  const box = document.querySelector(".rcpt");
  box.innerHTML = rcpt.length ? rcpt.map(r => `<span class="at">@${esc(agentOf(r).name)}</span>`).join("") : `<span class="muted" style="font-size:12px">先 @ 选派给谁</span>`;
  document.addEventListener("click", function once(){ document.removeEventListener("click", once); renderProject(pid); }, {once:true});
}
function dispatch(pid){
  const p = projOf(pid), v = $("#input").value.trim();
  if (!rcpt.length) { toast("先 @ 选派给谁"); return; }
  if (!v) { $("#input").focus(); return; }
  const tid = "t" + Date.now(), compare = rcpt.length > 1 && compareMode;
  p.feed.push({type:"task", id:tid, time:"刚刚", text:v, to:[...rcpt], compare, quote});
  const rs = rcpt.map((m, k) => ({type:"reply", task:tid, agent:m, state:k === 0 || compare ? "working" : "queued", elapsed:"0 秒", steps:[], text:"",
                                  branch: compare ? `对比/${agentOf(m).name}` : null}));
  p.feed.push(...rs); p.last = "刚刚";
  rcpt = []; quote = null; renderProjectList(); renderProject(pid);
  rs.forEach((r, k) => {
    const plan = ["读了 README.md", "搜索 “" + v.slice(0, 6) + "”", "修改 src/" + ["index", "main", "app"][k % 3] + ".ts"];
    plan.forEach((s, j) => setTimeout(() => { r.state = "working"; r.steps.push(s); r.elapsed = (j + 1) * 2 + " 秒"; if (current.id === pid) renderProject(pid); }, 900 * (j + 1) + 400 * k));
    setTimeout(() => { r.state = "done"; r.elapsed = (plan.length * 2 + 1) + " 秒"; r.changed = compare ? `改了 ${k + 1} 个文件，+${12 + 7 * k} −${3 + k}` : null;
      r.text = `<p>${["按你说的做完了，改动集中在一个文件里，原来的接口没动。", "做完了。我换了个思路：先抽了一个公共函数，再改调用的地方，改动多一点但以后好维护。", "做完了，顺手补了两条测试。"][k % 3]}</p>`;
      if (current.id === pid) renderProject(pid); renderProjectList(); }, 900 * (plan.length + 1) + 400 * k);
  });
}
function choose(pid, tid, aid){
  const p = projOf(pid);
  p.feed.filter(f => f.type === "reply" && f.task === tid).forEach(r => r.chosen = r.agent === aid);
  renderProject(pid); toast(`已把「${agentOf(aid).name}」的改动合并进项目目录，其他分支保留着`);
}
function forward(pid, aid, tid){
  const p = projOf(pid), r = p.feed.find(f => f.type === "reply" && f.task === tid && f.agent === aid);
  quote = {agent:aid, text:r.text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 80)};
  rcpt = []; renderProject(pid); toast("选一个 Agent，写上要它接着做什么");
  setTimeout(() => atMenu({currentTarget: document.querySelector(".bar .chip"), stopPropagation(){}}, pid), 50);
}
function removeMember(pid, m){ const p = projOf(pid); p.members = p.members.filter(x => x !== m); rcpt = rcpt.filter(x => x !== m); renderProject(pid); renderProjectList(); toast("已移出，它在这个项目里的对话还留着"); }
function addMemberMenu(e, pid){
  const p = projOf(pid);
  pop(e, `<div class="sec">拉进项目</div>` + agents.filter(a => !p.members.includes(a.id)).map(a =>
    `<button onclick="closePop();projOf('${pid}').members.push('${a.id}');renderProject('${pid}');renderProjectList();toast('已拉进来')">${seal(a, "sm", false)}<span><div>${esc(a.name)}</div><div class="desc">${BASE[a.base]}</div></span></button>`).join(""), true);
}
function quickAgent(pid){
  closePop();
  const s = document.createElement("div"); s.className = "scrim"; s.onclick = e => { if (e.target === s) s.remove(); };
  s.innerHTML = `<div class="dialog" role="dialog" aria-label="新建 Agent"><header><h2>新建 Agent，拉进「${esc(projOf(pid).name)}」</h2><button class="icon-btn" aria-label="关闭" onclick="this.closest('.scrim').remove()">✕</button></header>
    <div class="body"><div class="form">
      <label for="q-name">名字</label><input id="q-name" class="input" placeholder="比如：设计、数据分析">
      <label for="q-role">角色说明</label><textarea id="q-role" class="textarea" placeholder="它负责什么、有什么要求"></textarea>
      <label>底座</label><div class="seg"><button class="on" onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this))">Claude Code</button><button onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this))">Codex</button></div>
    </div><p class="muted" style="font-size:13px;margin:14px 0 0">它在项目目录里干活。头像、默认模型这些以后可以在 Agent 页再改。</p></div>
    <footer><button class="btn" onclick="this.closest('.scrim').remove()">取消</button><button class="btn primary" onclick="createQuick('${pid}')">新建并拉进来</button></footer></div>`;
  document.body.append(s); $("#q-name").focus();
}
function createQuick(pid){
  const name = $("#q-name").value.trim(); if (!name) { toast("先给它起个名字"); return; }
  const id = "a" + Date.now(), codex = document.querySelector(".scrim .seg button:last-child").classList.contains("on");
  agents.push({id, name, seal:[...name.replace(/\s/g, "")].slice(0, 2).join(""), color:["zhu", "huang", "lu", "zhe", "dai"][agents.length % 5], base:codex ? "codex" : "claude",
               model:null, effort:null, role:$("#q-role").value, dir:null, state:"on", channels:{feishu:null, weixin:null}, last:"刚刚"});
  projOf(pid).members.push(id); rcpt = [id];
  document.querySelector(".scrim").remove(); showMembers = true; renderProject(pid); renderProjectList(); toast(`「${name}」已拉进项目，现在可以 @ 它了`);
}
function newProject(){
  const picked = new Set();
  const s = document.createElement("div"); s.className = "scrim"; s.onclick = e => { if (e.target === s) s.remove(); };
  const draw = () => { s.innerHTML = `<div class="dialog" role="dialog" aria-label="新建项目"><header><h2>新建项目</h2><button class="icon-btn" aria-label="关闭" onclick="this.closest('.scrim').remove()">✕</button></header>
    <div class="body"><div class="form">
      <label for="np-name">名字</label><input id="np-name" class="input" placeholder="比如：官网改版">
      <label>工作目录</label><div><div class="row"><input class="input" style="flex:1" placeholder="不填也行"><button class="btn" onclick="toast('打开选择文件夹窗口')">${ICON.folder}选择…</button></div>
        <div class="help">填了的话，拉进来的 Agent 都在这个目录里干活；不填就各在各的工作区。</div></div>
      <label>拉哪些 Agent</label><div class="picks" style="margin:0">${agents.map(a => `<button class="pick ${picked.has(a.id) ? "on" : ""}" data-id="${a.id}">${seal(a, "", false)}<span><div class="nm">${esc(a.name)}</div><div class="ds">${BASE[a.base]}</div></span></button>`).join("")}</div>
    </div></div>
    <footer><button class="btn" onclick="this.closest('.scrim').remove()">取消</button><button class="btn primary" id="np-ok">新建项目</button></footer></div>`;
    s.querySelectorAll(".pick").forEach(b => b.onclick = () => { const v = $("#np-name").value; picked.has(b.dataset.id) ? picked.delete(b.dataset.id) : picked.add(b.dataset.id); draw(); $("#np-name").value = v; });
    $("#np-ok").onclick = () => { const name = $("#np-name").value.trim(); if (!name) { toast("先给项目起个名字"); return; }
      const id = "p" + Date.now(); projects.unshift({id, name, dir:null, members:[...picked], last:"刚刚", feed:[]}); s.remove(); location.hash = `#/projects/${id}`; };
  };
  draw(); document.body.append(s); $("#np-name").focus();
}

if (!location.hash) location.hash = "#/projects/p1"; else route();
</script>
